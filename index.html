<body class="bg-gray-100 font-sans h-screen overflow-hidden">

  <div id="login-view" class="flex items-center justify-center h-full">

  <script>
    let nombreCoordinadorActual = "";
    let usuarioLogueadoActual = "";
    let rolUsuarioActual = "";
    let tokenSesionActual = "";
    let docentePendienteEdicion = null;
    const loginView = document.getElementById('login-view');
    const appView = document.getElementById('app-view');
    const sessionStore = Vue.reactive({
      nombre: '',
      usuario: '',
      rol: '',
      token: '',
      autenticado: false
    });
    const appShellState = Vue.reactive({
      sidebarOpen: false,
      currentView: 'dashboard',
      menuVersion: 0,
      userVersion: 0
    });

    function sincronizarVariablesSesionDesdeStore() {
      nombreCoordinadorActual = sessionStore.nombre || '';
      usuarioLogueadoActual = sessionStore.usuario || '';
      rolUsuarioActual = sessionStore.rol || '';
      tokenSesionActual = sessionStore.token || '';
    }

    function establecerSesionActiva(datos = {}) {
      sessionStore.nombre = (datos.nombre || '').toString();
      sessionStore.usuario = (datos.usuario || '').toString();
      sessionStore.rol = (datos.rol || '').toString();
      sessionStore.token = (datos.token || '').toString();
      sessionStore.autenticado = !!sessionStore.token;
      sincronizarVariablesSesionDesdeStore();
    }

    function limpiarSesionActiva() {
      sessionStore.nombre = '';
      sessionStore.usuario = '';
      sessionStore.rol = '';
      sessionStore.token = '';
      sessionStore.autenticado = false;
      sincronizarVariablesSesionDesdeStore();
    }

    function obtenerSesionActual() {
      return sessionStore;
    }

    function obtenerTokenSesionActual() {
      return sessionStore.token || tokenSesionActual || '';
    }

    function manejarSesionExpirada(respuesta) {
      const mensaje = respuesta && (respuesta.error || respuesta.message);
      if (mensaje === 'Sesión inválida o expirada. Vuelve a iniciar sesión.') {
        alert('Tu sesión expiró. Ingresa nuevamente.');
        cerrarSesion();
        return true;
      }
      return false;
    }

    function normalizarErrorGs(error) {
      if (!error) return new Error('Error de conexión.');
      if (error instanceof Error) return error;
      const mensaje = typeof error === 'string'
        ? error
        : (error.message || error.error || error.toString?.() || 'Error de conexión.');
      const err = new Error(mensaje);
      err.raw = error;
      return err;
    }

    function obtenerMensajeError(error, mensajePorDefecto = 'Error de conexión.') {
      if (!error) return mensajePorDefecto;
      if (typeof error === 'string') return error;
      return error.message || error.error || mensajePorDefecto;
    }

    function esErrorSesionExpirada(error) {
      return !!(error && error.sessionExpired);
    }

    const gsService = {
      run(methodName, ...args) {
        return new Promise((resolve, reject) => {
          try {
            google.script.run
              .withSuccessHandler(resolve)
              .withFailureHandler((error) => reject(normalizarErrorGs(error)))[methodName](...args);
          } catch (error) {
            reject(normalizarErrorGs(error));
          }
        });
      },
      runWithSession(methodName, ...args) {
        return this.run(methodName, ...args).then((respuesta) => {
          if (manejarSesionExpirada(respuesta)) {
            const error = new Error('Sesión inválida o expirada. Vuelve a iniciar sesión.');
            error.sessionExpired = true;
            error.response = respuesta;
            throw error;
          }
          return respuesta;
        });
      }
    };

    const services = {
      auth: {
        login(usuario, password) {
          return gsService.run('validarCredenciales', usuario, password);
        },
        logout(token) {
          if (!token) return Promise.resolve();
          return gsService.run('cerrarSesionServidor', token).catch(() => null);
        }
      },
      access: {
        obtenerPanel(token) {
          return gsService.runWithSession('obtenerUsuariosAcceso', token);
        },
        guardar(token, payload) {
          return gsService.runWithSession('guardarUsuarioAcceso', token, payload);
        },
        cambiarEstatus(token, payload) {
          return gsService.runWithSession('cambiarEstatusUsuarioAcceso', token, payload);
        },
        eliminar(token, payload) {

      nomina: {

        },
        guardarGlobal(token, datos, periodo) {

      incidencias: {

        },

      cierre: {

        obtenerPreview(token, payload) {

        },

      extras: {

          return gsService.runWithSession('obtenerDatosCapturaExtras', token);
        },

          return gsService.runWithSession('guardarExtras', token, payload);

    const TIPOS_PAGO_DESCRIPCION = {
      'E': 'Efectivo',
      '1': 'Santander',
      '2': 'Banorte'
    };

    function abrirMenuLateral() {
      toggleMenu();
    }

    function describirTipoPago(tipo) {
      return TIPOS_PAGO_DESCRIPCION[tipo] || 'Sin definir';
    }

    function formatearMonedaMX(valor) {
      return '$' + (parseFloat(valor) || 0).toLocaleString('es-MX', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function formatearHorasNumero(valor, decimales = 1) {
      const numero = parseFloat(valor) || 0;
      return Number.isInteger(numero) ? numero.toString() : numero.toFixed(decimales);
    }

    function asignarMensajeTemporal(ctx, tipo, texto, duracionMs = 3000) {
      if (!ctx) return;
      ctx.mensaje = { tipo, texto };
      if (!texto) return;
      setTimeout(() => {
        if (ctx.mensaje && ctx.mensaje.texto === texto) {
          ctx.mensaje = { tipo: '', texto: '' };
        }
      }, duracionMs);
    }

    function descargarCsvDesdeMatriz(nombreArchivo, encabezados, filas) {
      const escapar = (valor) => '"' + String(valor ?? '').replace(/"/g, '""') + '"';
      const lineas = [encabezados.map(escapar).join(',')]
        .concat((filas || []).map((fila) => (fila || []).map(escapar).join(',')));
      const csv = '\ufeff' + lineas.join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = nombreArchivo;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function abrirUrlNuevaPestana(url, target = '_blank') {
      if (!url) return false;
      window.open(url, target, 'noopener');
      return true;
    }

    function normalizarValorCierreCliente(valor) {
      return (valor || '')
        .toString()
        .replace(/[\u00A0\u2007\u202F]/g, ' ')
        .replace(/[\u2010-\u2015]/g, '-')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function normalizarPeriodoCierreCliente(valor) {
      return normalizarValorCierreCliente(valor)
        .replace(/\s*al\s*/ig, ' al ')
        .replace(/\s*\/\s*/g, '/')
        .replace(/\s*-\s*/g, '-')
        .trim();
    }

    function normalizarCuatrimestreCierreCliente(valor) {
      return normalizarValorCierreCliente(valor).replace(/\s*\-\s*/g, '-');
    }

    function obtenerItemsMenuPorRol() {
      const rol = ((sessionStore.rol || rolUsuarioActual || '')).toLowerCase();
      const esFinanzas = ['admin', 'finanzas', 'contador', 'contabilidad'].includes(rol);

      const items = [
        { view: 'dashboard', label: 'Dashboard', icon: 'fa-chart-line', clases: 'from-blue-500/20 to-cyan-500/10 border-blue-400/20 text-blue-100' },
        { view: 'capturar-docente', label: 'Capturar Docente', icon: 'fa-user-plus', clases: 'from-violet-500/20 to-fuchsia-500/10 border-violet-400/20 text-violet-100' },
        { view: 'capturar-horarios', label: 'Capturar Horarios', icon: 'fa-calendar-alt', clases: 'from-sky-500/20 to-blue-500/10 border-sky-400/20 text-sky-100' },
        { view: 'capturar-incidencias', label: 'Capturar Incidencias', icon: 'fa-exclamation-circle', clases: 'from-amber-500/20 to-orange-500/10 border-amber-400/20 text-amber-100' },
        { view: 'capturar-extras', label: 'Capturar Extras', icon: 'fa-plus-circle', clases: 'from-emerald-500/20 to-teal-500/10 border-emerald-400/20 text-emerald-100' },
        { view: 'nomina-completa', label: 'Nómina', icon: 'fa-file-invoice-dollar', clases: 'from-indigo-500/20 to-blue-500/10 border-indigo-400/20 text-indigo-100' },
        { view: 'reportes', label: 'Reportes', icon: 'fa-file-invoice-dollar', clases: 'from-cyan-500/20 to-sky-500/10 border-cyan-400/20 text-cyan-100' },
        { view: 'estadisticas', label: 'Estadísticas', icon: 'fa-chart-pie', clases: 'from-pink-500/20 to-rose-500/10 border-pink-400/20 text-pink-100' }
      ];

      if (esFinanzas) {
        items.push(
          { view: 'finanzas-contador', label: 'Finanzas / Contador', icon: 'fa-folder-open', clases: 'from-emerald-500/20 to-green-500/10 border-emerald-400/20 text-emerald-100' },
          { view: 'pendientes-fiscales', label: 'Pendientes Fiscales', icon: 'fa-file-circle-exclamation', clases: 'from-amber-500/20 to-yellow-500/10 border-amber-400/20 text-amber-100' }
        );
      }

      if (rol === 'admin') {
        items.push(
          { view: 'control-accesos', label: 'Control de Accesos', icon: 'fa-user-shield', clases: 'from-cyan-500/20 to-blue-500/10 border-cyan-400/20 text-cyan-100' },
          { view: 'configuracion-calendario', label: 'Configuración Calendario', icon: 'fa-calendar-days', clases: 'from-fuchsia-500/20 to-violet-500/10 border-fuchsia-400/20 text-fuchsia-100' },
          { view: 'bitacora-eliminados-horarios', label: 'Bitácora Eliminados', icon: 'fa-trash-alt', clases: 'from-red-500/20 to-rose-500/10 border-red-400/20 text-red-100' },
          { view: 'cierre-cuatrimestre', label: 'Cierre Cuatrimestre', icon: 'fa-box-archive', clases: 'from-slate-500/20 to-zinc-500/10 border-slate-400/20 text-slate-100' }
        );
      }

      return items;
    }

    function obtenerEtiquetaRol() {
      const rol = ((sessionStore.rol || rolUsuarioActual || '')).toLowerCase();
      if (!rol) return 'Usuario';
      if (rol === 'admin') return 'Administrador';
      if (rol === 'finanzas') return 'Finanzas';
      if (rol === 'contador' || rol === 'contabilidad') return 'Contador';
      return rol.charAt(0).toUpperCase() + rol.slice(1);
    }

    function obtenerInicialesSesion() {
      const base = (sessionStore.nombre || sessionStore.usuario || nombreCoordinadorActual || usuarioLogueadoActual || 'US').toString().trim();
      if (!base) return 'US';
      const partes = base.split(/\s+/).filter(Boolean);
      if (partes.length === 1) return partes[0].slice(0, 2).toUpperCase();
      return (partes[0][0] + partes[1][0]).toUpperCase();
    }

    function actualizarVisibilidadNavFinanzas() {
      appShellState.menuVersion += 1;
      appShellState.userVersion += 1;
    }

    function montarAppShellVue() {
      const root = document.getElementById('app-shell-root');
      if (!root) return;

      if (window.appShellVueApp) return;

      const { createApp } = Vue;
      window.appShellVueApp = createApp({
        data() {
          return {
            shell: appShellState
          };
        },
        computed: {
          menuItems() {
            this.shell.menuVersion;
            return obtenerItemsMenuPorRol();
          },
          nombreSesion() {
            return sessionStore.nombre || sessionStore.usuario || 'Usuario';
          },
          usuarioSesion() {
            return sessionStore.usuario || 'Sin usuario';
          },
          rolSesion() {
            return obtenerEtiquetaRol();
          },
          inicialesSesion() {
            return obtenerInicialesSesion();
          }
        },
        methods: {
          abrirVista(vista) {
            cambiarVista(vista, null);
          },
          alternarSidebar() {
            toggleMenu();
          },
          cerrarSesionShell() {
            cerrarSesion();
          },
          clasesItem(item) {
            const activo = this.shell.currentView === item.view || (item.view === 'nomina-completa' && this.shell.currentView === 'nomina');
            if (activo) {
              return 'bg-gradient-to-r ' + item.clases + ' shadow-lg ring-1 ring-inset ring-white/10';
            }
            return 'text-slate-300 hover:text-white hover:bg-slate-800/80';
          }
        },
        template: `
          <div class="relative h-full">
            <div v-if="shell.sidebarOpen" @click="alternarSidebar" class="absolute inset-0 bg-slate-950/30 z-30"></div>

            <aside class="fixed inset-y-0 left-0 z-40 w-72 bg-slate-900 text-white border-r border-slate-800 shadow-2xl transition-transform duration-300 flex flex-col" :class="shell.sidebarOpen ? 'translate-x-0' : '-translate-x-full'">
              <div class="h-20 border-b border-slate-800 px-4 flex items-center justify-between">
                <div class="flex items-center gap-3 min-w-0">
                  <div class="h-11 w-11 rounded-2xl bg-gradient-to-br from-blue-600 via-indigo-600 to-violet-600 flex items-center justify-center shadow-lg ring-1 ring-white/10">
                    <i class="fas fa-building-columns text-white text-lg"></i>
                  </div>
                  <div class="min-w-0">
                    <div class="text-sm font-black uppercase tracking-[0.18em] text-slate-300 truncate">Sistema Nómina</div>
                    <div class="text-xs text-slate-400 truncate">Frontend Vue en Apps Script</div>
                  </div>
                </div>
                <button @click="alternarSidebar" type="button" class="h-10 w-10 rounded-xl border border-slate-700 bg-slate-800 hover:bg-slate-700 transition flex items-center justify-center">
                  <i class="fas fa-xmark text-base"></i>
                </button>
              </div>

              <div class="px-3 py-4 border-b border-slate-800">
                <div class="rounded-2xl bg-slate-800/90 border border-slate-700 p-3 flex items-center gap-3">
                  <div class="h-11 w-11 rounded-2xl bg-gradient-to-br from-emerald-500 to-cyan-500 text-slate-950 font-black flex items-center justify-center shadow-lg">
                    {{ inicialesSesion }}
                  </div>
                  <div class="min-w-0">
                    <div class="font-black text-sm truncate">{{ nombreSesion }}</div>
                    <div class="text-xs text-slate-400 truncate">{{ usuarioSesion }}</div>
                    <div class="mt-1 inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-bold bg-slate-700 text-slate-100 border border-slate-600">
                      {{ rolSesion }}
                    </div>
                  </div>
                </div>
              </div>

              <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-1.5">
                <button
                  v-for="item in menuItems"
                  :key="item.view"
                  type="button"
                  @click="abrirVista(item.view)"
                  class="w-full group transition-all duration-200 rounded-2xl border border-transparent"
                  :class="clasesItem(item)"
                >
                  <div class="flex items-center gap-3 px-3 py-3">
                    <div class="h-10 w-10 rounded-xl bg-slate-800/80 border border-slate-700 flex items-center justify-center shrink-0 group-hover:bg-slate-700/80">
                      <i class="fas" :class="item.icon"></i>
                    </div>
                    <div class="text-left min-w-0">
                      <div class="font-bold text-sm truncate">{{ item.label }}</div>
                      <div class="text-[11px] text-slate-400 truncate">Abrir módulo</div>
                    </div>
                  </div>
                </button>
              </nav>

              <div class="p-3 border-t border-slate-800">
                <button @click="cerrarSesionShell" type="button" class="w-full rounded-2xl bg-red-600 hover:bg-red-700 transition text-white font-black py-3 px-4 flex items-center gap-3 justify-start">

    function mostrarAplicacionPrincipal() {
      actualizarVisibilidadNavFinanzas();
      montarAppShellVue();
      loginView.classList.add('hidden');
      appView.classList.remove('hidden');
    }

    function montarLoginVue() {
      const root = document.getElementById('login-vue-root');
      if (!root) return;

      if (window.loginVueApp) {
        try { window.loginVueApp.unmount(); } catch (e) {}
        window.loginVueApp = null;
      }

      const { createApp } = Vue;
      window.loginVueApp = createApp({
        data() {
          return {
            usuario: '',
            password: '',
            cargando: false,
            error: ''
          };
        },
        methods: {
          iniciarSesion() {
            if (this.cargando) return;
            this.error = '';
            this.cargando = true;

            services.auth.login(this.usuario, this.password)
              .then((respuesta) => {
                this.cargando = false;
                if (respuesta && respuesta.success) {
                  establecerSesionActiva({
                    nombre: respuesta.nombre || '',
                    usuario: this.usuario,
                    rol: respuesta.rol || '',
                    token: respuesta.token || ''
                  });
                  mostrarAplicacionPrincipal();
                  cambiarVista('dashboard', null);
                } else {
                  this.error = (respuesta && (respuesta.message || respuesta.error)) || 'No fue posible iniciar sesión.';
                }
              })
              .catch((error) => {
                this.cargando = false;
                this.error = obtenerMensajeError(error, 'Error de conexión.');
              });
          }
        },
        template: `
          <div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-lg">
            <div class="text-center mb-6">
              <h1 class="text-2xl font-bold text-gray-800">Nómina Docente</h1>
              <p class="text-sm text-gray-500">Inicia sesión para continuar</p>
            </div>

            <form @submit.prevent="iniciarSesion">
              <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Usuario</label>
                <input v-model.trim="usuario" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" type="text" placeholder="ej. admin" autocomplete="username" required>
              </div>

              <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Contraseña</label>
                <input v-model="password" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" type="password" placeholder="********" autocomplete="current-password" required>
                <p v-if="error" class="text-red-500 text-xs italic">{{ error }}</p>
              </div>

              <button :disabled="cargando" class="bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full flex justify-center items-center gap-2" type="submit">
                <i v-if="cargando" class="fas fa-spinner fa-spin"></i>
                <span>{{ cargando ? 'Verificando...' : 'Entrar' }}</span>
              </button>
            </form>
          </div>
        `

    function desmontarVueAppGlobal(nombreRef) {
      if (!nombreRef || !window[nombreRef]) return;
      try {
        window[nombreRef].unmount();
      } catch (e) {}
      window[nombreRef] = null;
    }

    function montarVistaAsync(contenedor, opciones) {
      const {
        shellAppKey,
        childAppKey,
        rootId,
        title,
        loaderText,
        loaderIconClass = 'fa-sync text-blue-500',
        fetcher,
        mounter
      } = opciones;

      desmontarVueAppGlobal(shellAppKey);
      desmontarVueAppGlobal(childAppKey);

      contenedor.innerHTML = `<div id="${rootId}"></div>`;
      const root = document.getElementById(rootId);
      if (!root) return;

      const { createApp, nextTick } = Vue;
      window[shellAppKey] = createApp({
        data() {
          return {
            cargando: true,
            error: '',
            payload: null
          };
        },
        mounted() {
          this.cargar();
        },
        beforeUnmount() {
          desmontarVueAppGlobal(childAppKey);
        },
        methods: {
          abrirMenu: abrirMenuLateral,
          async cargar() {
            this.cargando = true;
            this.error = '';
            this.payload = null;
            desmontarVueAppGlobal(childAppKey);

            try {
              const res = await fetcher();
              if (!res || !res.success) {
                this.error = (res && res.error) || 'No fue posible cargar la vista.';
                this.cargando = false;
                return;
              }
              this.payload = res;
              this.cargando = false;
              await nextTick();
              if (this.$refs.childRoot) {
                mounter(this.$refs.childRoot, res);
              }
            } catch (err) {
              if (esErrorSesionExpirada(err)) {
                this.cargando = false;
                return;
              }
              this.error = obtenerMensajeError(err, 'Error de conexión.');
              this.cargando = false;
            }
          }
        },
        template: `
          <div>
            <div class="flex items-center mb-6">
              <button @click="abrirMenu" class="mr-4 bg-gray-200 hover:bg-gray-300 text-gray-700 p-2 rounded focus:outline-none transition shadow-sm" title="Ocultar/Mostrar Menú">
                <i class="fas fa-bars text-xl"></i>
              </button>
              <h2 class="text-3xl font-semibold text-gray-800">${title}</h2>
            </div>

            <div v-if="cargando" class="flex flex-col items-center justify-center py-16">
              <i class="fas fa-spin text-4xl mb-3" :class="'${loaderIconClass}'"></i>
              <p class="text-gray-500">${loaderText}</p>
            </div>

            <div v-else-if="error" class="max-w-3xl bg-white rounded-xl shadow border border-red-100 p-6">
              <p class="text-red-500 font-semibold">{{ error }}</p>
            </div>

            <div v-else ref="childRoot"></div>
          </div>
        `
      }).mount(root);
    }

    function montarVistaSync(contenedor, opciones) {
      const {
        shellAppKey,
        childAppKey,
        rootId,
        mounter
      } = opciones;

      desmontarVueAppGlobal(shellAppKey);
      desmontarVueAppGlobal(childAppKey);

      contenedor.innerHTML = `<div id="${rootId}"></div>`;
      const root = document.getElementById(rootId);
      if (!root) return;

      const { createApp, nextTick } = Vue;
      window[shellAppKey] = createApp({
        async mounted() {
          await nextTick();
          if (this.$refs.childRoot) {
            mounter(this.$refs.childRoot);
          }
        },
        beforeUnmount() {
          desmontarVueAppGlobal(childAppKey);
        },
        template: `<div ref="childRoot"></div>`
      }).mount(root);
    }

    function obtenerVistaCanonical(vista) {
      return vista === 'nomina-completa' ? 'nomina' : vista;
    }

    function desmontarAppsFueraDeVista(vistaCanonical) {
      Object.keys(VIEW_REGISTRY).forEach((clave) => {
        if (clave === vistaCanonical) return;
        (VIEW_REGISTRY[clave].unmountKeys || []).forEach(desmontarVueAppGlobal);
      });
    }

    function renderizarVistaPlaceholder(vista) {
      const contentDiv = document.getElementById('main-content');
      let titulo = vista.replace('-', ' ').toUpperCase();
      contentDiv.innerHTML = `
        <h2 class="text-3xl font-semibold text-gray-800 mb-6">${titulo}</h2>
        <div class="bg-white p-6 rounded-lg shadow flex items-center justify-center h-64 border-2 border-dashed border-gray-300">
          <p class="text-gray-500 italic">El módulo está en construcción...</p>
        </div>
      `;
    }

    function cambiarVista(vista, event) {
      const vistaCanonical = obtenerVistaCanonical(vista);
      desmontarAppsFueraDeVista(vistaCanonical);
      appShellState.currentView = vista;

      const contentDiv = document.getElementById('main-content');
      const configVista = VIEW_REGISTRY[vistaCanonical];
      if (!configVista || typeof configVista.render !== 'function') {
        renderizarVistaPlaceholder(vista);
        return;
      }
      configVista.render(contentDiv);
    }

      });

    function montarControlAccesosVue(root, payload) {
      const { createApp } = Vue;

      window.controlAccesosVueApp = createApp({
        data() {
          return {
            usuarioSesion: payload.usuarioSesion || usuarioLogueadoActual || '',
            nombreSesion: payload.nombreSesion || nombreCoordinadorActual || '',
            usuarios: payload.usuarios || [],
            resumenBackend: payload.resumen || {},
            rolesDisponibles: payload.roles || ['admin', 'coordinador', 'finanzas', 'contador', 'contabilidad'],
            filtroTexto: '',
            filtroRol: 'TODOS',
            filtroEstatus: 'TODOS',
            modo: 'crear',
            guardando: false,
            procesandoFila: null,
            mensaje: { tipo: '', texto: '' },
            form: obtenerFormularioUsuarioAccesoVacio()
          };
        },
        computed: {
          usuariosFiltrados() {
            const texto = (this.filtroTexto || '').toLowerCase().trim();
            return (this.usuarios || [])
              .filter((usuario) => {
                const coincideTexto = !texto || [usuario.nombre, usuario.usuario, usuario.rol, usuario.estatus, usuario.observacion]
                  .join(' ')
                  .toLowerCase()
                  .includes(texto);
                const coincideRol = this.filtroRol === 'TODOS' || (usuario.rol || '') === this.filtroRol;
                const coincideEstatus = this.filtroEstatus === 'TODOS' || (usuario.estatus || 'ACTIVO') === this.filtroEstatus;
                return coincideTexto && coincideRol && coincideEstatus;
              })
              .sort((a, b) => (a.nombre || '').localeCompare((b.nombre || ''), 'es', { sensitivity: 'base' }));
          },
          resumenVista() {
            const base = this.usuariosFiltrados || [];
            return {
              total: base.length,
              activos: base.filter((u) => (u.estatus || 'ACTIVO') === 'ACTIVO').length,
              inactivos: base.filter((u) => (u.estatus || 'ACTIVO') === 'INACTIVO').length,
              admins: base.filter((u) => (u.rol || '') === 'admin').length
            };
          },
          esEdicion() {
            return this.modo === 'editar';
          },
          textoBotonGuardar() {
            if (this.guardando) return this.esEdicion ? 'Guardando cambios...' : 'Creando usuario...';
            return this.esEdicion ? 'Guardar cambios' : 'Crear usuario';
          }
        },
        methods: {
          abrirMenu: abrirMenuLateral,
          setMensaje(tipo, texto) {
            asignarMensajeTemporal(this, tipo, texto, 3200);
          },
          etiquetaRol(rol) {
            const mapa = {
              admin: 'Administrador',
              coordinador: 'Coordinador',
              finanzas: 'Finanzas',
              contador: 'Contador',
              contabilidad: 'Contabilidad'
            };
            return mapa[(rol || '').toLowerCase()] || (rol || 'Sin rol');
          },
          badgeRol(rol) {
            const mapa = {
              admin: 'bg-red-100 text-red-700 border border-red-200',
              coordinador: 'bg-blue-100 text-blue-700 border border-blue-200',
              finanzas: 'bg-emerald-100 text-emerald-700 border border-emerald-200',
              contador: 'bg-amber-100 text-amber-700 border border-amber-200',
              contabilidad: 'bg-violet-100 text-violet-700 border border-violet-200'
            };
            return mapa[(rol || '').toLowerCase()] || 'bg-slate-100 text-slate-700 border border-slate-200';
          },
          badgeEstatus(estatus) {
            return (estatus || 'ACTIVO') === 'ACTIVO'
              ? 'bg-emerald-100 text-emerald-700 border border-emerald-200'
              : 'bg-slate-100 text-slate-700 border border-slate-200';
          },
          limpiarFiltros() {
            this.filtroTexto = '';
            this.filtroRol = 'TODOS';
            this.filtroEstatus = 'TODOS';
          },
          nuevoUsuario() {
            this.modo = 'crear';
            this.form = obtenerFormularioUsuarioAccesoVacio();
          },
          editarUsuario(usuario) {
            this.modo = 'editar';
            this.form = {
              filaHoja: usuario.filaHoja,
              nombre: usuario.nombre || '',
              usuario: usuario.usuario || '',
              password: '',
              rol: usuario.rol || 'coordinador',
              estatus: usuario.estatus || 'ACTIVO',
              observacion: usuario.observacion || ''
            };
            window.scrollTo({ top: 0, behavior: 'smooth' });
          },
          async recargarUsuarios(filaMantener = null) {
            const res = await services.access.obtenerPanel(obtenerTokenSesionActual());
            if (!res || !res.success) {
              throw new Error((res && res.error) || 'No fue posible recargar los usuarios.');
            }
            this.usuarios = res.usuarios || [];
            this.resumenBackend = res.resumen || {};
            this.rolesDisponibles = res.roles || this.rolesDisponibles;

            if (this.esEdicion && filaMantener) {
              const actualizado = this.usuarios.find((u) => u.filaHoja === filaMantener);
              if (actualizado) {
                this.editarUsuario(actualizado);
              } else {
                this.nuevoUsuario();
              }
            }
          },
          guardarUsuario() {
            if (this.guardando) return;
            if (!(this.form.nombre || '').trim() || !(this.form.usuario || '').trim()) {
              this.setMensaje('error', 'Captura nombre y usuario antes de guardar.');
              return;
            }
            if (!this.esEdicion && !(this.form.password || '').trim()) {
              this.setMensaje('error', 'La contraseña es obligatoria al crear un usuario.');
              return;
            }

            this.guardando = true;
            const payloadGuardar = {
              filaHoja: this.form.filaHoja,
              nombre: (this.form.nombre || '').toString().trim(),
              usuario: (this.form.usuario || '').toString().trim(),
              password: (this.form.password || '').toString(),
              rol: this.form.rol,
              estatus: this.form.estatus,
              observacion: (this.form.observacion || '').toString().trim()
            };

            services.access.guardar(obtenerTokenSesionActual(), payloadGuardar)
              .then(async (res) => {
                this.guardando = false;
                if (!res.success) {
                  this.setMensaje('error', res.error || 'No fue posible guardar el usuario.');
                  return;
                }
                this.setMensaje('ok', res.message || 'Usuario guardado correctamente.');
                await this.recargarUsuarios(this.esEdicion ? payloadGuardar.filaHoja : null);
                if (!this.esEdicion) {
                  this.nuevoUsuario();
                }
              })
              .catch((error) => {
                if (esErrorSesionExpirada(error)) return;
                this.guardando = false;
                this.setMensaje('error', obtenerMensajeError(error, 'Error de conexión al guardar el usuario.'));
              });
          },
          cambiarEstatus(usuario) {
            if (!usuario || this.procesandoFila) return;
            const nuevoEstatus = (usuario.estatus || 'ACTIVO') === 'ACTIVO' ? 'INACTIVO' : 'ACTIVO';
            const confirmacion = confirm(`¿Deseas ${nuevoEstatus === 'ACTIVO' ? 'activar' : 'inactivar'} a ${usuario.nombre || usuario.usuario}?`);
            if (!confirmacion) return;

            this.procesandoFila = usuario.filaHoja;
            services.access.cambiarEstatus(obtenerTokenSesionActual(), { filaHoja: usuario.filaHoja, estatus: nuevoEstatus })
              .then(async (res) => {
                this.procesandoFila = null;
                if (!res.success) {
                  this.setMensaje('error', res.error || 'No fue posible actualizar el estatus.');
                  return;
                }
                this.setMensaje('ok', res.message || 'Estatus actualizado correctamente.');
                await this.recargarUsuarios(this.esEdicion ? this.form.filaHoja : null);
              })
              .catch((error) => {
                if (esErrorSesionExpirada(error)) return;
                this.procesandoFila = null;
                this.setMensaje('error', obtenerMensajeError(error, 'Error de conexión al cambiar el estatus.'));
              });
          },
          eliminarUsuario(usuario) {
            if (!usuario || this.procesandoFila) return;
            const confirmacion = confirm(`Esta acción eliminará a ${usuario.nombre || usuario.usuario}. ¿Deseas continuar?`);
            if (!confirmacion) return;

            this.procesandoFila = usuario.filaHoja;
            services.access.eliminar(obtenerTokenSesionActual(), { filaHoja: usuario.filaHoja })
              .then(async (res) => {
                this.procesandoFila = null;
                if (!res.success) {
                  this.setMensaje('error', res.error || 'No fue posible eliminar el usuario.');
                  return;
                }
                if (this.form.filaHoja === usuario.filaHoja) {
                  this.nuevoUsuario();
                }
                this.setMensaje('ok', res.message || 'Usuario eliminado correctamente.');
                await this.recargarUsuarios();
              })
              .catch((error) => {
                if (esErrorSesionExpirada(error)) return;
                this.procesandoFila = null;
                this.setMensaje('error', obtenerMensajeError(error, 'Error de conexión al eliminar el usuario.'));
              });
          }
        },
        template: `

            <div class="bg-gradient-to-r from-cyan-700 via-blue-700 to-slate-900 rounded-3xl shadow-xl p-8 text-white overflow-hidden relative">

          },
          obtenerNombreFiltro(tipo) {
            if (tipo === 'E') return 'Efectivo';
            if (tipo === '1') return 'Santander';
            if (tipo === '2') return 'Banorte';
            if (tipo === 'X') return 'Sin definir';
            return 'Todos';
          },
          obtenerResumenTipo(tipo) {
            const bloque = (this.resumenPorTipo || {})[tipo] || {};
            return {
              total: bloque.total || 0,
              cantidad: bloque.cantidad || 0

          },
          aplicarFiltro(tipo) {
            this.filtroTipo = tipo;

            this.cargando = true;

            this.mensajeGuardado = '';

            services.nomina.obtenerDatos(tokenSesionActual)

                this.cargando = false;

              });
          },

            this.guardando = true;
            this.mensajeGuardado = '';

            services.nomina.guardarGlobal(tokenSesionActual, this.datos, this.periodo)

    function montarReportesVue(root) {
      const { createApp } = Vue;

      window.reportesVueApp = createApp({
        data() {
          return {
            cargando: true,
            error: '',
            periodo: '',
            pesos: {},
            registros: [],
            coordinaciones: [],
            filtroTexto: '',
            filtroCoordinador: 'TODOS',
            filtroTipoPago: 'TODOS',
            filtroSituacion: 'TODOS',
            docenteSeleccionado: null,
            coordinacionExpandida: '',
            mensaje: { tipo: '', texto: '' }
          };
        },
        computed: {
          registrosFiltrados() {
            const texto = (this.filtroTexto || '').toLowerCase().trim();
            return (this.registros || []).filter(r => {
              const coincideTexto = !texto || [r.docente, r.coord, r.tipoPagoDesc, r.tipoPago]
                .join(' ')
                .toLowerCase()
                .includes(texto);
              const coincideCoord = this.filtroCoordinador === 'TODOS' || (r.coord || '') === this.filtroCoordinador;
              const coincideTipoPago = this.filtroTipoPago === 'TODOS' || ((r.tipoPago || '') === this.filtroTipoPago);
              const tieneExtras = (parseFloat(r.extras) || 0) > 0;
              const tieneDescuentos = (parseFloat(r.faltas) || 0) > 0 || (parseFloat(r.retardos) || 0) > 0 || (parseFloat(r.descRet) || 0) > 0;
              const coincideSituacion =
                this.filtroSituacion === 'TODOS' ? true :
                this.filtroSituacion === 'CON_EXTRAS' ? tieneExtras :
                this.filtroSituacion === 'CON_DESCUENTOS' ? tieneDescuentos :
                !tieneExtras && !tieneDescuentos;
              return coincideTexto && coincideCoord && coincideTipoPago && coincideSituacion;
            }).sort((a, b) => {
              const coordCmp = (a.coord || '').localeCompare((b.coord || ''), 'es', { sensitivity: 'base' });
              if (coordCmp !== 0) return coordCmp;
              return (a.docente || '').localeCompare((b.docente || ''), 'es', { sensitivity: 'base' });
            });
          },
          gruposCoordinacion() {
            const grupos = {};
            this.registrosFiltrados.forEach(r => {
              const coord = (r.coord || 'Sin coordinación').trim() || 'Sin coordinación';
              if (!grupos[coord]) {
                grupos[coord] = {
                  coord,
                  registros: [],
                  resumen: { docentes: 0, hBase: 0, faltas: 0, retardos: 0, descRet: 0, extras: 0, pago: 0 }
                };
              }
              grupos[coord].registros.push(r);
              grupos[coord].resumen.docentes += 1;
              grupos[coord].resumen.hBase += parseFloat(r.hBase) || 0;
              grupos[coord].resumen.faltas += parseFloat(r.faltas) || 0;
              grupos[coord].resumen.retardos += parseFloat(r.retardos) || 0;
              grupos[coord].resumen.descRet += parseFloat(r.descRet) || 0;
              grupos[coord].resumen.extras += parseFloat(r.extras) || 0;
              grupos[coord].resumen.pago += parseFloat(r.pago) || 0;
            });
            return Object.values(grupos);
          },
          resumenGeneral() {
            return this.registrosFiltrados.reduce((acc, r) => {
              acc.docentes += 1;
              acc.coordinaciones = new Set([...(acc.coordinaciones || []), (r.coord || 'Sin coordinación')]);
              acc.hBase += parseFloat(r.hBase) || 0;
              acc.faltas += parseFloat(r.faltas) || 0;
              acc.retardos += parseFloat(r.retardos) || 0;
              acc.descRet += parseFloat(r.descRet) || 0;
              acc.extras += parseFloat(r.extras) || 0;
              acc.pago += parseFloat(r.pago) || 0;
              return acc;
            }, { docentes: 0, coordinaciones: new Set(), hBase: 0, faltas: 0, retardos: 0, descRet: 0, extras: 0, pago: 0 });
          },
          totalCoordinacionesVisibles() {
            return this.gruposCoordinacion.length;
          },
          chipsActivos() {
            const chips = [];
            if ((this.filtroTexto || '').trim()) chips.push({ key: 'texto', label: 'Buscar', value: this.filtroTexto });
            if (this.filtroCoordinador !== 'TODOS') chips.push({ key: 'coordinador', label: 'Coordinación', value: this.filtroCoordinador });
            if (this.filtroTipoPago !== 'TODOS') chips.push({ key: 'tipo', label: 'Tipo pago', value: this.descripcionTipoPago(this.filtroTipoPago) });
            if (this.filtroSituacion !== 'TODOS') chips.push({ key: 'situacion', label: 'Situación', value: this.etiquetaSituacion(this.filtroSituacion) });
            return chips;
          }
        },
        mounted() {
          this.cargar();
        },
        watch: {
          gruposCoordinacion(nuevos) {
            if (!nuevos.length) {
              this.coordinacionExpandida = '';
              return;
            }
            if (!nuevos.some(g => g.coord === this.coordinacionExpandida)) {
              this.coordinacionExpandida = nuevos[0].coord;
            }
          },
          registrosFiltrados(nuevos) {
            if (!nuevos.length) {
              this.docenteSeleccionado = null;
              return;
            }
            if (!this.docenteSeleccionado || !nuevos.some(r => (r.docente === this.docenteSeleccionado.docente && r.coord === this.docenteSeleccionado.coord))) {
              this.docenteSeleccionado = nuevos[0];
            }
          }
        },
        methods: {
          abrirMenu: abrirMenuLateral,
          async cargar() {
            this.cargando = true;
            this.error = '';
            try {
              const res = await services.nomina.obtenerReportes(tokenSesionActual);
              this.cargando = false;
              if (!res.success) {
                this.error = res.error || 'No fue posible cargar el reporte.';
                return;
              }
              this.periodo = res.periodo || '';
              this.pesos = res.pesos || {};
              this.registros = res.datos || [];
              this.coordinaciones = res.coordinaciones || [];
              if (this.gruposCoordinacion.length) {
                this.coordinacionExpandida = this.gruposCoordinacion[0].coord;
              }
              if (this.registrosFiltrados.length) {
                this.docenteSeleccionado = this.registrosFiltrados[0];
              }
            } catch (err) {
              if (esErrorSesionExpirada(err)) return;
              this.cargando = false;
              this.error = obtenerMensajeError(err, 'Error de conexión al generar el reporte.');
            }
          },
          formatMoney: formatearMonedaMX,
          formatHours(v) {
            const n = parseFloat(v) || 0;
            return Number.isInteger(n) ? n.toString() : n.toFixed(1);
          },
          descripcionTipoPago: describirTipoPago,
          etiquetaSituacion(valor) {
            if (valor === 'CON_EXTRAS') return 'Con extras';
            if (valor === 'CON_DESCUENTOS') return 'Con descuentos';
            if (valor === 'SIN_MOVIMIENTO') return 'Sin novedades';
            return 'Todas';
          },
          claseFila(r) {
            const tieneExtras = (parseFloat(r.extras) || 0) > 0;
            const tieneDescuentos = (parseFloat(r.faltas) || 0) > 0 || (parseFloat(r.retardos) || 0) > 0 || (parseFloat(r.descRet) || 0) > 0;
            if (tieneExtras && tieneDescuentos) return 'bg-amber-50/50';
            if (tieneExtras) return 'bg-emerald-50/40';
            if (tieneDescuentos) return 'bg-red-50/40';
            return '';
          },
          badgeTipoPago(tipo) {
            if (tipo === 'E') return 'bg-emerald-50 text-emerald-700 border-emerald-200';
            if (tipo === '1') return 'bg-red-50 text-red-700 border-red-200';
            if (tipo === '2') return 'bg-blue-50 text-blue-700 border-blue-200';
            return 'bg-slate-50 text-slate-700 border-slate-200';
          },
          badgeSituacion(r) {
            const tieneExtras = (parseFloat(r.extras) || 0) > 0;
            const tieneDescuentos = (parseFloat(r.faltas) || 0) > 0 || (parseFloat(r.retardos) || 0) > 0 || (parseFloat(r.descRet) || 0) > 0;
            if (tieneExtras && tieneDescuentos) return { label: 'Mixto', clases: 'bg-amber-50 text-amber-800 border-amber-200' };
            if (tieneExtras) return { label: 'Con extras', clases: 'bg-emerald-50 text-emerald-700 border-emerald-200' };
            if (tieneDescuentos) return { label: 'Con descuentos', clases: 'bg-red-50 text-red-700 border-red-200' };
            return { label: 'Sin novedades', clases: 'bg-slate-50 text-slate-700 border-slate-200' };

            this.filtroTexto = '';

            this.filtroTipoPago = 'TODOS';
            this.filtroSituacion = 'TODOS';
          },
          quitarChip(key) {
            if (key === 'texto') this.filtroTexto = '';
            if (key === 'coordinador') this.filtroCoordinador = 'TODOS';
            if (key === 'tipo') this.filtroTipoPago = 'TODOS';
            if (key === 'situacion') this.filtroSituacion = 'TODOS';
          },
          toggleGrupo(coord) {
            this.coordinacionExpandida = this.coordinacionExpandida === coord ? '' : coord;
          },
          seleccionarRegistro(r) {
            this.docenteSeleccionado = r;
          },
          exportarCSV(coord = null) {
            const registros = coord
              ? this.registrosFiltrados.filter(r => (r.coord || 'Sin coordinación') === coord)
              : this.registrosFiltrados;
            if (!registros.length) {
              this.mensaje = { tipo: 'error', texto: 'No hay registros para exportar.' };
              return;
            }
            const headers = [
              'Coordinación','Docente','Tipo Pago','Descripción Tipo Pago','H. Base Qna.','Faltas (hrs)','Retardos','Desc. Ret. (hrs)','Hrs Extras','Total a Pagar'
            ];
            const rows = registros.map(r => [
              r.coord || '',
              r.docente || '',
              r.tipoPago || '',
              r.tipoPagoDesc || this.descripcionTipoPago(r.tipoPago || ''),
              this.formatHours(r.hBase),
              this.formatHours(r.faltas),
              this.formatHours(r.retardos),
              this.formatHours(r.descRet),
              this.formatHours(r.extras),
              (parseFloat(r.pago) || 0).toFixed(2)
            ]);
            const escape = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
            const csv = '﻿' + [headers.map(escape).join(','), ...rows.map(row => row.map(escape).join(','))].join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const fecha = new Date().toISOString().slice(0,10);
            const scope = coord ? coord.replace(/\s+/g, '_') : 'visible';
            a.href = url;
            a.download = `reporte_nomina_${scope}_${fecha}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

          },

            const htmlGrupos = grupos.map(grupo => {

                  <td class="right">${esc(this.formatHours(r.hBase))}</td>
                  <td class="right">${esc(this.formatHours(r.faltas))}</td>
                  <td class="right">${esc(this.formatHours(r.retardos))}</td>
                  <td class="right">${esc(this.formatHours(r.descRet))}</td>
                  <td class="right">${esc(this.formatHours(r.extras))}</td>
                  <td class="right total">${esc(this.formatMoney(r.pago))}</td>

                    </div>
                  </div>

                        <th class="right">Retardos</th>
                        <th class="right">Desc. Ret.</th>
                        <th class="right">Extras</th>
                        <th class="right">Total pago</th>
                        <th class="center">Estado</th>
                      </tr>
                    </thead>
                    <tbody>${filas}</tbody>
                    <tfoot>
                      <tr>
                        <td colspan="7" class="right footer-label">Total ${esc(grupo.coord)}</td>
                        <td class="right footer-total">${esc(this.formatMoney(grupo.resumen.pago))}</td>
                        <td></td>
                      </tr>
                    </tfoot>
                  </table>
                </section>
              `;
            }).join('');

            const contenido = `<!DOCTYPE html>
              <html lang="es">

                <style>

                  .encabezado h1 { margin: 0 0 6px; font-size: 22px; }
                  .meta { font-size: 12px; color: #475569; }

                  .card span { display: block; font-size: 11px; text-transform: uppercase; color: #64748b; font-weight: 700; margin-bottom: 4px; }

                  .grupo-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
                  .grupo-header h2 { margin: 0; font-size: 16px; }

                  .mini-resumen div { border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px; }
                  .mini-resumen span { display:block; font-size:10px; text-transform:uppercase; color:#64748b; font-weight:700; }
                  .mini-resumen strong { display:block; margin-top:3px; font-size:13px; }

                  thead th { background: #e2e8f0; text-transform: uppercase; font-size: 10px; letter-spacing: .02em; }
                  th, td { border: 1px solid #cbd5e1; padding: 7px 8px; vertical-align: top; }
                  .right { text-align: right; }
                  .center { text-align: center; }
                  .total { font-weight: 700; }

                    .grupo { break-inside: avoid; }

                </style>
              </head>
              <body>

                  <h1>Reporte detallado de nómina</h1>

                </div>

            ventana.focus();
            setTimeout(() => {
              ventana.print();
              ventana.close();

          }

    function cargarEstadisticas(contenedor) {
      montarVistaSync(contenedor, {
        shellAppKey: 'estadisticasShellVueApp',

    function montarEstadisticasVue(root) {
      const { createApp } = Vue;

      window.estadisticasVueApp = createApp({
        data() {
          return {
            cargando: true,
            error: '',
            porPeriodo: {},
            porCoordinador: {},
            notaDistribucion: '',
            graficaPeriodos: null,
            graficaCoordinadores: null
          };
        },
        computed: {
          labelsPeriodos() {
            return Object.keys(this.porPeriodo || {});
          },
          valoresPeriodos() {
            return Object.values(this.porPeriodo || {});
          },
          labelsCoords() {
            return Object.keys(this.porCoordinador || {});
          },
          valoresCoords() {
            return Object.values(this.porCoordinador || {});
          },
          tieneDatos() {
            return this.labelsPeriodos.length > 0 || this.labelsCoords.length > 0;
          },
          totalPeriodos() {
            return this.labelsPeriodos.length;
          },
          totalCoordinaciones() {
            return this.labelsCoords.length;
          },
          gastoAcumulado() {
            return (this.valoresPeriodos || []).reduce((acc, n) => acc + (parseFloat(n) || 0), 0);
          },
          promedioPeriodo() {
            return this.totalPeriodos ? this.gastoAcumulado / this.totalPeriodos : 0;
          },
          coordinacionTop() {
            if (!this.labelsCoords.length) return 'Sin datos';
            let indice = 0;
            let maximo = -Infinity;
            this.valoresCoords.forEach((valor, i) => {
              const numero = parseFloat(valor) || 0;
              if (numero > maximo) {
                maximo = numero;
                indice = i;
              }
            });
            return this.labelsCoords[indice] || 'Sin datos';
          }
        },
        mounted() {
          this.cargar();
        },
        beforeUnmount() {
          this.destruirGraficas();
        },
        methods: {
          abrirMenu: abrirMenuLateral,
          formatearMoneda: formatearMonedaMX,
          async cargar() {
            this.cargando = true;
            this.error = '';
            this.destruirGraficas();

            try {
              const res = await services.nomina.obtenerEstadisticas(tokenSesionActual);
              this.cargando = false;
              if (!res.success) {
                this.error = res.error || 'No fue posible cargar las estadísticas.';
                return;
              }

              this.porPeriodo = res.porPeriodo || {};
              this.porCoordinador = res.porCoordinador || {};
              this.notaDistribucion = res.notaDistribucion || '';

              if (this.tieneDatos) {
                this.$nextTick(() => this.renderizarGraficas());
              }
            } catch (err) {
              if (esErrorSesionExpirada(err)) return;
              this.cargando = false;
              this.error = obtenerMensajeError(err);
            }
          },
          destruirGraficas() {
            if (this.graficaPeriodos) {
              try { this.graficaPeriodos.destroy(); } catch (e) {}
              this.graficaPeriodos = null;
            }
            if (this.graficaCoordinadores) {
              try { this.graficaCoordinadores.destroy(); } catch (e) {}
              this.graficaCoordinadores = null;
            }
          },
          renderizarGraficas() {
            this.destruirGraficas();
            if (!this.tieneDatos) return;

            const canvasPeriodos = this.$refs.graficaPeriodos;
            const canvasCoordinadores = this.$refs.graficaCoordinadores;
            if (!canvasPeriodos || !canvasCoordinadores) return;

            const coloresBase = [
              '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6',
              '#14b8a6', '#f43f5e', '#22c55e', '#eab308', '#06b6d4',
              '#a855f7', '#f97316'
            ];
            const coloresDona = this.labelsCoords.map((_, i) => coloresBase[i % coloresBase.length]);

            const ctxPeriodos = canvasPeriodos.getContext('2d');
            this.graficaPeriodos = new Chart(ctxPeriodos, {
              type: 'bar',
              data: {
                labels: this.labelsPeriodos,
                datasets: [{
                  label: 'Total Pagado ($)',
                  data: this.valoresPeriodos,
                  backgroundColor: 'rgba(59, 130, 246, 0.7)',
                  borderColor: 'rgba(59, 130, 246, 1)',
                  borderWidth: 2,
                  borderRadius: 6
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                  legend: { display: false }
                },
                scales: {
                  y: { beginAtZero: true }
                }
              }
            });

            const ctxCoords = canvasCoordinadores.getContext('2d');
            this.graficaCoordinadores = new Chart(ctxCoords, {
              type: 'doughnut',
              data: {
                labels: this.labelsCoords,
                datasets: [{
                  data: this.valoresCoords,
                  backgroundColor: coloresDona,
                  hoverOffset: 6
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                  legend: {
                    position: 'bottom'
                  }
                }
              }
            });
          }
        },
        template: `
          <div>
            <div class="flex items-center mb-6">
              <button @click="abrirMenu" class="mr-4 bg-gray-200 p-2 rounded focus:outline-none hover:bg-gray-300 transition">
                <i class="fas fa-bars text-xl"></i>
              </button>
              <h2 class="text-3xl font-semibold text-gray-800">Estadísticas Financieras</h2>
            </div>

            <div v-if="cargando" class="flex flex-col items-center justify-center py-10">
              <i class="fas fa-chart-line fa-spin text-4xl text-blue-500 mb-2"></i>
              <p class="text-gray-500">Calculando estadísticas históricas...</p>
            </div>

            <div v-else-if="error" class="bg-white rounded-xl shadow p-6 border border-red-100">
              <div class="text-red-600 font-semibold">
                <i class="fas fa-exclamation-triangle mr-2"></i>{{ error }}
              </div>
            </div>

            <div v-else-if="!tieneDatos" class="bg-white rounded-xl shadow p-6 border border-yellow-100 text-yellow-800 font-semibold">
              <i class="fas fa-exclamation-triangle mr-2"></i>No hay datos suficientes para construir las gráficas.
            </div>

            <div v-else class="space-y-6">
              <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
                <div class="bg-white rounded-2xl shadow p-5 border border-slate-200">
                  <div class="text-xs uppercase font-black text-slate-500">Quincenas analizadas</div>
                  <div class="text-3xl font-black text-slate-800 mt-2">{{ totalPeriodos }}</div>
                </div>
                <div class="bg-white rounded-2xl shadow p-5 border border-slate-200">
                  <div class="text-xs uppercase font-black text-slate-500">Coordinaciones</div>
                  <div class="text-3xl font-black text-slate-800 mt-2">{{ totalCoordinaciones }}</div>
                </div>
                <div class="bg-white rounded-2xl shadow p-5 border border-blue-100">
                  <div class="text-xs uppercase font-black text-blue-500">Gasto acumulado</div>
                  <div class="text-3xl font-black text-slate-800 mt-2">{{ formatearMoneda(gastoAcumulado) }}</div>
                </div>
                <div class="bg-white rounded-2xl shadow p-5 border border-emerald-100">
                  <div class="text-xs uppercase font-black text-emerald-500">Coordinación con mayor distribución</div>
                  <div class="text-lg font-black text-slate-800 mt-2 leading-tight">{{ coordinacionTop }}</div>
                  <div class="text-xs text-slate-500 mt-2">Promedio por quincena: {{ formatearMoneda(promedioPeriodo) }}</div>
                </div>
              </div>

              <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
                  <h3 class="text-lg font-bold text-gray-700 mb-4 text-center">Gasto Total por Quincena</h3>
                  <div class="relative h-80 w-full">
                    <canvas ref="graficaPeriodos"></canvas>
                  </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
                  <h3 class="text-lg font-bold text-gray-700 mb-4 text-center">Distribución por Coordinación</h3>
                  <div class="relative h-80 w-full flex justify-center">
                    <canvas ref="graficaCoordinadores"></canvas>
                  </div>
                  <p class="text-xs text-gray-500 mt-4 text-center">{{ notaDistribucion }}</p>
                </div>
              </div>
            </div>
          </div>
        `
      }).mount(root);
    }


    // --- FUNCIONES PARA FASE 3: CAPTURAR DOCENTE (VUE PILOTO) ---
    function limpiarTextoDocente(valor) {
      return (valor || '')
        .toString()
        .replace(/\s+/g, ' ')
        .trim()
        .toUpperCase();
    }

    function normalizarNombreComparableCliente(valor) {
      return (valor || '')
        .toString()
        .trim()
        .toUpperCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^A-Z0-9\s]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function calcularSimilitudNombreCliente(a, b) {
      const tokensA = Array.from(new Set((a || '').split(' ').filter(Boolean)));
      const tokensB = Array.from(new Set((b || '').split(' ').filter(Boolean)));

      if (!tokensA.length || !tokensB.length) return 0;

      const setB = new Set(tokensB);
      let comunes = 0;
      tokensA.forEach(token => {
        if (setB.has(token)) comunes++;
      });

      const union = new Set(tokensA.concat(tokensB)).size;
      return union ? (comunes / union) : 0;
    }

    function obtenerFormularioDocenteVacio() {
      return {
        filaHoja: null,
        idDocente: '',
        nombres: '',
        apellidoPaterno: '',
        apellidoMaterno: '',
        grado: 'Licenciatura',
        tipoPago1: '',
        categoria: '',
        ubicacion: 'Local',
        comentario: 'Docente activo',
        observacion: '',
        telefono: '',
        correo: '',
        rfc: '',
        identificador: '',
        bancoDetalle: '',
        estatus: 'ACTIVO'
      };
    }


    function evaluarCompletitudDocenteCliente(docente, coordinadorFallback = '') {
      const nombreCompleto = ((docente && docente.docente) || [docente?.nombres, docente?.apellidoPaterno, docente?.apellidoMaterno]
        .map(v => limpiarTextoDocente(v))
        .filter(Boolean)
        .join(' ')).trim();

      const checklist = [
        { label: 'Nombre completo', ok: !!nombreCompleto },
        { label: 'Grado académico', ok: !!((docente && docente.grado) || '').toString().trim() },
        { label: 'Tipo de pago', ok: !!((docente && docente.tipoPago1) || '').toString().trim() },
        { label: 'Categoría', ok: !!((docente && docente.categoria) || '').toString().trim() },
        { label: 'Ubicación', ok: !!((docente && docente.ubicacion) || '').toString().trim() },
        { label: 'Estatus', ok: !!((docente && docente.estatus) || '').toString().trim() },
        { label: 'Coordinador', ok: !!(((docente && docente.coordinador) || coordinadorFallback || '').toString().trim()) },
        { label: 'Teléfono', ok: !!((docente && docente.telefono) || '').toString().trim() },
        { label: 'Correo', ok: !!((docente && docente.correo) || '').toString().trim() },
        { label: 'RFC', ok: !!((docente && docente.rfc) || '').toString().trim() },
        { label: 'Identificador', ok: !!((docente && docente.identificador) || '').toString().trim() },
        { label: 'Detalle bancario', ok: !!((docente && docente.bancoDetalle) || '').toString().trim() }
      ];

      const total = checklist.length;
      const completos = checklist.filter(item => item.ok).length;
      const porcentaje = total ? Math.round((completos / total) * 100) : 0;
      const faltantes = checklist.filter(item => !item.ok).map(item => item.label);

      let clave = 'BASICO';
      let etiqueta = 'Básico';
      let clases = 'border-red-200 bg-red-50 text-red-800';
      let barra = 'bg-red-500';

      if (porcentaje >= 80) {
        clave = 'COMPLETO';
        etiqueta = 'Completo';
        clases = 'border-green-200 bg-green-50 text-green-800';
        barra = 'bg-green-500';
      } else if (porcentaje >= 50) {
        clave = 'INTERMEDIO';
        etiqueta = 'Intermedio';
        clases = 'border-yellow-200 bg-yellow-50 text-yellow-800';
        barra = 'bg-yellow-500';
      }

      return {
        porcentaje,
        completos,
        total,
        faltantes,
        clave,
        etiqueta,
        clases,
        barra
      };
    }


    function evaluarExpedienteFinanzasCliente(docente) {
      const faltantes = [];
      const tieneRFC = !!(docente.rfc || '').toString().trim();
      const tieneConstancia = !!(docente.constanciaFileId || docente.constanciaUrl || '').toString().trim();
      const tieneBanco = !!(docente.bancoDetalle || '').toString().trim();
      const tieneCorreo = !!(docente.correo || '').toString().trim();
      const tieneTelefono = !!(docente.telefono || '').toString().trim();
      const tieneIdentificador = !!(docente.identificador || '').toString().trim();
      const estatusActivo = ((docente.estatus || 'ACTIVO').toString().trim().toUpperCase() === 'ACTIVO');

      if (!tieneRFC) faltantes.push('RFC');
      if (!tieneConstancia) faltantes.push('Constancia fiscal');
      if (!tieneBanco) faltantes.push('Banco / cuenta');
      if (!tieneCorreo) faltantes.push('Correo');
      if (!tieneTelefono) faltantes.push('Teléfono');
      if (!tieneIdentificador) faltantes.push('Identificador');

      let completos = [tieneRFC, tieneConstancia, tieneBanco, tieneCorreo, tieneTelefono, tieneIdentificador].filter(Boolean).length;
      let porcentaje = Math.round((completos / 6) * 100);

      if (!estatusActivo) {
        return {
          clave: 'INACTIVO',
          etiqueta: 'Inactivo',
          porcentaje: porcentaje,
          faltantes: faltantes,
          clases: 'bg-slate-100 text-slate-700 border-slate-200',
          punto: 'bg-slate-400'
        };
      }

      if (porcentaje >= 100) {
        return {
          clave: 'COMPLETO',
          etiqueta: 'Expediente completo',
          porcentaje: porcentaje,
          faltantes: faltantes,
          clases: 'bg-emerald-50 text-emerald-700 border-emerald-200',
          punto: 'bg-emerald-500'
        };
      }

      if (porcentaje >= 67) {
        return {
          clave: 'EN_REVISION',
          etiqueta: 'En revisión',
          porcentaje: porcentaje,
          faltantes: faltantes,
          clases: 'bg-amber-50 text-amber-800 border-amber-200',
          punto: 'bg-amber-500'
        };
      }

      return {
        clave: 'INCOMPLETO',
        etiqueta: 'Incompleto',
        porcentaje: porcentaje,
        faltantes: faltantes,
        clases: 'bg-red-50 text-red-700 border-red-200',
        punto: 'bg-red-500'
      };
    }

        shellAppKey: 'finanzasContadorShellVueApp',
        childAppKey: 'finanzasContadorVueApp',

    function montarFinanzasContadorVue(root, payload) {
      const { createApp } = Vue;

      window.finanzasContadorVueApp = createApp({
        data() {
          return {
            usuarioSesion: nombreCoordinadorActual,
            rolSesion: rolUsuarioActual,
            docentes: payload.docentes || [],
            historialReciente: payload.historialReciente || [],
            resumenBackend: payload.resumen || {},
            coordinadoresDisponibles: payload.coordinadores || [],
            filtroTexto: '',
            filtroEstatus: 'TODOS',
            filtroTipoPago: 'TODOS',
            filtroConstancia: 'TODOS',
            filtroRFC: 'TODOS',
            filtroBanco: 'TODOS',
            filtroExpediente: 'TODOS',
            filtroCoordinador: 'TODOS',
            ordenCampo: 'docente',
            ordenDireccion: 'asc',
            docenteSeleccionado: null,
            accionesCorreoAbiertas: false,
            docenteCorreoAccion: null,
            mensaje: { tipo: '', texto: '' }
          };
        },
        computed: {
          docentesFiltrados() {
            const texto = (this.filtroTexto || '').toLowerCase().trim();
            const direccion = this.ordenDireccion === 'desc' ? -1 : 1;

            const filtrados = this.docentes.filter(doc => {
              const expediente = this.obtenerExpediente(doc);
              const coincideTexto = !texto || [
                doc.docente, doc.rfc, doc.correo, doc.telefono, doc.identificador,
                doc.bancoDetalle, doc.coordinador, doc.constanciaNombre
              ].join(' ').toLowerCase().includes(texto);

              const coincideEstatus = this.filtroEstatus === 'TODOS' || ((doc.estatus || 'ACTIVO').toUpperCase() === this.filtroEstatus);
              const coincideTipoPago = this.filtroTipoPago === 'TODOS' || ((doc.tipoPago1 || '') === this.filtroTipoPago);
              const coincideConstancia = this.filtroConstancia === 'TODOS' ||
                (this.filtroConstancia === 'CON' ? !!(doc.constanciaFileId || doc.constanciaUrl) : !(doc.constanciaFileId || doc.constanciaUrl));
              const coincideRFC = this.filtroRFC === 'TODOS' ||
                (this.filtroRFC === 'CON' ? !!(doc.rfc || '').trim() : !(doc.rfc || '').trim());
              const coincideBanco = this.filtroBanco === 'TODOS' ||
                (this.filtroBanco === 'CON' ? !!(doc.bancoDetalle || '').trim() : !(doc.bancoDetalle || '').trim());
              const coincideExpediente = this.filtroExpediente === 'TODOS' || expediente.clave === this.filtroExpediente;
              const coincideCoordinador = this.filtroCoordinador === 'TODOS' || (doc.coordinador || '') === this.filtroCoordinador;

              return coincideTexto && coincideEstatus && coincideTipoPago && coincideConstancia && coincideRFC && coincideBanco && coincideExpediente && coincideCoordinador;
            });

            const valorOrden = (doc) => {
              if (this.ordenCampo === 'docente') return (doc.docente || '').toLowerCase();
              if (this.ordenCampo === 'rfc') return (doc.rfc || '').toLowerCase();
              if (this.ordenCampo === 'tipoPago1') return (this.descripcionTipoPago(doc.tipoPago1) || '').toLowerCase();
              if (this.ordenCampo === 'coordinador') return (doc.coordinador || '').toLowerCase();
              if (this.ordenCampo === 'constancia') return !!(doc.constanciaFileId || doc.constanciaUrl) ? 1 : 0;
              if (this.ordenCampo === 'expediente') return this.obtenerExpediente(doc).porcentaje || 0;
              if (this.ordenCampo === 'fechaActualizacion') return (doc.fechaActualizacion || doc.constanciaFecha || doc.fechaCreacion || '').toLowerCase();
              return ((doc[this.ordenCampo] || '') + '').toLowerCase();
            };

            return [...filtrados].sort((a, b) => {
              const aVal = valorOrden(a);
              const bVal = valorOrden(b);

              if (typeof aVal === 'number' && typeof bVal === 'number') {
                return (aVal - bVal) * direccion;
              }

              return aVal.localeCompare(bVal, 'es', { sensitivity: 'base', numeric: true }) * direccion;
            });
          },
          resumenFiltrado() {
            const base = this.docentesFiltrados;
            return {
              visibles: base.length,
              conConstancia: base.filter(d => !!(d.constanciaFileId || d.constanciaUrl)).length,
              sinConstancia: base.filter(d => !(d.constanciaFileId || d.constanciaUrl)).length,
              conRFC: base.filter(d => !!(d.rfc || '').trim()).length,
              sinRFC: base.filter(d => !(d.rfc || '').trim()).length,
              conBanco: base.filter(d => !!(d.bancoDetalle || '').trim()).length,
              sinBanco: base.filter(d => !(d.bancoDetalle || '').trim()).length,
              completos: base.filter(d => this.obtenerExpediente(d).clave === 'COMPLETO').length,
              revision: base.filter(d => this.obtenerExpediente(d).clave === 'EN_REVISION').length,
              incompletos: base.filter(d => this.obtenerExpediente(d).clave === 'INCOMPLETO').length
            };
          },
          pendientesCriticos() {
            return this.docentes
              .map(doc => ({ ...doc, expediente: this.obtenerExpediente(doc) }))
              .filter(doc => doc.expediente.clave !== 'COMPLETO' && ((doc.estatus || 'ACTIVO').toUpperCase() === 'ACTIVO'))
              .sort((a, b) => a.expediente.porcentaje - b.expediente.porcentaje)
              .slice(0, 8);
          },
          documentosRecientes() {
            return [...this.docentes]
              .filter(doc => !!(doc.constanciaFileId || doc.constanciaUrl))
              .sort((a, b) => this.valorFechaOrden(b.constanciaFecha || b.fechaActualizacion) - this.valorFechaOrden(a.constanciaFecha || a.fechaActualizacion))
              .slice(0, 10);
          }
        },
        mounted() {
          if (!this.docenteSeleccionado && this.docentesFiltrados.length) {
            this.docenteSeleccionado = this.docentesFiltrados[0];
          }
        },
        watch: {
          docentesFiltrados(nuevos) {
            if (!nuevos.length) {
              this.docenteSeleccionado = null;
              return;
            }
            if (!this.docenteSeleccionado || !nuevos.some(d => d.filaHoja === this.docenteSeleccionado.filaHoja)) {
              this.docenteSeleccionado = nuevos[0];
            }
          }
        },
        methods: {
          setMensaje(tipo, texto) {
            asignarMensajeTemporal(this, tipo, texto, 3200);
          },
          limpiarFiltros() {
            this.filtroTexto = '';
            this.filtroEstatus = 'TODOS';
            this.filtroTipoPago = 'TODOS';

            this.filtroRFC = 'TODOS';
            this.filtroBanco = 'TODOS';

          },
          descripcionTipoPago: describirTipoPago,

            return evaluarExpedienteFinanzasCliente(doc || {});

          seleccionarDocente(doc) {
            this.docenteSeleccionado = doc;
          },
          valorFechaOrden(texto) {
            const valor = (texto || '').toString().trim();
            if (!valor) return 0;
            const partes = valor.split(' ');
            const fecha = partes[0] || '';
            const hora = partes[1] || '00:00:00';
            const [d, m, y] = fecha.split('/');
            if (!d || !m || !y) return 0;
            return new Date(`${y}-${m}-${d}T${hora}`).getTime() || 0;
          },
          formatearFecha(texto) {
            return texto || '—';
          },
          claseTipoPago(tipo) {
            if (tipo === 'E') return 'bg-emerald-50 text-emerald-700 border-emerald-200';
            if (tipo === '1') return 'bg-red-50 text-red-700 border-red-200';
            if (tipo === '2') return 'bg-blue-50 text-blue-700 border-blue-200';
            return 'bg-slate-50 text-slate-700 border-slate-200';
          },
          claseConstancia(doc) {
            return (doc.constanciaFileId || doc.constanciaUrl) ? 'bg-indigo-50 text-indigo-700 border-indigo-200' : 'bg-slate-50 text-slate-600 border-slate-200';
          },
          toggleOrden(campo) {
            if (this.ordenCampo === campo) {
              this.ordenDireccion = this.ordenDireccion === 'asc' ? 'desc' : 'asc';
            } else {
              this.ordenCampo = campo;
              this.ordenDireccion = campo === 'expediente' ? 'desc' : 'asc';
            }
          },
          abrirConstancia(doc) {
            const url = doc && doc.constanciaUrl;
            if (!abrirUrlNuevaPestana(url)) {
              this.setMensaje('error', 'Este docente aún no tiene constancia cargada.');
            }
          },
          abrirAccionesCorreo(doc) {
            const correo = ((doc && doc.correo) || '').trim();
            if (!correo) {
              this.setMensaje('error', 'Este docente no tiene correo registrado.');
              return;
            }
            this.docenteCorreoAccion = doc;
            this.accionesCorreoAbiertas = true;
          },
          cerrarAccionesCorreo() {
            this.accionesCorreoAbiertas = false;
            this.docenteCorreoAccion = null;
          },
          copiarCorreo(doc = null) {
            const docente = doc || this.docenteCorreoAccion || {};
            const correo = (docente.correo || '').trim();
            if (!correo) {
              this.setMensaje('error', 'Este docente no tiene correo registrado.');
              return;
            }
            navigator.clipboard.writeText(correo).then(() => {
              this.setMensaje('ok', `Correo copiado: ${correo}`);
              this.cerrarAccionesCorreo();
            }).catch(() => {
              this.setMensaje('error', 'No fue posible copiar el correo.');
            });
          },
          redactarCorreo(doc = null) {
            const docente = doc || this.docenteCorreoAccion || {};
            const correo = (docente.correo || '').trim();
            if (!correo) {
              this.setMensaje('error', 'Este docente no tiene correo registrado.');
              return;
            }
            const nombre = (docente.docente || 'docente').trim();
            const asunto = encodeURIComponent('Seguimiento de expediente docente');
            const cuerpo = encodeURIComponent(`Hola ${nombre},\n\nTe compartimos seguimiento de tu expediente docente.\n\nSaludos.`);
            window.location.href = `mailto:${correo}?subject=${asunto}&body=${cuerpo}`;
            this.setMensaje('ok', 'Se abrió el cliente de correo.');
            this.cerrarAccionesCorreo();
          },
          exportarCSV(scope = 'filtrados') {
            const registros = scope === 'todos' ? this.docentes : this.docentesFiltrados;
            if (!registros.length) {
              this.setMensaje('error', 'No hay registros para exportar.');
              return;
            }

            const encabezados = [
              'Docente','RFC','Tipo de pago','Descripcion tipo pago','Banco detalle','Correo','Telefono','Identificador',
              'Estatus','Categoria','Ubicacion','Coordinador','Constancia nombre','Constancia fecha','Constancia URL',
              'Expediente','Expediente %','Faltantes','Comentario','Observacion','Fecha actualizacion','Actualizado por'
            ];
            const escapar = (valor) => '"' + ((valor ?? '').toString().replace(/"/g, '""')) + '"';

            const filas = registros.map(doc => {
              const expediente = this.obtenerExpediente(doc);
              return [
                doc.docente || '',
                doc.rfc || '',
                doc.tipoPago1 || '',
                this.descripcionTipoPago(doc.tipoPago1),
                doc.bancoDetalle || '',
                doc.correo || '',
                doc.telefono || '',
                doc.identificador || '',
                doc.estatus || '',
                doc.categoria || '',
                doc.ubicacion || '',
                doc.coordinador || '',
                doc.constanciaNombre || '',
                doc.constanciaFecha || '',
                doc.constanciaUrl || '',
                expediente.etiqueta,
                expediente.porcentaje + '%',
                expediente.faltantes.join(' | '),
                doc.comentario || '',
                doc.observacion || '',
                doc.fechaActualizacion || doc.fechaCreacion || '',
                doc.actualizadoPor || ''
              ].map(escapar).join(',');
            });

            const csv = '\ufeff' + [encabezados.map(escapar).join(','), ...filas].join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const fecha = new Date().toISOString().slice(0, 10);
            a.href = url;
            a.download = `panel_finanzas_docentes_${scope}_${fecha}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            this.setMensaje('ok', `Se exportaron ${registros.length} registro${registros.length === 1 ? '' : 's'}.`);
          }
        },
