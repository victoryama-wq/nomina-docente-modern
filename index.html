    function cargarPendientesFiscales(contenedor) {
      montarVistaAsync(contenedor, {
        shellAppKey: 'pendientesFiscalesShellVueApp',
        childAppKey: 'pendientesFiscalesVueApp',
        rootId: 'pendientes-fiscales-shell-root',
        title: 'Pendientes Fiscales',
        loaderText: 'Organizando expedientes pendientes para revisión financiera...',
        loaderIconClass: 'fa-file-circle-exclamation text-amber-500',
        fetcher: () => services.finanzas.obtenerPendientesFiscales(obtenerTokenSesionActual()),
        mounter: montarPendientesFiscalesVue
      });
    }

    function montarPendientesFiscalesVue(root, payload) {
      const { createApp } = Vue;

      window.pendientesFiscalesVueApp = createApp({
        data() {
          return {
            usuarioSesion: nombreCoordinadorActual,
            rolSesion: rolUsuarioActual,
            docentes: payload.docentes || [],
            coordinadoresDisponibles: payload.coordinadores || [],
            resumenBackend: payload.resumen || {},
            texto: '',
            filtroCoordinador: 'TODOS',
            filtroTipoPago: 'TODOS',
            filtroPrioridad: 'TODOS',
            filtroFaltante: 'TODOS',
            vistaRapida: 'TODOS',
            docenteSeleccionado: null,
            accionesCorreoAbiertas: false,
            docenteCorreoAccion: null,
            mensaje: { tipo: '', texto: '' }
          };
        },
        computed: {
          docentesFiltrados() {
            const texto = (this.texto || '').toLowerCase().trim();

            const lista = this.docentes.filter(doc => {
              const expediente = this.obtenerExpediente(doc);
              const prioridad = this.obtenerPrioridad(doc);
              const coincideTexto = !texto || [
                doc.docente, doc.rfc, doc.correo, doc.telefono, doc.identificador,
                doc.bancoDetalle, doc.coordinador, (expediente.faltantes || []).join(' ')
              ].join(' ').toLowerCase().includes(texto);

              const coincideCoordinador = this.filtroCoordinador === 'TODOS' || (doc.coordinador || '') === this.filtroCoordinador;
              const coincideTipoPago = this.filtroTipoPago === 'TODOS' || (doc.tipoPago1 || '') === this.filtroTipoPago;
              const coincidePrioridad = this.filtroPrioridad === 'TODOS' || prioridad.clave === this.filtroPrioridad;
              const coincideFaltante = this.filtroFaltante === 'TODOS' || (expediente.faltantes || []).includes(this.filtroFaltante);

              const coincideVistaRapida =
                this.vistaRapida === 'TODOS' ? true :
                this.vistaRapida === 'SIN_CONSTANCIA' ? !(doc.constanciaFileId || doc.constanciaUrl) :
                this.vistaRapida === 'SIN_RFC' ? !(doc.rfc || '').trim() :
                this.vistaRapida === 'SIN_BANCO' ? !(doc.bancoDetalle || '').trim() :
                this.vistaRapida === 'SIN_CONTACTO' ? (!(doc.correo || '').trim() || !(doc.telefono || '').trim()) :
                this.vistaRapida === 'CRITICOS' ? prioridad.clave === 'CRITICA' :
                this.vistaRapida === 'REVISION' ? expediente.clave === 'EN_REVISION' :
                expediente.clave === 'INCOMPLETO';

              return coincideTexto && coincideCoordinador && coincideTipoPago && coincidePrioridad && coincideFaltante && coincideVistaRapida;
            });

            return [...lista].sort((a, b) => {
              const aPrio = this.obtenerPrioridad(a).valor;
              const bPrio = this.obtenerPrioridad(b).valor;
              if (bPrio !== aPrio) return bPrio - aPrio;

              const aPct = this.obtenerExpediente(a).porcentaje || 0;
              const bPct = this.obtenerExpediente(b).porcentaje || 0;
              if (aPct !== bPct) return aPct - bPct;

              return (a.docente || '').localeCompare((b.docente || ''), 'es', { sensitivity: 'base' });
            });
          },
          resumenFiltrado() {
            const base = this.docentesFiltrados;
            return {
              visibles: base.length,
              criticos: base.filter(doc => this.obtenerPrioridad(doc).clave === 'CRITICA').length,
              altos: base.filter(doc => this.obtenerPrioridad(doc).clave === 'ALTA').length,
              medios: base.filter(doc => this.obtenerPrioridad(doc).clave === 'MEDIA').length,
              sinConstancia: base.filter(doc => !(doc.constanciaFileId || doc.constanciaUrl)).length,
              sinRFC: base.filter(doc => !(doc.rfc || '').trim()).length,
              sinBanco: base.filter(doc => !(doc.bancoDetalle || '').trim()).length,
              revision: base.filter(doc => this.obtenerExpediente(doc).clave === 'EN_REVISION').length
            };
          },
          faltantesDisponibles() {
            const mapa = {};
            this.docentes.forEach(doc => {
              this.obtenerExpediente(doc).faltantes.forEach(f => mapa[f] = true);
            });
            return Object.keys(mapa).sort();
          },
          docentesCriticos() {
            return this.docentesFiltrados.slice(0, 6);
          }
        },
        mounted() {
          if (this.docentesFiltrados.length) {
            this.docenteSeleccionado = this.docentesFiltrados[0];
          }
        },
        watch: {
          docentesFiltrados(nuevos) {
            if (!nuevos.length) {
              this.docenteSeleccionado = null;
              return;
            }
            if (!this.docenteSeleccionado || !nuevos.some(d => d.filaHoja === this.docenteSeleccionado.filaHoja)) {
              this.docenteSeleccionado = nuevos[0];
            }
          }
        },
        methods: {
          setMensaje(tipo, texto) {
            asignarMensajeTemporal(this, tipo, texto, 3000);
          },
          obtenerExpediente(doc) {
            return evaluarExpedienteFinanzasCliente(doc || {});
          },
          obtenerPrioridad(doc) {
            const exp = this.obtenerExpediente(doc);
            let valor = 0;
            if (!(doc.constanciaFileId || doc.constanciaUrl)) valor += 35;
            if (!(doc.rfc || '').trim()) valor += 30;
            if (!(doc.bancoDetalle || '').trim()) valor += 20;
            if (!(doc.correo || '').trim()) valor += 10;
            if (!(doc.telefono || '').trim()) valor += 10;
            if (!(doc.identificador || '').trim()) valor += 5;
            if (exp.clave === 'INCOMPLETO') valor += 15;
            if (exp.clave === 'EN_REVISION') valor += 5;

            if (valor >= 70) {
              return { clave: 'CRITICA', etiqueta: 'Crítica', valor, clases: 'bg-red-100 text-red-700 border-red-200', punto: 'bg-red-500' };
            }
            if (valor >= 45) {
              return { clave: 'ALTA', etiqueta: 'Alta', valor, clases: 'bg-orange-100 text-orange-700 border-orange-200', punto: 'bg-orange-500' };
            }
            return { clave: 'MEDIA', etiqueta: 'Media', valor, clases: 'bg-amber-100 text-amber-700 border-amber-200', punto: 'bg-amber-500' };
          },
          descripcionTipoPago: describirTipoPago,
          limpiarFiltros() {
            this.texto = '';
            this.filtroCoordinador = 'TODOS';
            this.filtroTipoPago = 'TODOS';
            this.filtroPrioridad = 'TODOS';
            this.filtroFaltante = 'TODOS';
            this.vistaRapida = 'TODOS';
          },
          aplicarVistaRapida(clave) {
            this.vistaRapida = clave;
          },
          seleccionarDocente(doc) {
            this.docenteSeleccionado = doc;
          },
          irAEditarDocente(doc) {
            if (!doc) {
              this.setMensaje('error', 'No se encontró el docente a editar.');
              return;
            }

            docentePendienteEdicion = {
              filaHoja: doc.filaHoja || null,
              idDocente: doc.idDocente || '',
              docente: doc.docente || ''
            };

            cambiarVista('capturar-docente');
          },
          abrirConstancia(doc) {
            const url = doc && (doc.constanciaUrl || '').trim();

            }

          abrirAccionesCorreo(doc) {
            const correo = ((doc && doc.correo) || '').trim();
            if (!correo) {
              this.setMensaje('error', 'No hay correo registrado para este docente.');
              return;
            }
            this.docenteCorreoAccion = doc;
            this.accionesCorreoAbiertas = true;
          },
          cerrarAccionesCorreo() {
            this.accionesCorreoAbiertas = false;
            this.docenteCorreoAccion = null;
          },
          copiarCorreo(doc = null) {
            const docente = doc || this.docenteCorreoAccion || {};
            const correo = (docente.correo || '').trim();
            if (!correo) {
              this.setMensaje('error', 'No hay correo registrado para este docente.');
              return;
            }
            navigator.clipboard.writeText(correo).then(() => {
              this.setMensaje('ok', 'Correo copiado.');
              this.cerrarAccionesCorreo();
            }).catch(() => {
              this.setMensaje('error', 'No se pudo copiar el correo.');
            });
          },
          redactarCorreo(doc = null) {
            const docente = doc || this.docenteCorreoAccion || {};
            const correo = (docente.correo || '').trim();
            if (!correo) {
              this.setMensaje('error', 'No hay correo registrado para este docente.');
              return;
            }
            const nombre = (docente.docente || 'docente').trim();
            const asunto = encodeURIComponent('Seguimiento de expediente docente');
            const cuerpo = encodeURIComponent(`Hola ${nombre},\n\nTe compartimos seguimiento de tu expediente docente.\n\nSaludos.`);
            window.location.href = `mailto:${correo}?subject=${asunto}&body=${cuerpo}`;
            this.setMensaje('ok', 'Se abrió el cliente de correo.');
            this.cerrarAccionesCorreo();
          },
          copiarDato(texto, etiqueta) {
            if (!(texto || '').trim()) {
              this.setMensaje('error', `No hay ${etiqueta.toLowerCase()} para copiar.`);
              return;
            }
            navigator.clipboard.writeText(texto).then(() => {
              this.setMensaje('ok', `${etiqueta} copiado.`);
            }).catch(() => {
              this.setMensaje('error', `No se pudo copiar ${etiqueta.toLowerCase()}.`);
            });
          },
          descargarCSV() {
            const filas = this.docentesFiltrados.map(doc => {
              const exp = this.obtenerExpediente(doc);
              const prio = this.obtenerPrioridad(doc);
              return {
                Docente: doc.docente || '',
                Coordinador: doc.coordinador || '',
                'Tipo de Pago': this.descripcionTipoPago(doc.tipoPago1),

                'Banco / Cuenta': doc.bancoDetalle || '',
                'Constancia': doc.constanciaNombre || '',
                'Tiene constancia': (doc.constanciaFileId || doc.constanciaUrl) ? 'Sí' : 'No',

                Estatus: doc.estatus || '',
                'Última actualización': doc.fechaActualizacion || doc.constanciaFecha || doc.fechaCreacion || ''
              };
            });

            if (!filas.length) {
              this.setMensaje('error', 'No hay pendientes visibles para exportar.');
              return;
            }

            const encabezados = Object.keys(filas[0]);
            const csv = [encabezados.join(',')]
              .concat(filas.map(fila => encabezados.map(k => `"${String(fila[k] ?? '').replace(/"/g, '""')}"`).join(',')))
              .join('\n');

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'pendientes_fiscales.csv';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
            this.setMensaje('ok', 'Se exportó el CSV de pendientes fiscales.');
          }

    function cargarCapturarDocente(contenedor) {
      montarVistaAsync(contenedor, {
        shellAppKey: 'capturarDocenteShellVueApp',
        childAppKey: 'capturarDocenteVueApp',
        rootId: 'capturar-docente-shell-root',
        title: 'Capturar Docente',
        loaderText: 'Cargando directorio y preparando módulo...',
        loaderIconClass: 'fa-sync text-blue-500',
        fetcher: () => services.docentes.obtenerCatalogo(obtenerTokenSesionActual()),
        mounter: montarCapturarDocenteVue
      });
    }

    function montarCapturarDocenteVue(root, payload) {
      const { createApp } = Vue;

      window.capturarDocenteVueApp = createApp({
        data() {
          return {
            coordinadorSesion: nombreCoordinadorActual,
            guardando: false,
            recargando: false,
            modo: 'crear',
            filtroTexto: '',
            filtroEstatus: 'TODOS',
            filtroCategoria: 'TODOS',
            filtroTipoPago: 'TODOS',
            filtroSemaforo: 'TODOS',
            ordenCampo: 'docente',
            ordenDireccion: 'asc',
            docentes: payload.docentes || [],
            historialReciente: payload.historialReciente || [],
            mensaje: { tipo: '', texto: '' },
            subiendoConstancia: false,
            archivoConstanciaBase64: '',
            archivoConstanciaNombre: '',
            archivoConstanciaMime: '',
            form: obtenerFormularioDocenteVacio()
          };
        },
        computed: {
          nombreCompletoPreview() {
            return [this.form.nombres, this.form.apellidoPaterno, this.form.apellidoMaterno]
              .map(v => limpiarTextoDocente(v))
              .filter(Boolean)
              .join(' ');
          },
          claveNombreActual() {
            return normalizarNombreComparableCliente(this.nombreCompletoPreview);
          },
          coincidenciaExacta() {
            if (!this.claveNombreActual) return null;

            return this.docentes.find(doc => {
              if (this.form.filaHoja && doc.filaHoja === this.form.filaHoja) return false;
              return normalizarNombreComparableCliente(doc.docente) === this.claveNombreActual;
            }) || null;
          },
          coincidenciasSimilares() {
            if (!this.claveNombreActual) return [];

            return this.docentes
              .filter(doc => !this.form.filaHoja || doc.filaHoja !== this.form.filaHoja)
              .map(doc => {
                const similitud = calcularSimilitudNombreCliente(this.claveNombreActual, normalizarNombreComparableCliente(doc.docente));
                return { ...doc, similitud };
              })
              .filter(doc => doc.similitud >= 0.6 || (this.claveNombreActual && normalizarNombreComparableCliente(doc.docente).includes(this.claveNombreActual)))
              .sort((a, b) => b.similitud - a.similitud)
              .slice(0, 5);
          },
          docenteEditando() {
            if (!this.form.filaHoja) return null;
            return this.docentes.find(doc => doc.filaHoja === this.form.filaHoja) || null;
          },
          cambioNombrePendiente() {
            if (this.modo !== 'editar' || !this.docenteEditando || !this.claveNombreActual) return false;
            return normalizarNombreComparableCliente(this.docenteEditando.docente) !== this.claveNombreActual;
          },
          formularioValido() {
            return !!(limpiarTextoDocente(this.form.nombres) && limpiarTextoDocente(this.form.apellidoPaterno) && this.form.tipoPago1 && this.form.categoria && this.nombreCompletoPreview);
          },
          puedeGuardar() {
            if (this.guardando) return false;
            if (!this.formularioValido) return false;
            if (this.coincidenciaExacta) return false;
            return true;
          },
          docentesFiltrados() {
            const texto = (this.filtroTexto || '').toLowerCase().trim();
            const filtrados = this.docentes.filter(doc => {
              const sem = this.obtenerSemaforoDocente(doc);
              const coincideTexto = !texto || [doc.docente, doc.correo, doc.telefono, doc.rfc, doc.identificador, doc.coordinador, doc.comentario, doc.observacion]
                .join(' ')
                .toLowerCase()
                .includes(texto);

              const coincideEstatus = this.filtroEstatus === 'TODOS' || (doc.estatus || 'ACTIVO') === this.filtroEstatus;
              const coincideCategoria = this.filtroCategoria === 'TODOS' || (doc.categoria || '') === this.filtroCategoria;
              const coincideTipoPago = this.filtroTipoPago === 'TODOS' || (doc.tipoPago1 || '') === this.filtroTipoPago;
              const coincideSemaforo = this.filtroSemaforo === 'TODOS' || sem.clave === this.filtroSemaforo;

              return coincideTexto && coincideEstatus && coincideCategoria && coincideTipoPago && coincideSemaforo;
            });

            const campo = this.ordenCampo;
            const direccion = this.ordenDireccion === 'desc' ? -1 : 1;

            const obtenerValorOrden = (doc) => {
              if (campo === 'docente') return (doc.docente || '').toString().toLowerCase();
              if (campo === 'correo') return (doc.correo || '').toString().toLowerCase();
              if (campo === 'tipoPago1') return (this.descripcionTipoPago(doc.tipoPago1) || '').toString().toLowerCase();
              if (campo === 'categoria') return (doc.categoria || '').toString().toLowerCase();
              if (campo === 'estatus') return (doc.estatus || 'ACTIVO').toString().toLowerCase();
              if (campo === 'semaforo') return this.obtenerSemaforoDocente(doc).porcentaje || 0;
              if (campo === 'coordinador') return (doc.coordinador || '').toString().toLowerCase();
              if (campo === 'fechaActualizacion') return (doc.fechaActualizacion || doc.fechaCreacion || '').toString().toLowerCase();
              return (doc[campo] || '').toString().toLowerCase();
            };

            return [...filtrados].sort((a, b) => {
              const valorA = obtenerValorOrden(a);
              const valorB = obtenerValorOrden(b);

              if (typeof valorA === 'number' && typeof valorB === 'number') {
                return (valorA - valorB) * direccion;
              }

              return valorA.localeCompare(valorB, 'es', { sensitivity: 'base', numeric: true }) * direccion;
            });
          },
          resumenFiltrado() {
            return {
              visibles: this.docentesFiltrados.length,
              completos: this.docentesFiltrados.filter(d => this.obtenerSemaforoDocente(d).clave === 'COMPLETO').length,
              intermedios: this.docentesFiltrados.filter(d => this.obtenerSemaforoDocente(d).clave === 'INTERMEDIO').length,
              basicos: this.docentesFiltrados.filter(d => this.obtenerSemaforoDocente(d).clave === 'BASICO').length
            };
          },
          resumenDocentes() {
            return {
              total: this.docentes.length,
              activos: this.docentes.filter(d => (d.estatus || 'ACTIVO') === 'ACTIVO').length,
              inactivos: this.docentes.filter(d => (d.estatus || 'ACTIVO') === 'INACTIVO').length,
              completos: this.docentes.filter(d => this.obtenerSemaforoDocente(d).clave === 'COMPLETO').length,
              intermedios: this.docentes.filter(d => this.obtenerSemaforoDocente(d).clave === 'INTERMEDIO').length,
              basicos: this.docentes.filter(d => this.obtenerSemaforoDocente(d).clave === 'BASICO').length
            };
          },
          semaforoFormulario() {
            const base = {
              ...this.form,
              docente: this.nombreCompletoPreview,
              coordinador: this.coordinadorSesion
            };
            return evaluarCompletitudDocenteCliente(base, this.coordinadorSesion);
          },
          indicadorCategoria() {
            const valor = this.form.categoria || '';
            const mensajes = {
              'V': { titulo: 'Docente VIP', detalle: 'Máximo 35 horas por semana.', clases: 'bg-blue-50 text-blue-800 border-blue-200' },
              'M': { titulo: 'Docente Medio tiempo', detalle: 'Máximo 25 horas por semana.', clases: 'bg-amber-50 text-amber-800 border-amber-200' },
              'N': { titulo: 'Docente Nuevo ingreso', detalle: 'Máximo 15 horas por semana.', clases: 'bg-emerald-50 text-emerald-800 border-emerald-200' }
            };
            return mensajes[valor] || { titulo: 'Selecciona una categoría', detalle: 'Define la categoría para controlar correctamente el máximo de horas.', clases: 'bg-gray-50 text-gray-700 border-gray-200' };
          },
          indicadorTipoPago() {
            const valor = this.form.tipoPago1 || '';
            const mensajes = {
              'E': { titulo: 'Efectivo', detalle: 'Se guardará con clave E en la columna de Tipo de Pago.', clases: 'bg-green-50 text-green-800 border-green-200' },
              '1': { titulo: 'Santander', detalle: 'Se guardará con clave 1 en la columna de Tipo de Pago.', clases: 'bg-red-50 text-red-800 border-red-200' },
              '2': { titulo: 'Banorte', detalle: 'Se guardará con clave 2 en la columna de Tipo de Pago.', clases: 'bg-orange-50 text-orange-800 border-orange-200' }
            };
            return mensajes[valor] || { titulo: 'Selecciona un tipo de pago', detalle: 'Elige la clave correcta para evitar diferencias en Directorio.', clases: 'bg-gray-50 text-gray-700 border-gray-200' };
          }
        },
        methods: {
          badgeEstatus(estatus) {
            return (estatus || 'ACTIVO') === 'ACTIVO'
              ? 'bg-emerald-100 text-emerald-700 border border-emerald-200'
              : 'bg-gray-100 text-gray-600 border border-gray-200';
          },
          badgeCategoria(cat) {
            const mapa = {
              'V': 'bg-blue-100 text-blue-700 border border-blue-200',
              'M': 'bg-amber-100 text-amber-700 border border-amber-200',
              'N': 'bg-emerald-100 text-emerald-700 border border-emerald-200'
            };
            return mapa[cat] || 'bg-gray-100 text-gray-600 border border-gray-200';
          },
          badgeTipoPago(tipo) {
            const mapa = {
              'E': 'bg-green-100 text-green-700 border border-green-200',
              '1': 'bg-red-100 text-red-700 border border-red-200',
              '2': 'bg-orange-100 text-orange-700 border border-orange-200'
            };
            return mapa[tipo] || 'bg-gray-100 text-gray-600 border border-gray-200';
          },
          descripcionTipoPago: describirTipoPago,
          toggleOrden(campo) {
            if (this.ordenCampo === campo) {
              this.ordenDireccion = this.ordenDireccion === 'asc' ? 'desc' : 'asc';
              return;
            }
            this.ordenCampo = campo;
            this.ordenDireccion = campo === 'semaforo' ? 'desc' : 'asc';
          },
          iconoOrden(campo) {
            if (this.ordenCampo !== campo) return 'fa-sort text-gray-400';
            return this.ordenDireccion === 'asc'
              ? 'fa-sort-up text-blue-600'
              : 'fa-sort-down text-blue-600';
          },
          limpiarFiltrosTabla() {
            this.filtroTexto = '';
            this.filtroEstatus = 'TODOS';
            this.filtroCategoria = 'TODOS';
            this.filtroTipoPago = 'TODOS';
            this.filtroSemaforo = 'TODOS';
            this.ordenCampo = 'docente';
            this.ordenDireccion = 'asc';
          },
          obtenerSemaforoDocente(doc) {
            return evaluarCompletitudDocenteCliente(doc, this.coordinadorSesion);
          },
          limpiarCampoMayuscula(campo) {
            this.form[campo] = limpiarTextoDocente(this.form[campo]);
          },
          limpiarCampoLibre(campo) {
            this.form[campo] = (this.form[campo] || '').toString().replace(/\s+/g, ' ').trim();
          },
          limpiarTelefono() {
            this.form.telefono = (this.form.telefono || '').toString().replace(/[^0-9+]/g, '');
          },
          limpiarCorreo() {
            this.form.correo = (this.form.correo || '').toString().trim().toLowerCase();
          },
          limpiarRFC() {
            this.form.rfc = (this.form.rfc || '').toString().toUpperCase().replace(/\s+/g, '').trim();
          },
          setMensaje(tipo, texto) {
            this.mensaje = { tipo, texto };
          },
          limpiarMensaje() {
            this.mensaje = { tipo: '', texto: '' };
          },
          abrirConstancia(doc) {
            abrirUrlNuevaPestana(doc && doc.constanciaUrl);
          },
          limpiarArchivoConstancia() {
            this.archivoConstanciaBase64 = '';
            this.archivoConstanciaNombre = '';
            this.archivoConstanciaMime = '';
            const input = document.getElementById('input-constancia-fiscal');
            if (input) input.value = '';
          },
          seleccionarConstancia(event) {
            const archivo = event && event.target && event.target.files ? event.target.files[0] : null;
            if (!archivo) {
              this.limpiarArchivoConstancia();
              return;
            }

            const permitidos = ['application/pdf', 'image/jpeg', 'image/png'];
            if (!permitidos.includes(archivo.type)) {
              this.setMensaje('error', 'La constancia debe estar en formato PDF, JPG o PNG.');
              this.limpiarArchivoConstancia();
              return;
            }

            const maximo = 7.5 * 1024 * 1024;
            if (archivo.size > maximo) {
              this.setMensaje('error', 'La constancia excede el tamaño máximo permitido de 7.5 MB.');
              this.limpiarArchivoConstancia();
              return;
            }

            const reader = new FileReader();
            reader.onload = () => {
              const resultado = reader.result || '';
              const partes = resultado.toString().split(',');
              this.archivoConstanciaBase64 = partes.length > 1 ? partes[1] : '';
              this.archivoConstanciaNombre = archivo.name || '';
              this.archivoConstanciaMime = archivo.type || '';
              this.setMensaje('ok', `Archivo listo para cargar: ${this.archivoConstanciaNombre}`);
            };
            reader.onerror = () => {
              this.setMensaje('error', 'No fue posible leer el archivo seleccionado.');
              this.limpiarArchivoConstancia();
            };
            reader.readAsDataURL(archivo);
          },
          subirConstanciaFiscal() {
            if (!this.form.filaHoja) {

          exportarCSV(scope = 'filtrados') {
            const registros = scope === 'todos' ? this.docentes : this.docentesFiltrados;
            if (!registros.length) {
              this.setMensaje('error', 'No hay docentes para exportar con el filtro actual.');
              return;
            }

            const encabezados = [
              'Docente', 'Nombres', 'Apellido paterno', 'Apellido materno', 'Grado', 'Tipo de pago', 'Descripcion tipo pago',
              'Categoria', 'Ubicacion', 'Comentario', 'Observacion', 'Telefono', 'Correo', 'RFC', 'Identificador',
              'Banco detalle', 'Estatus', 'Coordinador', 'Constancia nombre', 'Constancia fecha', 'Constancia actualizada por', 'Constancia URL',
              'Semaforo', 'Completitud %', 'Fecha creacion', 'Creado por', 'Fecha actualizacion', 'Actualizado por'
            ];

            const escapar = (valor) => '"' + ((valor ?? '').toString().replace(/"/g, '""')) + '"';
            const filas = registros.map(doc => {
              const sem = this.obtenerSemaforoDocente(doc);
              return [
                doc.docente || '',
                doc.nombres || '',
                doc.apellidoPaterno || '',
                doc.apellidoMaterno || '',
                doc.grado || '',
                doc.tipoPago1 || '',
                this.descripcionTipoPago(doc.tipoPago1),
                doc.categoria || '',
                doc.ubicacion || '',
                doc.comentario || '',
                doc.observacion || '',
                doc.telefono || '',
                doc.correo || '',
                doc.rfc || '',
                doc.identificador || '',
                doc.bancoDetalle || '',
                doc.estatus || '',
                doc.coordinador || '',
                doc.constanciaNombre || '',
                doc.constanciaFecha || '',
                doc.constanciaActualizadaPor || '',
                doc.constanciaUrl || '',
                sem.etiqueta,
                sem.porcentaje + '%',
                doc.fechaCreacion || '',
                doc.creadoPor || '',
                doc.fechaActualizacion || '',
                doc.actualizadoPor || ''
              ].map(escapar).join(',');
            });

            const csv = '\ufeff' + [encabezados.map(escapar).join(','), ...filas].join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const fecha = new Date().toISOString().slice(0, 10);
            a.href = url;
            a.download = `directorio_docentes_${scope}_${fecha}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            this.setMensaje('ok', `Se exportó el directorio (${registros.length} registro${registros.length === 1 ? '' : 's'}).`);
          },
          guardarDocente() {
            if (!this.formularioValido) {
              this.setMensaje('error', 'Completa Nombre(s), Apellido paterno, Categoría y Tipo de pago.');
              return;
            }

            if (this.coincidenciaExacta) {
              this.setMensaje('error', `Ya existe un docente con ese nombre: ${this.coincidenciaExacta.docente}. Usa Editar en lugar de duplicarlo.`);
              return;
            }

            this.guardando = true;
            this.limpiarMensaje();

            const payloadGuardar = {
              modo: this.modo,
              filaHoja: this.form.filaHoja,
              idDocente: this.form.idDocente,
              nombres: limpiarTextoDocente(this.form.nombres),

              rfc: this.form.rfc,
              identificador: this.form.identificador,
              bancoDetalle: this.form.bancoDetalle,
              estatus: this.form.estatus
            };

            services.docentes.guardar(tokenSesionActual, payloadGuardar)
              .then((res) => {
                this.guardando = false;
                if (res.success) {
                  this.setMensaje('ok', res.message);

                }
              })
              .catch((error) => {
                if (esErrorSesionExpirada(error)) return;
                this.guardando = false;
                this.setMensaje('error', 'Error de conexión al guardar el docente.');
              });
          },
          recargarCatalogo(filaMantener) {
            this.recargando = true;
            services.docentes.obtenerCatalogo(tokenSesionActual)
              .then((res) => {
                this.recargando = false;
                if (!res.success) {
                  this.setMensaje('error', res.error || 'No fue posible recargar el directorio.');
                  return;
                }
                this.docentes = res.docentes || [];
                this.historialReciente = res.historialReciente || [];

                  }

                if (esErrorSesionExpirada(error)) return;
                this.recargando = false;
                this.setMensaje('error', 'Error de conexión al recargar el directorio.');
              });
          }

    // --- FUNCIONES PARA FASE 4: CAPTURAR HORARIO (VUE) ---

    function limpiarValorHorarioNumero(valor) {
      const numero = parseFloat(valor);
      return Number.isFinite(numero) ? numero : 0;
    }

    function formatearHorasHorarioVue(valor) {
      const numero = parseFloat(valor) || 0;
      return Number.isInteger(numero) ? numero.toString() : numero.toFixed(1);
    }

    function obtenerEstadoHorarioPorValor(valor, maxHoras) {
      if (valor > maxHoras) {
        return {
          key: 'EXCEDE',
          texto: 'Excede límite',
          clases: 'border-red-200 bg-red-50 text-red-800',
          badge: 'bg-red-100 text-red-700 border-red-200',
          punto: 'bg-red-500',
          prioridad: 4
        };
      }

      if (valor >= maxHoras) {
        return {
          key: 'AL_LIMITE',
          texto: 'Al límite',
          clases: 'border-orange-200 bg-orange-50 text-orange-800',
          badge: 'bg-orange-100 text-orange-700 border-orange-200',
          punto: 'bg-orange-500',
          prioridad: 3
        };
      }

      if (valor >= (maxHoras * 0.8)) {
        return {
          key: 'CERCA',
          texto: 'Cerca del límite',
          clases: 'border-yellow-200 bg-yellow-50 text-yellow-800',
          badge: 'bg-yellow-100 text-yellow-700 border-yellow-200',
          punto: 'bg-yellow-500',
          prioridad: 2
        };
      }

      return {
        key: 'DISPONIBLE',
        texto: 'Disponible',
        clases: 'border-green-200 bg-green-50 text-green-800',
        badge: 'bg-green-100 text-green-700 border-green-200',
        punto: 'bg-green-500',
        prioridad: 1
      };
    }

    function cargarCapturarHorario(contenedor) {
      montarVistaAsync(contenedor, {
        shellAppKey: 'capturarHorarioShellVueApp',
        childAppKey: 'capturarHorarioVueApp',
        rootId: 'capturar-horario-shell-root',
        title: 'Capturar Horario',
        loaderText: 'Cargando datos y registros...',
        loaderIconClass: 'fa-circle-notch text-blue-600',
        fetcher: () => services.horarios.obtenerListas(obtenerTokenSesionActual()),
        mounter: montarCapturarHorarioVue
      });
    }

    function montarCapturarHorarioVue(root, payload) {
      const { createApp } = Vue;

      window.capturarHorarioVueApp = createApp({
        data() {
          return {
            coordinadorSesion: nombreCoordinadorActual,
            rolSesion: payload.rol || rolUsuarioActual,
            asignaturas: payload.asignaturas || [],
            docentesInfo: payload.docentesInfo || [],
            tabuladores: payload.tabuladores || [],
            horarios: payload.horarios || [],
            configuracionCalendario: payload.configuracionCalendario || {},
            cicloDestinoHorarios: payload.cicloDestinoHorarios || { habilitado: false, activo: false, periodo: '', cuatrimestre: '', valido: false },
            vistaCiclo: payload.vistaCicloActual || 'OPERATIVO',
            guardando: false,
            recargando: false,
            eliminandoFila: null,
            filtroTexto: '',
            filtroEstado: 'TODOS',
            filtroCoordinador: 'TODOS',
            filtroSoloMios: false,
            mensaje: { tipo: '', texto: '' },
            form: {
              filaEditando: null,
              coordinador: nombreCoordinadorActual,
              grupo: '',
              tabulador: '',
              tabDinero: '',
              asignatura: '',
              docente: '',
              l: '',
              m: '',
              x: '',
              j: '',
              v: '',
              s1: '',
              s2: '',
              hojaOrigen: '',
              vistaCicloRegistro: 'OPERATIVO'
            }
          };
        },
        computed: {
          esAdmin() {
            return (this.rolSesion || '').toLowerCase() === 'admin';
          },
          cicloDestinoHorariosActivo() {
            return !!(this.cicloDestinoHorarios && this.cicloDestinoHorarios.activo);
          },
          puedeVerCicloDestino() {
            return this.cicloDestinoHorariosActivo;
          },
          periodoCapturaHorarios() {
            return this.vistaCiclo === 'DESTINO'
              ? (this.cicloDestinoHorarios.periodo || '')
              : ((this.configuracionCalendario && this.configuracionCalendario.periodoOperativo) || '');
          },
          cuatrimestreCapturaHorarios() {
            return this.vistaCiclo === 'DESTINO'
              ? (this.cicloDestinoHorarios.cuatrimestre || '')
              : ((this.configuracionCalendario && this.configuracionCalendario.cuatrimestreOperativo) || '');
          },
          tabuladorSeleccionado() {
            return this.tabuladores.find(t => t.nombre === this.form.tabulador) || null;
          },
          tabuladorMonto() {
            return this.tabuladorSeleccionado ? parseFloat(this.tabuladorSeleccionado.monto) || 0 : 0;
          },
          docentesMap() {
            const mapa = {};
            (this.docentesInfo || []).forEach(doc => {
              mapa[doc.nombre] = doc;
            });
            return mapa;
          },
          coordinadoresTabla() {
            return Array.from(new Set((this.horarios || []).map(h => h.coordinador).filter(Boolean))).sort((a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' }));
          },
          formHoras() {
            const l = limpiarValorHorarioNumero(this.form.l);
            const m = limpiarValorHorarioNumero(this.form.m);
            const x = limpiarValorHorarioNumero(this.form.x);
            const j = limpiarValorHorarioNumero(this.form.j);
            const v = limpiarValorHorarioNumero(this.form.v);
            const s1 = limpiarValorHorarioNumero(this.form.s1);
            const s2 = limpiarValorHorarioNumero(this.form.s2);
            const semana = l + m + x + j + v;
            return {
              l, m, x, j, v, s1, s2,
              semana,
              mod1: semana + s1,
              mod2: semana + s2,
              total: semana + s1 + s2
            };
          },
          docenteActual() {
            return this.docentesMap[(this.form.docente || '').trim()] || null;
          },
          horarioOriginalEditando() {
            if (!this.form.filaEditando) return null;
            return (this.horarios || []).find(h => h.fila === this.form.filaEditando) || null;
          },
          resumenCarga() {
            const nombre = (this.form.docente || '').trim();
            if (!nombre) return { encontrado: false, nombreDocente: '', mensaje: 'Selecciona un docente.' };

            const info = this.docentesMap[nombre];
            if (!info) {
              return { encontrado: false, nombreDocente: nombre, mensaje: 'Docente no encontrado en Directorio.' };
            }

            let semanaBase = parseFloat(info.horasSemana) || 0;
            let mod1Base = parseFloat(info.horasMod1) || 0;
            let mod2Base = parseFloat(info.horasMod2) || 0;

            if (this.horarioOriginalEditando && this.horarioOriginalEditando.docente === nombre) {
              semanaBase -= parseFloat(this.horarioOriginalEditando.totalSemana) || 0;
              mod1Base -= parseFloat(this.horarioOriginalEditando.totMod1) || 0;
              mod2Base -= parseFloat(this.horarioOriginalEditando.totMod2) || 0;
            }

            semanaBase = Math.max(0, semanaBase);
            mod1Base = Math.max(0, mod1Base);
            mod2Base = Math.max(0, mod2Base);

            const captura = this.formHoras;
            const semanaFinal = semanaBase + captura.semana;
            const mod1Final = mod1Base + captura.mod1;
            const mod2Final = mod2Base + captura.mod2;
            const maxHoras = parseFloat(info.maxHoras) || 0;
            const restanteSemana = maxHoras - semanaBase;
            const restanteMod1 = maxHoras - mod1Base;
            const restanteMod2 = maxHoras - mod2Base;
            const restanteFinalSemana = maxHoras - semanaFinal;
            const restanteFinalMod1 = maxHoras - mod1Final;
            const restanteFinalMod2 = maxHoras - mod2Final;

            const estados = [
              { eje: 'SEMANA', valor: semanaFinal, ...obtenerEstadoHorarioPorValor(semanaFinal, maxHoras) },
              { eje: 'MOD 1', valor: mod1Final, ...obtenerEstadoHorarioPorValor(mod1Final, maxHoras) },
              { eje: 'MOD 2', valor: mod2Final, ...obtenerEstadoHorarioPorValor(mod2Final, maxHoras) }
            ];

            const peorEstado = estados.reduce((peor, actual) => actual.prioridad > peor.prioridad ? actual : peor, estados[0]);

            return {
              encontrado: true,
              nombreDocente: nombre,
              categoria: info.categoria || 'N',
              maxHoras,
              actualSemana: semanaBase,
              actualMod1: mod1Base,
              actualMod2: mod2Base,
              restanteSemana,
              restanteMod1,
              restanteMod2,
              capturaSemana: captura.semana,
              capturaMod1: captura.mod1,
              capturaMod2: captura.mod2,
              finalSemana: semanaFinal,
              finalMod1: mod1Final,
              finalMod2: mod2Final,
              restanteFinalSemana,
              restanteFinalMod1,
              restanteFinalMod2,
              estadoGlobal: peorEstado,
              estados: estados
            };
          },
          mensajeDocente() {
            const resumen = this.resumenCarga;
            if (!this.form.docente) {
              return { tipo: 'info', texto: 'Selecciona un docente para ver su carga global y la proyección con esta captura.' };
            }
            if (!resumen.encontrado) {
              return { tipo: 'error', texto: resumen.mensaje };
            }
            const actual = `Restante actual: Sem ${formatearHorasHorarioVue(Math.max(0, resumen.restanteSemana))}h · Mod 1 ${formatearHorasHorarioVue(Math.max(0, resumen.restanteMod1))}h · Mod 2 ${formatearHorasHorarioVue(Math.max(0, resumen.restanteMod2))}h`;
            const final = `Con esta captura quedará: Sem ${formatearHorasHorarioVue(resumen.finalSemana)}h · Mod 1 ${formatearHorasHorarioVue(resumen.finalMod1)}h · Mod 2 ${formatearHorasHorarioVue(resumen.finalMod2)}h`;
            if (resumen.estadoGlobal.key === 'EXCEDE') {
              return {
                tipo: 'error',
                texto: `Categoría ${resumen.categoria} · Máx ${formatearHorasHorarioVue(resumen.maxHoras)}h · ${resumen.estadoGlobal.eje} excedido. ${actual} · ${final}`
              };
            }
            if (resumen.estadoGlobal.key === 'AL_LIMITE' || resumen.estadoGlobal.key === 'CERCA') {
              return {
                tipo: 'warning',
                texto: `Categoría ${resumen.categoria} · Máx ${formatearHorasHorarioVue(resumen.maxHoras)}h · ${resumen.estadoGlobal.texto} en ${resumen.estadoGlobal.eje}. ${actual} · ${final}`
              };
            }
            return {
              tipo: 'ok',
              texto: `Categoría ${resumen.categoria} · Máx ${formatearHorasHorarioVue(resumen.maxHoras)}h. ${actual} · ${final}`
            };
          },
          semaforosProyectados() {
            const resumen = this.resumenCarga;
            if (!resumen.encontrado) {
              return [
                { titulo: 'Semana', neutral: true },
                { titulo: 'Mod 1', neutral: true },
                { titulo: 'Mod 2', neutral: true }
              ];
            }
            return [
              { titulo: 'Semana', valor: resumen.finalSemana, maxHoras: resumen.maxHoras, ...obtenerEstadoHorarioPorValor(resumen.finalSemana, resumen.maxHoras) },
              { titulo: 'Mod 1', valor: resumen.finalMod1, maxHoras: resumen.maxHoras, ...obtenerEstadoHorarioPorValor(resumen.finalMod1, resumen.maxHoras) },
              { titulo: 'Mod 2', valor: resumen.finalMod2, maxHoras: resumen.maxHoras, ...obtenerEstadoHorarioPorValor(resumen.finalMod2, resumen.maxHoras) }
            ];
          },
          filtrosActivos() {
            const chips = [];
            if ((this.filtroTexto || '').trim()) chips.push({ key: 'texto', label: `Texto: ${this.filtroTexto}` });
            if (this.filtroEstado !== 'TODOS') chips.push({ key: 'estado', label: `Estado: ${this.labelFiltroEstado(this.filtroEstado)}` });
            if (this.filtroCoordinador !== 'TODOS') chips.push({ key: 'coordinador', label: `Coordinador: ${this.filtroCoordinador}` });
            if (this.filtroSoloMios) chips.push({ key: 'soloMios', label: 'Solo mis registros' });
            return chips;
          },
          tablaFiltrada() {
            const texto = (this.filtroTexto || '').toLowerCase().trim();
            return (this.horarios || []).filter(row => {
              const coincideTexto = !texto || [row.docente, row.asignatura, row.grupo, row.coordinador, row.tabulador]
                .join(' ')
                .toLowerCase()
                .includes(texto);
              const coincideCoord = this.filtroCoordinador === 'TODOS' || (row.coordinador || '') === this.filtroCoordinador;
              const coincideSoloMios = !this.filtroSoloMios || this.puedeEditar(row);
              const estado = this.obtenerEstadoGlobalPersistido(row.docente);
              const coincideEstado = this.filtroEstado === 'TODOS' || estado.key === this.filtroEstado;
              return coincideTexto && coincideCoord && coincideSoloMios && coincideEstado;
            });
          },
          resumenTabla() {
            const resumen = { DISPONIBLE: 0, CERCA: 0, AL_LIMITE: 0, EXCEDE: 0 };
            const docentesUnicos = Array.from(new Set((this.tablaFiltrada || []).map(r => (r.docente || '').trim()).filter(Boolean)));
            docentesUnicos.forEach(nombre => {
              const estado = this.obtenerEstadoGlobalPersistido(nombre);
              if (resumen.hasOwnProperty(estado.key)) resumen[estado.key] += 1;
            });
            return resumen;
          },
          puedeGuardar() {
            if (this.guardando) return false;
            if (!this.form.docente || !this.form.asignatura || !this.form.grupo || !this.form.tabulador) return false;
            const resumen = this.resumenCarga;
            if (!resumen.encontrado) return false;
            return resumen.estadoGlobal.key !== 'EXCEDE';
          }
        },
        mounted() {
          if (this.cicloDestinoHorariosActivo && this.vistaCiclo !== 'DESTINO') {
            this.vistaCiclo = 'DESTINO';
            this.refrescarHorarios(null, 'DESTINO');
          }
        },
        methods: {
          setMensaje(tipo, texto) {
            this.mensaje = { tipo, texto };
          },
          limpiarMensaje() {
            this.mensaje = { tipo: '', texto: '' };
          },
          formatearHorasHorarioVue(valor) {
            return formatearHorasHorarioVue(valor);
          },
          etiquetaRestante(restante) {
            const numero = parseFloat(restante) || 0;
            if (numero < 0) return `Excede por ${formatearHorasHorarioVue(Math.abs(numero))}h`;
            if (numero === 0) return 'Sin horas disponibles';
            return `${formatearHorasHorarioVue(numero)}h disponibles`;
          },
          detalleRestante(actual, maximo, final) {
            const restanteActual = Math.max(0, (parseFloat(maximo) || 0) - (parseFloat(actual) || 0));
            const restanteProyectado = Math.max(0, (parseFloat(maximo) || 0) - (parseFloat(final) || 0));
            return `Actual: ${formatearHorasHorarioVue(actual)}h de ${formatearHorasHorarioVue(maximo)}h · Restante actual: ${formatearHorasHorarioVue(restanteActual)}h · Quedará en: ${formatearHorasHorarioVue(final)}h · Restante proyectado: ${formatearHorasHorarioVue(restanteProyectado)}h`;
          },
          claseMensaje(tipo) {
            if (tipo === 'ok') return 'bg-emerald-50 border-emerald-200 text-emerald-700';
            if (tipo === 'warning') return 'bg-yellow-50 border-yellow-200 text-yellow-800';
            return 'bg-red-50 border-red-200 text-red-700';
          },
          claseMensajeDocente() {
            return this.claseMensaje(this.mensajeDocente.tipo === 'info' ? 'warning' : this.mensajeDocente.tipo);
          },
          labelFiltroEstado(key) {
            const mapa = {
              'TODOS': 'Todos',
              'DISPONIBLE': 'Disponible',
              'CERCA': 'Cerca del límite',
              'AL_LIMITE': 'Al límite',
              'EXCEDE': 'Excede límite'
            };
            return mapa[key] || key;
          },
          badgeEstado(key) {
            return obtenerEstadoHorarioPorValor(
              key === 'EXCEDE' ? 999 : key === 'AL_LIMITE' ? 100 : key === 'CERCA' ? 80 : 0,
              100
            ).badge;
          },
          limpiarFiltroChip(chip) {
            if (chip.key === 'texto') this.filtroTexto = '';
            if (chip.key === 'estado') this.filtroEstado = 'TODOS';
            if (chip.key === 'coordinador') this.filtroCoordinador = 'TODOS';
            if (chip.key === 'soloMios') this.filtroSoloMios = false;
          },
          descripcionTipoPermiso(row) {
            if (this.esAdmin && row.coordinador !== this.coordinadorSesion) return 'Editable · Admin';
            if (this.puedeEditar(row)) return 'Mi registro';
            return 'Bloqueado';
          },
          clasePermiso(row) {
            if (this.esAdmin && row.coordinador !== this.coordinadorSesion) return 'bg-violet-100 text-violet-700 border-violet-200';
            if (this.puedeEditar(row)) return 'bg-blue-100 text-blue-700 border-blue-200';
            return 'bg-slate-100 text-slate-600 border-slate-200';
          },
          puedeEditar(row) {
            return this.esAdmin || (row.coordinador || '') === this.coordinadorSesion;
          },
          obtenerEstadoGlobalPersistido(nombreDocente) {
            const info = this.docentesMap[(nombreDocente || '').trim()];
            if (!info) {
              return {
                key: 'SIN_DATOS',
                texto: 'Sin datos',
                badge: 'bg-slate-100 text-slate-600 border-slate-200',
                detalle: 'No se encontró información del docente en Directorio.'
              };
            }
            const max = parseFloat(info.maxHoras) || 0;
            const estados = [
              { eje: 'SEMANA', valor: parseFloat(info.horasSemana) || 0, ...obtenerEstadoHorarioPorValor(parseFloat(info.horasSemana) || 0, max) },
              { eje: 'MOD 1', valor: parseFloat(info.horasMod1) || 0, ...obtenerEstadoHorarioPorValor(parseFloat(info.horasMod1) || 0, max) },
              { eje: 'MOD 2', valor: parseFloat(info.horasMod2) || 0, ...obtenerEstadoHorarioPorValor(parseFloat(info.horasMod2) || 0, max) }
            ];
            const peor = estados.reduce((peor, actual) => actual.prioridad > peor.prioridad ? actual : peor, estados[0]);
            return {
              ...peor,
              detalle: `SEM ${formatearHorasHorarioVue(parseFloat(info.horasSemana) || 0)}/${formatearHorasHorarioVue(max)}h · MOD 1 ${formatearHorasHorarioVue(parseFloat(info.horasMod1) || 0)}/${formatearHorasHorarioVue(max)}h · MOD 2 ${formatearHorasHorarioVue(parseFloat(info.horasMod2) || 0)}/${formatearHorasHorarioVue(max)}h`
            };
          },
          seleccionarTabulador() {
            this.form.tabDinero = this.tabuladorMonto ? this.tabuladorMonto.toString() : '';
          },
          limpiarFormulario() {
            this.form = {
              filaEditando: null,
              coordinador: this.coordinadorSesion,
              grupo: '',
              tabulador: '',
              tabDinero: '',
              asignatura: '',
              docente: '',
              l: '',
              m: '',
              x: '',
              j: '',
              v: '',
              s1: '',
              s2: '',
              hojaOrigen: '',
              vistaCicloRegistro: this.vistaCiclo
            };
          },
          cancelarEdicion() {
            this.limpiarFormulario();
            this.limpiarMensaje();
          },
          editarHorario(row) {
            if (!this.puedeEditar(row)) return;
            this.form = {
              filaEditando: row.fila,
              coordinador: this.coordinadorSesion,
              grupo: row.grupo || '',
              tabulador: row.tabulador || '',
              tabDinero: (parseFloat(row.tabDinero) || 0).toString(),
              asignatura: row.asignatura || '',
              docente: row.docente || '',
              l: row.l || '',
              m: row.m || '',
              x: row.x || '',
              j: row.j || '',
              v: row.v || '',
              s1: row.s1 || '',
              s2: row.s2 || '',
              hojaOrigen: row.hojaOrigen || '',
              vistaCicloRegistro: row.vistaCiclo || this.vistaCiclo
            };
            this.limpiarMensaje();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          },
          cambiarVistaCiclo(nuevaVista) {
            const vistaNormalizada = (nuevaVista === 'DESTINO' && this.puedeVerCicloDestino) ? 'DESTINO' : 'OPERATIVO';
            if (vistaNormalizada === this.vistaCiclo && !this.recargando) return;
            this.vistaCiclo = vistaNormalizada;
            this.cancelarEdicion();
            this.horarios = [];
            this.docentesInfo = [];
            this.setMensaje('warning', `Cargando registros de ${vistaNormalizada === 'DESTINO' ? 'Siguiente ciclo' : 'Ciclo actual'}...`);
            this.refrescarHorarios(null, vistaNormalizada);
          },
          refrescarHorarios(mantenerFila = null, vistaDeseada = null) {
            const vistaSolicitada = (vistaDeseada === 'DESTINO' && this.puedeVerCicloDestino) ? 'DESTINO' : 'OPERATIVO';
            this.recargando = true;
            services.horarios.obtenerListas(tokenSesionActual, vistaSolicitada)
              .then((res) => {
                this.recargando = false;
                if (!res.success) {
                  this.setMensaje('error', res.error || 'No fue posible refrescar los horarios.');
                  return;
                }
                this.asignaturas = res.asignaturas || [];
                this.docentesInfo = res.docentesInfo || [];
                this.tabuladores = res.tabuladores || [];
                this.horarios = res.horarios || [];
                this.configuracionCalendario = res.configuracionCalendario || this.configuracionCalendario || {};
                this.cicloDestinoHorarios = res.cicloDestinoHorarios || this.cicloDestinoHorarios || { habilitado: false, activo: false, periodo: '', cuatrimestre: '', valido: false };
                this.rolSesion = res.rol || this.rolSesion || rolUsuarioActual;
                this.vistaCiclo = res.vistaCicloActual || vistaSolicitada;
                this.setMensaje('ok', `Mostrando ${this.vistaCiclo === 'DESTINO' ? 'Siguiente ciclo' : 'Ciclo actual'}.`);
                if (mantenerFila) {
                  const actualizado = (this.horarios || []).find(h => h.fila === mantenerFila);
                  if (actualizado && this.puedeEditar(actualizado)) {
                    this.editarHorario(actualizado);
                  }
                }
              })
              .catch((error) => {
                if (esErrorSesionExpirada(error)) return;
                this.recargando = false;
                this.setMensaje('error', 'Error de conexión al refrescar horarios.');
              });
          },
          confirmarEliminacionHorario(row) {
            if (!row || !row.fila) {
              this.setMensaje('error', 'No se identificó el registro a eliminar.');
              return;
            }
            if (!this.puedeEditar(row)) {
              this.setMensaje('error', 'No tienes permiso para eliminar este registro.');
              return;
            }
            if (this.eliminandoFila || this.guardando) return;

            const etiqueta = [row.docente || 'Docente', row.asignatura || 'Asignatura', row.grupo || 'Grupo'].filter(Boolean).join(' · ');
            const confirmar = window.confirm(`¿Deseas eliminar este registro de horario?

${etiqueta}

Esta acción no se puede deshacer.`);
            if (!confirmar) return;

            this.eliminandoFila = row.fila;
            this.limpiarMensaje();

            services.horarios.eliminar(tokenSesionActual, { fila: row.fila, hojaOrigen: row.hojaOrigen || '', vistaCiclo: row.vistaCiclo || this.vistaCiclo })
              .then((res) => {
                this.eliminandoFila = null;
                if (res.success) {
                  if (this.form.filaEditando === row.fila) {
                    this.cancelarEdicion();
                  }
                  this.setMensaje('ok', res.message || 'Registro eliminado correctamente.');
                  this.refrescarHorarios(null, this.vistaCiclo);
                } else {
                  this.setMensaje('error', res.error || 'No fue posible eliminar el registro.');
                }
              })
              .catch((error) => {
                this.eliminandoFila = null;
                if (esErrorSesionExpirada(error)) return;
                this.setMensaje('error', 'Error de conexión al eliminar el horario.');
              });
          },
          guardarHorarioVue() {
            const resumen = this.resumenCarga;
            if (!this.form.docente || !this.form.asignatura || !this.form.grupo || !this.form.tabulador) {
              this.setMensaje('error', 'Completa docente, asignatura, grupo y tabulador.');
              return;
            }
            if (!resumen.encontrado) {
              this.setMensaje('error', 'Selecciona un docente válido del Directorio.');
              return;
            }
            if (resumen.estadoGlobal.key === 'EXCEDE') {
              this.setMensaje('error', `No se puede guardar. ${resumen.estadoGlobal.eje} excedido para ${resumen.nombreDocente}.`);
              return;
            }

            this.guardando = true;
            this.limpiarMensaje();

            const datos = {
              filaEditando: this.form.filaEditando,
              coordinador: this.form.coordinador,
              grupo: (this.form.grupo || '').toString().trim().toUpperCase(),
              tabulador: this.form.tabulador,
              tabDinero: this.form.tabDinero,
              asignatura: (this.form.asignatura || '').toString().trim(),
              docente: (this.form.docente || '').toString().trim(),
              l: this.form.l,
              m: this.form.m,
              x: this.form.x,
              j: this.form.j,
              v: this.form.v,
              s1: this.form.s1,
              s2: this.form.s2,
              hojaOrigen: this.form.hojaOrigen || '',
              vistaCiclo: this.form.filaEditando ? (this.form.vistaCicloRegistro || this.vistaCiclo) : this.vistaCiclo
            };

            services.horarios.guardar(tokenSesionActual, datos)
              .then((res) => {
                this.guardando = false;
                if (res.success) {
                  const ciclo = res.cicloAplicado;
                  const extraMsg = (!this.form.filaEditando && ciclo && ciclo.periodo && ciclo.cuatrimestre)
                    ? ` · Ciclo: ${ciclo.cuatrimestre} (${ciclo.periodo})`
                    : '';
                  this.setMensaje('ok', (res.message || 'Horario guardado correctamente.') + extraMsg);
                  this.cancelarEdicion();
                  this.refrescarHorarios(null, this.vistaCiclo);
                } else {
                  this.setMensaje('error', res.error || 'No fue posible guardar el horario.');
                }
              })
              .catch((error) => {
                if (esErrorSesionExpirada(error)) return;
                this.guardando = false;
                this.setMensaje('error', 'Error de conexión al guardar el horario.');
              });
          }
        },
        template: `
          <div class="space-y-6">
            <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
              <div class="xl:col-span-2 bg-white rounded-2xl shadow p-6">
                <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 border-b border-slate-200 pb-4 mb-6">
                  <div>
                    <h3 class="text-2xl font-black text-slate-800">{{ form.filaEditando ? 'Editar registro de horario' : 'Nuevo registro de horario' }}</h3>
                    <p class="text-sm text-slate-500">Se permiten capturas compartidas entre coordinaciones; el control real sigue siendo el límite global del docente.</p>
                  </div>
                  <div class="flex gap-2 flex-wrap">
                    <button @click="cancelarEdicion" type="button" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 px-4 rounded-xl">
                      <i class="fas fa-eraser mr-2"></i>{{ form.filaEditando ? 'Cancelar edición' : 'Limpiar' }}
                    </button>
                    <button @click="refrescarHorarios(form.filaEditando, vistaCiclo)" type="button" class="bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold py-2 px-4 rounded-xl">
                      <i class="fas" :class="recargando ? 'fa-spinner fa-spin mr-2' : 'fa-rotate mr-2'"></i>Recargar
                    </button>
                  </div>
                </div>

                <div class="rounded-2xl border px-4 py-4 mb-6" :class="vistaCiclo === 'DESTINO' ? 'border-amber-200 bg-amber-50' : 'border-blue-200 bg-blue-50'">
                  <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4">
                    <div>
                      <div class="text-sm font-black" :class="vistaCiclo === 'DESTINO' ? 'text-amber-800' : 'text-blue-800'">
                        {{ vistaCiclo === 'DESTINO' ? 'Vista del siguiente ciclo' : 'Vista del ciclo actual' }}
                      </div>
                      <div class="text-sm mt-1" :class="vistaCiclo === 'DESTINO' ? 'text-amber-700' : 'text-blue-700'">
                        Los registros visibles y los cálculos de carga se toman desde <b>{{ vistaCiclo === 'DESTINO' ? 'Ciclo Destino' : 'Horarios Doc' }}</b>.
                        Los nuevos registros de esta vista se guardarán con <b>{{ cuatrimestreCapturaHorarios || 'sin cuatrimestre' }}</b> y <b>{{ periodoCapturaHorarios || 'sin periodo' }}</b>.
                      </div>
                    </div>
                    <div class="flex flex-col sm:flex-row sm:items-center gap-3">
