                      <div>
                        <label class="block text-sm font-black text-gray-700 mb-2">Mostrar</label>
                        <select v-model="filtroEditable" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                          <option value="TODOS">Todos los registros visibles</option>
                          <option value="EDITABLES">Solo editables</option>
                          <option value="NO_EDITABLES">Solo no editables</option>
                        </select>
                      </div>
                      <div>
                        <label class="block text-sm font-black text-gray-700 mb-2">Estado global del docente</label>
                        <select v-model="filtroCargaBitacora" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                          <option v-for="opc in filtrosCargaDisponibles" :key="'bit-'+opc.valor" :value="opc.valor">{{ opc.etiqueta }}</option>
                        </select>
                      </div>
                      <div>
                        <label class="block text-sm font-black text-gray-700 mb-2">Coordinador</label>
                        <select v-model="filtroCoordinadorBitacora" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                          <option value="TODOS">Todos los coordinadores</option>
                          <option v-for="coord in coordinadoresBitacora" :key="coord" :value="coord">{{ coord }}</option>
                        </select>
                      </div>
                      <div>
                        <label class="block text-sm font-black text-gray-700 mb-2">Quincena</label>
                        <select v-model="filtroQuincena" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                          <option value="TODAS">Todas las quincenas</option>
                          <option v-for="q in quincenasDisponibles" :key="q.valor" :value="q.valor">{{ q.etiqueta }}</option>
                        </select>
                      </div>
                      <div>
                        <label class="block text-sm font-black text-gray-700 mb-2">Desde</label>
                        <input v-model="filtroFechaDesde" type="date" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                      </div>
                      <div>
                        <label class="block text-sm font-black text-gray-700 mb-2">Hasta</label>
                        <input v-model="filtroFechaHasta" type="date" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                      </div>
                      <div class="flex items-end">
                        <button @click="limpiarFiltrosBitacora" type="button" class="w-full px-4 py-3 rounded-xl bg-gray-100 text-gray-700 font-bold hover:bg-gray-200 transition">
                          <i class="fas fa-filter-circle-xmark mr-2"></i>Limpiar filtros
                        </button>
                      </div>
                    </div>
                    <div v-if="chipsBitacoraActivos.length" class="rounded-xl bg-white border border-dashed border-slate-300 p-4">
                      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 mb-3">
                        <div>
                          <div class="text-sm font-black text-slate-700">Filtros activos en bitácora</div>
                          <div class="text-xs text-slate-500">Puedes quitar cada filtro sin limpiar los demás.</div>
                        </div>
                        <button type="button" @click="limpiarFiltrosBitacora" class="text-xs font-bold text-slate-600 hover:text-slate-800 underline underline-offset-2">Quitar todos</button>
                      </div>
                      <div class="flex flex-wrap gap-2">
                        <button v-for="chip in chipsBitacoraActivos" :key="chip.clave" type="button" @click="quitarChipBitacora(chip.clave)" :class="['inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-bold border transition hover:opacity-90', chip.clases]">
                          <span>{{ chip.etiqueta }}: {{ chip.valor }}</span>
                          <i class="fas fa-times text-[10px]"></i>
                        </button>
                      </div>
                    </div>
                    <div class="rounded-xl bg-slate-50 border border-slate-200 p-4 text-sm text-slate-600">
                      <div class="font-black text-slate-700 mb-1">Regla de edición y alerta</div>
                      <div>Solo puedes editar los extras capturados por tu coordinación. Los administradores pueden editar cualquier registro visible. La carga global del docente genera alerta, pero no bloquea el guardado del extra. La evaluación considera Horarios Doc + horas extra acumuladas; si no hay Horarios Doc, parte de base 0 según la categoría del docente.</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
              <div class="px-6 py-4 border-b bg-slate-50 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                <div>
                  <h3 class="text-lg font-black text-gray-800">Bitácora de horas extra</h3>
                  <p class="text-sm text-gray-500">Consulta, filtra por fecha o quincena y edita tus registros recientes sin salir del módulo.</p>
                </div>
                <div class="text-sm text-gray-500 font-semibold">{{ registrosVisibles.length }} registros visibles</div>
              </div>
              <div class="overflow-x-auto">
                <table class="min-w-full text-sm">
                  <thead class="bg-gray-100 border-b">
                    <tr>
                      <th class="py-3 px-4 text-left text-xs font-black uppercase text-gray-600">Fecha</th>
                      <th class="py-3 px-4 text-left text-xs font-black uppercase text-gray-600">Docente</th>
                      <th class="py-3 px-4 text-left text-xs font-black uppercase text-gray-600">Motivo</th>
                      <th class="py-3 px-4 text-center text-xs font-black uppercase text-gray-600">Horas</th>
                      <th class="py-3 px-4 text-center text-xs font-black uppercase text-gray-600">Carga global</th>
                      <th class="py-3 px-4 text-right text-xs font-black uppercase text-gray-600">Tabulador</th>
                      <th class="py-3 px-4 text-right text-xs font-black uppercase text-gray-600">Total</th>
                      <th class="py-3 px-4 text-left text-xs font-black uppercase text-gray-600">Coordinación</th>
                      <th class="py-3 px-4 text-center text-xs font-black uppercase text-gray-600">Acción</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-gray-200">
                    <tr v-if="!registrosVisibles.length">
                      <td colspan="9" class="py-8 px-4 text-center text-gray-500 font-semibold">No hay registros que coincidan con los filtros actuales.</td>
                    </tr>
                    <tr v-for="reg in registrosVisibles" :key="reg.filaHoja" class="hover:bg-emerald-50 transition">
                      <td class="py-3 px-4 text-gray-600 whitespace-nowrap">
                        <div class="font-semibold">{{ reg.fechaRegistro }}</div>
                        <div class="text-xs text-gray-400">Actividad: {{ reg.fechaActividad || '-' }}</div>
                      </td>
                      <td class="py-3 px-4">
                        <div class="font-bold text-gray-800">{{ reg.docente }}</div>
                        <div class="text-xs text-gray-400">{{ reg.referencia || reg.capturadoPor || '-' }}</div>
                      </td>
                      <td class="py-3 px-4 text-gray-700">
                        <div class="font-semibold">{{ reg.motivo || '-' }}</div>
                        <div class="text-xs text-gray-400">{{ reg.observaciones || '' }}</div>
                      </td>
                      <td class="py-3 px-4 text-center font-black text-emerald-700">{{ formatearHoras(reg.horas) }}h</td>
                      <td class="py-3 px-4 text-center">
                        <template v-if="obtenerDocentePorNombre(reg.docente)">
                          <div :class="['inline-flex items-center px-3 py-1 rounded-full text-xs font-black border', clasesCarga(obtenerDocentePorNombre(reg.docente))]">
                            {{ formatearHoras(obtenerDocentePorNombre(reg.docente).horasSemana) }} / {{ formatearHoras(obtenerDocentePorNombre(reg.docente).maxHoras) }}h
                          </div>
                        </template>
                        <span v-else class="text-xs text-gray-400">-</span>
                      </td>
                      <td class="py-3 px-4 text-right font-semibold text-gray-700">{{ formatearMoneda(reg.tabulador) }}</td>
                      <td class="py-3 px-4 text-right font-black text-blue-700">{{ formatearMoneda(reg.total) }}</td>
                      <td class="py-3 px-4 text-gray-500">{{ reg.coordinador || '-' }}</td>
                      <td class="py-3 px-4 text-center">
                        <button v-if="registroEditable(reg)" @click="seleccionarRegistro(reg)" class="px-3 py-1.5 rounded-lg bg-blue-100 text-blue-700 font-bold hover:bg-blue-200 transition text-xs">
                          <i class="fas fa-pen-to-square mr-1"></i> Editar
                        </button>
                        <span v-else class="text-xs text-gray-400 font-semibold"><i class="fas fa-lock mr-1"></i>Solo lectura</span>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `
      });
      window.capturarExtrasVueApp.mount(root);
    }

    

    montarLoginVue();
  </script>
</body>

</html>
