    function valorIncidenciaComparableCliente(valor) {
      return valor === '' || valor === null || typeof valor === 'undefined' ? '' : String(valor);
    }

    function valorNumericoIncidenciaCliente(valor) {
      const numero = parseFloat(valor);
      return isNaN(numero) ? 0 : numero;
    }

    function cargarCapturarIncidencias(contenedor) {
      montarVistaAsync(contenedor, {
        shellAppKey: 'capturarIncidenciasShellVueApp',
        childAppKey: 'capturarIncidenciasVueApp',
        rootId: 'capturar-incidencias-shell-root',
        title: 'Capturar Incidencias',
        loaderText: 'Cargando docentes y registros de Horarios Doc...',
        loaderIconClass: 'fa-circle-notch text-blue-600',
        fetcher: () => services.incidencias.obtenerBase(obtenerTokenSesionActual()),
        mounter: montarCapturarIncidenciasVue
      });
    }

    function montarCapturarIncidenciasVue(root, payload) {
      const { createApp } = Vue;

      window.capturarIncidenciasVueApp = createApp({
        data() {
          return {
            usuarioSesion: nombreCoordinadorActual,
            rolSesion: (rolUsuarioActual || '').toLowerCase(),
            registros: (payload.horarios || []).map(r => ({ ...r })),
            mensaje: { tipo: '', texto: '' },
            buscadorDocente: '',
            docenteSeleccionado: '',
            filtroTablaTexto: '',
            filtroAsignatura: '',
            filtroGrupo: '',
            filtroCoordinador: 'TODOS',
            filtroVisibilidad: 'TODOS',
            filtroIncidencias: 'TODOS',
            filtroCambios: 'TODOS',
            ediciones: {},
            savingRows: {},
            guardandoLote: false,
            accesoCaptura: payload.accesoCaptura || { permitido: true, mensaje: '', etiquetaVentana: '' },
            configuracionCalendario: payload.configuracionCalendario || {}
          };
        },
        computed: {
          esAdmin() {
            return this.rolSesion === 'admin';
          },
          capturaHabilitada() {
            return !!(this.accesoCaptura && this.accesoCaptura.permitido);
          },
          docentesResumen() {
            const mapa = {};
            this.registros.forEach(reg => {
              const nombre = (reg.docente || '').toString().trim();
              if (!nombre) return;
              if (!mapa[nombre]) {
                mapa[nombre] = {
                  docente: nombre,
                  registros: [],
                  totalMaterias: 0,
                  editables: 0,
                  bloqueadas: 0,
                  conIncidencias: 0,
                  faltasAcumuladas: 0,
                  retardosAcumulados: 0,
                  extrasAcumuladas: 0
                };
              }
              const item = mapa[nombre];
              item.registros.push(reg);
              item.totalMaterias += 1;
              const editable = this.esRegistroEditable(reg);
              if (editable) item.editables += 1;
              else item.bloqueadas += 1;

              const faltas = valorNumericoIncidenciaCliente(reg.faltas);
              const retardos = valorNumericoIncidenciaCliente(reg.retardos);
              const extras = valorNumericoIncidenciaCliente(reg.extras);
              item.faltasAcumuladas += faltas;
              item.retardosAcumulados += retardos;
              item.extrasAcumuladas += extras;
              if (faltas > 0 || retardos > 0 || extras > 0) item.conIncidencias += 1;
            });

            return Object.values(mapa)
              .sort((a, b) => a.docente.localeCompare(b.docente, 'es', { sensitivity: 'base' }));
          },
          docentesResumenFiltrados() {
            const texto = (this.buscadorDocente || '').toLowerCase().trim();
            return this.docentesResumen.filter(item => {
              if (!texto) return true;
              return [
                item.docente,
                item.registros.map(r => r.coordinador || '').join(' '),
                item.registros.map(r => r.asignatura || '').join(' '),
                item.registros.map(r => r.grupo || '').join(' ')
              ].join(' ').toLowerCase().includes(texto);
            });
          },
          docenteActualResumen() {
            return this.docentesResumen.find(item => item.docente === this.docenteSeleccionado) || null;
          },
          coordinadoresDocenteActual() {
            if (!this.docenteActualResumen) return [];
            return [...new Set(this.docenteActualResumen.registros.map(r => (r.coordinador || '').toString().trim()).filter(Boolean))]
              .sort((a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' }));
          },
          registrosDocenteFiltrados() {
            if (!this.docenteActualResumen) return [];
            const texto = (this.filtroTablaTexto || '').toLowerCase().trim();
            const asignaturaTexto = (this.filtroAsignatura || '').toLowerCase().trim();
            const grupoTexto = (this.filtroGrupo || '').toLowerCase().trim();

            return this.docenteActualResumen.registros.filter(reg => {
              const coincideTexto = !texto || [reg.asignatura, reg.grupo, reg.coordinador]
                .join(' ')
                .toLowerCase()
                .includes(texto);
              const coincideAsignatura = !asignaturaTexto || (reg.asignatura || '').toLowerCase().includes(asignaturaTexto);
              const coincideGrupo = !grupoTexto || (reg.grupo || '').toLowerCase().includes(grupoTexto);
              const coincideCoordinador = this.filtroCoordinador === 'TODOS' || (reg.coordinador || '') === this.filtroCoordinador;
              const coincideVisibilidad = this.filtroVisibilidad === 'TODOS'
                || (this.filtroVisibilidad === 'EDITABLES' && this.esRegistroEditable(reg))
                || (this.filtroVisibilidad === 'BLOQUEADOS' && !this.esRegistroEditable(reg));
              const tieneIncidencias = this.registroTieneIncidencias(reg);
              const coincideIncidencias = this.filtroIncidencias === 'TODOS'
                || (this.filtroIncidencias === 'CON' && tieneIncidencias)
                || (this.filtroIncidencias === 'SIN' && !tieneIncidencias);
              const modificado = this.registroEstaModificado(reg);
              const coincideCambios = this.filtroCambios === 'TODOS'
                || (this.filtroCambios === 'MODIFICADOS' && modificado)
                || (this.filtroCambios === 'SIN_CAMBIOS' && !modificado);

              return coincideTexto && coincideAsignatura && coincideGrupo && coincideCoordinador && coincideVisibilidad && coincideIncidencias && coincideCambios;
            });
          },
          resumenDocenteActual() {
            const regs = this.registrosDocenteFiltrados;
            return {
              materias: regs.length,
              editables: regs.filter(r => this.esRegistroEditable(r)).length,
              bloqueadas: regs.filter(r => !this.esRegistroEditable(r)).length,
              faltas: regs.reduce((sum, r) => sum + valorNumericoIncidenciaCliente(this.valorActualCampo(r, 'faltas')), 0),
              retardos: regs.reduce((sum, r) => sum + valorNumericoIncidenciaCliente(this.valorActualCampo(r, 'retardos')), 0),
              extras: regs.reduce((sum, r) => sum + valorNumericoIncidenciaCliente(this.valorActualCampo(r, 'extras')), 0),
              conIncidencias: regs.filter(r => this.registroTieneIncidencias(r)).length,
              modificadas: regs.filter(r => this.registroEstaModificado(r)).length
            };
          },
          cambiosPendientesVisibles() {
            return this.registrosDocenteFiltrados.filter(r => this.esRegistroEditable(r) && this.registroEstaModificado(r));
          },
          hayCambiosPendientes() {
            return Object.keys(this.ediciones).length > 0;
          },
          chipsFiltrosActivos() {
            const chips = [];
            if (this.filtroTablaTexto) chips.push({ key: 'texto', label: `Buscar: ${this.filtroTablaTexto}` });
            if (this.filtroAsignatura) chips.push({ key: 'asignatura', label: `Asignatura: ${this.filtroAsignatura}` });
            if (this.filtroGrupo) chips.push({ key: 'grupo', label: `Grupo: ${this.filtroGrupo}` });
            if (this.filtroCoordinador !== 'TODOS') chips.push({ key: 'coordinador', label: `Coord: ${this.filtroCoordinador}` });
            if (this.filtroVisibilidad !== 'TODOS') chips.push({ key: 'visibilidad', label: this.filtroVisibilidad === 'EDITABLES' ? 'Solo editables' : 'Solo bloqueados' });
            if (this.filtroIncidencias !== 'TODOS') chips.push({ key: 'incidencias', label: this.filtroIncidencias === 'CON' ? 'Con incidencias' : 'Sin incidencias' });
            if (this.filtroCambios !== 'TODOS') chips.push({ key: 'cambios', label: this.filtroCambios === 'MODIFICADOS' ? 'Con cambios' : 'Sin cambios' });
            return chips;
          }
        },
        mounted() {
          if (!this.docenteSeleccionado && this.docentesResumenFiltrados.length) {
            this.docenteSeleccionado = this.docentesResumenFiltrados[0].docente;
          }
        },
        watch: {
          docentesResumenFiltrados(nuevos) {
            if (!nuevos.length) {
              this.docenteSeleccionado = '';
              return;
            }
            if (!nuevos.some(item => item.docente === this.docenteSeleccionado)) {
              this.docenteSeleccionado = nuevos[0].docente;
            }
          }
        },
        methods: {
          setMensaje(tipo, texto) {
            asignarMensajeTemporal(this, tipo, texto, 3200);
          },
          seleccionarDocente(nombre) {
            this.docenteSeleccionado = nombre;
          },
          esRegistroEditable(reg) {
            if (!this.capturaHabilitada) return false;
            return this.esAdmin || (reg.coordinador || '').toString().trim() === (this.usuarioSesion || '').toString().trim();
          },
          badgeFila(reg) {
            if (this.esRegistroEditable(reg)) {
              return { texto: this.esAdmin && (reg.coordinador || '') !== (this.usuarioSesion || '') ? 'Editable · Admin' : 'Mi registro', clases: 'bg-emerald-100 text-emerald-700 border-emerald-200' };
            }
            return { texto: 'Bloqueado', clases: 'bg-slate-100 text-slate-600 border-slate-200' };
          },
          badgeGuardado(reg) {
            if (this.savingRows[reg.fila]) {
              return { texto: 'Guardando...', clases: 'bg-blue-100 text-blue-700 border-blue-200' };
            }
            if (this.registroEstaModificado(reg)) {
              return { texto: 'Sin guardar', clases: 'bg-amber-100 text-amber-700 border-amber-200' };
            }
            return { texto: 'Guardado', clases: 'bg-slate-100 text-slate-600 border-slate-200' };
          },
          valorActualCampo(reg, campo) {
            const fila = reg.fila;
            if (this.ediciones[fila] && Object.prototype.hasOwnProperty.call(this.ediciones[fila], campo)) {
              return this.ediciones[fila][campo];
            }
            return reg[campo] === null || typeof reg[campo] === 'undefined' ? '' : reg[campo];
          },
          asignarValorCampo(reg, campo, valor) {
            let limpio = valor;
            if (limpio !== '') {
              const num = parseFloat(limpio);
              limpio = isNaN(num) || num < 0 ? '' : limpio;
            }
            const fila = reg.fila;
            const actual = this.ediciones[fila] ? { ...this.ediciones[fila] } : {
              faltas: reg.faltas === null || typeof reg.faltas === 'undefined' ? '' : String(reg.faltas),
              retardos: reg.retardos === null || typeof reg.retardos === 'undefined' ? '' : String(reg.retardos),
              extras: reg.extras === null || typeof reg.extras === 'undefined' ? '' : String(reg.extras)
            };
            actual[campo] = limpio;
            this.ediciones[fila] = actual;
            if (!this.registroEstaModificado(reg)) {
              delete this.ediciones[fila];
            }
          },
          registroEstaModificado(reg) {
            const fila = reg.fila;
            const edit = this.ediciones[fila];
            if (!edit) return false;
            return ['faltas', 'retardos', 'extras'].some(campo => valorIncidenciaComparableCliente(edit[campo]) !== valorIncidenciaComparableCliente(reg[campo]));
          },
          registroTieneIncidencias(reg) {
            return ['faltas', 'retardos', 'extras'].some(campo => valorNumericoIncidenciaCliente(this.valorActualCampo(reg, campo)) > 0);
          },
          descartarFila(reg) {
            delete this.ediciones[reg.fila];
          },
          limpiarFiltrosTabla() {
            this.filtroTablaTexto = '';
            this.filtroAsignatura = '';
            this.filtroGrupo = '';
            this.filtroCoordinador = 'TODOS';
            this.filtroVisibilidad = 'TODOS';
            this.filtroIncidencias = 'TODOS';
            this.filtroCambios = 'TODOS';
          },
          quitarChip(clave) {
            if (clave === 'texto') this.filtroTablaTexto = '';
            if (clave === 'asignatura') this.filtroAsignatura = '';
            if (clave === 'grupo') this.filtroGrupo = '';
            if (clave === 'coordinador') this.filtroCoordinador = 'TODOS';
            if (clave === 'visibilidad') this.filtroVisibilidad = 'TODOS';
            if (clave === 'incidencias') this.filtroIncidencias = 'TODOS';
            if (clave === 'cambios') this.filtroCambios = 'TODOS';
          },
          guardarFila(reg) {
            if (!this.capturaHabilitada) {
              this.setMensaje('error', (this.accesoCaptura && this.accesoCaptura.mensaje) || 'La ventana de captura de incidencias está cerrada.');
              return;
            }
            if (!this.esRegistroEditable(reg)) {
              this.setMensaje('error', 'No tienes permiso para editar esta fila.');
              return;
            }
            const datos = {
              fila: reg.fila,
              faltas: this.valorActualCampo(reg, 'faltas'),
              retardos: this.valorActualCampo(reg, 'retardos'),
              extras: this.valorActualCampo(reg, 'extras')
            };
            this.savingRows = { ...this.savingRows, [reg.fila]: true };
            services.incidencias.guardarFila(tokenSesionActual, datos)
              .then((res) => {
                const mapa = { ...this.savingRows };
                delete mapa[reg.fila];
                this.savingRows = mapa;
                if (res.success) {
                  reg.faltas = datos.faltas;
                  reg.retardos = datos.retardos;
                  reg.extras = datos.extras;
                  delete this.ediciones[reg.fila];
                  this.setMensaje('ok', `Incidencias guardadas para ${reg.asignatura} · ${reg.grupo}.`);
                } else {
                  this.setMensaje('error', res.error || 'No fue posible guardar la incidencia.');
                }
              })
              .catch((error) => {
                if (esErrorSesionExpirada(error)) return;
                const mapa = { ...this.savingRows };
                delete mapa[reg.fila];
                this.savingRows = mapa;
                this.setMensaje('error', 'Error de conexión al guardar la incidencia.');
              });
          },
          guardarCambiosVisibles() {
            if (!this.capturaHabilitada) {
              this.setMensaje('error', (this.accesoCaptura && this.accesoCaptura.mensaje) || 'La ventana de captura de incidencias está cerrada.');
              return;
            }
            const registros = this.cambiosPendientesVisibles;
            if (!registros.length) {
              this.setMensaje('error', 'No hay cambios visibles pendientes por guardar.');
              return;
            }
            const payloadLote = registros.map(reg => ({
              fila: reg.fila,
              faltas: this.valorActualCampo(reg, 'faltas'),
              retardos: this.valorActualCampo(reg, 'retardos'),
              extras: this.valorActualCampo(reg, 'extras')
            }));
            this.guardandoLote = true;
            services.incidencias.guardarLote(tokenSesionActual, payloadLote)
              .then((res) => {
                this.guardandoLote = false;
                if (res.success) {
                  payloadLote.forEach(item => {
                    const reg = this.registros.find(r => r.fila === item.fila);
                    if (reg) {
                      reg.faltas = item.faltas;
                      reg.retardos = item.retardos;
                      reg.extras = item.extras;
                      delete this.ediciones[item.fila];
                    }
                  });
                  this.setMensaje('ok', res.message || `Se guardaron ${payloadLote.length} filas.`);
                } else {
                  this.setMensaje('error', res.error || 'No fue posible guardar los cambios visibles.');
                }
              })
              .catch((error) => {
                if (esErrorSesionExpirada(error)) return;
                this.guardandoLote = false;
                this.setMensaje('error', 'Error de conexión al guardar los cambios visibles.');
              });
          },
          descartarCambiosVisibles() {
            this.cambiosPendientesVisibles.forEach(reg => {
              delete this.ediciones[reg.fila];
            });
          },
          formatoNumero(valor) {
            const numero = valorNumericoIncidenciaCliente(valor);
            return Number.isInteger(numero) ? numero.toString() : numero.toFixed(1);
          }
        },

            <div class="rounded-2xl border px-4 py-3 text-sm font-semibold"
              :class="capturaHabilitada ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-red-50 border-red-200 text-red-700'">
              <i :class="capturaHabilitada ? 'fas fa-lock-open mr-2' : 'fas fa-lock mr-2'"></i>
              {{ (accesoCaptura && accesoCaptura.mensaje) || 'Sin información de ventana de captura.' }}
              <span v-if="accesoCaptura && accesoCaptura.etiquetaVentana" class="block text-xs font-medium mt-1 opacity-80">Ventana configurada: {{ accesoCaptura.etiquetaVentana }}</span>

                  </p>
                </div>
                <div class="grid grid-cols-2 gap-3 min-w-[18rem]">
                  <div class="bg-white/12 backdrop-blur rounded-2xl p-4">
                    <div class="text-xs uppercase font-black text-sky-100">Docentes</div>
                    <div class="text-3xl font-black">{{ docentesResumen.length }}</div>
                  </div>
                  <div class="bg-white/12 backdrop-blur rounded-2xl p-4">
                    <div class="text-xs uppercase font-black text-sky-100">Registros</div>

                  <div class="bg-white/12 backdrop-blur rounded-2xl p-4">

    function formatearMonedaNomina(valor) {
      return formatearMonedaMX(valor);
    }

    function cargarNomina(contenedor) {
      montarVistaSync(contenedor, {
        shellAppKey: 'nominaShellVueApp',
        childAppKey: 'nominaVueApp',
        rootId: 'nomina-shell-root',
        mounter: montarNominaVue
      });
    }

    function montarNominaVue(root, payloadInicial = null) {
      const { createApp } = Vue;

      window.nominaVueApp = createApp({
        data() {
          return {
            cargando: !payloadInicial,
            error: '',
            esAdmin: !!(payloadInicial && payloadInicial.esAdmin),
            periodo: (payloadInicial && payloadInicial.periodo) || '',
            pesos: (payloadInicial && payloadInicial.pesos) || {},
            registrosBase: (payloadInicial && payloadInicial.nominaVista) || [],
            coordinacionesDisponibles: (payloadInicial && payloadInicial.coordinacionesDisponibles) || [],
            coordinacionSesion: (payloadInicial && payloadInicial.coordinacionSesion) || nombreCoordinadorActual || '',
            rolSesion: (payloadInicial && payloadInicial.rolSesion) || rolUsuarioActual || '',
            filtroTexto: '',
            filtroTipoPago: 'TODOS',
            filtroVista: 'TODOS',
            filtroCoordinacion: 'TODOS',
            registroSeleccionado: null,
            mensaje: { tipo: '', texto: '' }
          };
        },
        computed: {
          coordinacionActivaLabel() {
            if (!this.esAdmin) return this.coordinacionSesion || 'Sin coordinación';
            return this.filtroCoordinacion === 'TODOS' ? 'Todas las coordinaciones' : this.filtroCoordinacion;
          },
          registrosCoordinacion() {
            if (!this.esAdmin) return this.registrosBase;
            if (this.filtroCoordinacion === 'TODOS') return this.registrosBase;
            return this.registrosBase.filter(r => (r.coord || '') === this.filtroCoordinacion);
          },
          registrosFiltrados() {
            const texto = (this.filtroTexto || '').toLowerCase().trim();
            return this.registrosCoordinacion.filter(r => {
              const coincideTexto = !texto || [
                r.docente, r.coord, r.tipoPago, r.tipoPagoDesc, r.rfc, r.correo, r.categoria,
                (r.alertasExpediente || []).join(' ')
              ].join(' ').toLowerCase().includes(texto);

              const coincideTipoPago = this.filtroTipoPago === 'TODOS' || (r.tipoPago || '') === this.filtroTipoPago;
              const tieneExtras = (parseFloat(r.extras) || 0) > 0;
              const tieneDescuentos = (parseFloat(r.faltas) || 0) > 0 || (parseFloat(r.retardos) || 0) > 0 || (parseFloat(r.descRet) || 0) > 0;
              const tieneAlertas = (r.alertasExpediente || []).length > 0;

              const coincideVista = this.filtroVista === 'TODOS'
                || (this.filtroVista === 'CON_EXTRAS' && tieneExtras)
                || (this.filtroVista === 'CON_DESCUENTOS' && tieneDescuentos)
                || (this.filtroVista === 'SIN_MOVIMIENTO' && !tieneExtras && !tieneDescuentos)
                || (this.filtroVista === 'CON_ALERTAS' && tieneAlertas);

              return coincideTexto && coincideTipoPago && coincideVista;
            }).sort((a, b) => {
              const aPago = parseFloat(a.pago) || 0;
              const bPago = parseFloat(b.pago) || 0;
              if (bPago !== aPago) return bPago - aPago;
              return (a.docente || '').localeCompare((b.docente || ''), 'es', { sensitivity: 'base' });
            });
          },
          resumenVisible() {
            return this.registrosFiltrados.reduce((acc, r) => {
              acc.docentes += 1;
              acc.pagoBruto += parseFloat(r.pagoBrutoBase) || 0;
              acc.pagoBase += parseFloat(r.pagoBaseNeto) || 0;
              acc.descFaltasMonto += parseFloat(r.descFaltasMonto) || 0;
              acc.descRetMonto += parseFloat(r.descRetMonto) || 0;
              acc.descuentosMonto += parseFloat(r.descuentosMonto) || 0;
              acc.horasBase += parseFloat(r.hBase) || 0;
              acc.horasExtras += parseFloat(r.extras) || 0;
              acc.extrasMonto += parseFloat(r.extrasMonto) || 0;
              acc.total += parseFloat(r.pago) || 0;
              return acc;
            }, {
              docentes: 0,
              pagoBruto: 0,
              pagoBase: 0,
              descFaltasMonto: 0,
              descRetMonto: 0,
              descuentosMonto: 0,
              horasBase: 0,
              horasExtras: 0,
              extrasMonto: 0,
              total: 0
            });
          },
          resumenCabecera() {
            return {
              total: this.resumenVisible.total,
              docentes: this.resumenVisible.docentes,
              horasExtras: this.resumenVisible.horasExtras,
              descuentos: this.resumenVisible.descuentosMonto
            };
          },
          detalleSeleccionado() {
            return this.registroSeleccionado || this.registrosFiltrados[0] || null;
          }
        },
        mounted() {
          if (payloadInicial) {
            this.aplicarPayload(payloadInicial);
          } else {
            this.cargar();
          }
        },
        watch: {
          registrosFiltrados(nuevos) {
            if (!nuevos.length) {
              this.registroSeleccionado = null;
              return;
            }
            if (!this.registroSeleccionado || !nuevos.some(r => r.llave === this.registroSeleccionado.llave)) {
              this.registroSeleccionado = nuevos[0];
            }
          }
        },
        methods: {
          formatearMonedaNomina,
          abrirMenu: abrirMenuLateral,
          aplicarPayload(payload) {
            this.error = '';
            this.esAdmin = !!payload.esAdmin;
            this.periodo = payload.periodo || '';
            this.pesos = payload.pesos || {};
            this.registrosBase = payload.nominaVista || [];
            this.coordinacionesDisponibles = payload.coordinacionesDisponibles || [];
            this.coordinacionSesion = payload.coordinacionSesion || nombreCoordinadorActual || '';
            this.rolSesion = payload.rolSesion || rolUsuarioActual || '';
            this.filtroCoordinacion = this.esAdmin
              ? (((payload.coordinacionSesion && (payload.coordinacionesDisponibles || []).includes(payload.coordinacionSesion)) ? payload.coordinacionSesion : 'TODOS'))
              : (payload.coordinacionSesion || nombreCoordinadorActual || 'TODOS');
            this.registroSeleccionado = this.registrosFiltrados[0] || null;
          },
          async cargar() {
            this.cargando = true;
            this.error = '';
            try {
              const res = await services.nomina.obtenerDatos(tokenSesionActual);
              this.cargando = false;
              if (!res.success) {
                this.error = res.error || 'No fue posible cargar la nómina.';
                return;
              }
              this.aplicarPayload(res);
            } catch (err) {
              if (esErrorSesionExpirada(err)) return;
              this.cargando = false;
              this.error = obtenerMensajeError(err, 'Error de conexión al cargar la nómina.');
            }
          },
          setMensaje(tipo, texto) {
            asignarMensajeTemporal(this, tipo, texto, 2800);
          },
          limpiarFiltros() {
            this.filtroTexto = '';
            this.filtroTipoPago = 'TODOS';
            this.filtroVista = 'TODOS';
            this.filtroCoordinacion = this.esAdmin ? 'TODOS' : this.coordinacionSesion;
          },
          seleccionarRegistro(reg) {
            this.registroSeleccionado = reg;
          },
          claseFila(reg) {
            const tieneAlertas = (reg.alertasExpediente || []).length > 0;
            const tieneExtras = (parseFloat(reg.extras) || 0) > 0;
            const tieneDescuentos = (parseFloat(reg.faltas) || 0) > 0 || (parseFloat(reg.retardos) || 0) > 0 || (parseFloat(reg.descRet) || 0) > 0;
            if (this.detalleSeleccionado && this.detalleSeleccionado.llave === reg.llave) return 'bg-blue-50';
            if (tieneAlertas) return 'bg-red-50/50';
            if (tieneDescuentos) return 'bg-amber-50/50';
            if (tieneExtras) return 'bg-emerald-50/50';
            return 'bg-white';
          },
          claseBadgePago(tipo) {
            if (tipo === 'E') return 'bg-emerald-50 text-emerald-700 border-emerald-200';
            if (tipo === '1') return 'bg-red-50 text-red-700 border-red-200';
            if (tipo === '2') return 'bg-blue-50 text-blue-700 border-blue-200';
            return 'bg-slate-50 text-slate-700 border-slate-200';
          },
          descripcionTipoPago: describirTipoPago,
          badgeAlerta(alerta) {
            const mapa = {
              'Sin constancia fiscal': 'bg-amber-50 text-amber-700 border-amber-200',
              'Sin RFC': 'bg-red-50 text-red-700 border-red-200',
              'Sin banco / cuenta': 'bg-sky-50 text-sky-700 border-sky-200',
              'Tipo de pago sin definir': 'bg-slate-50 text-slate-700 border-slate-200'
            };
            return mapa[alerta] || 'bg-slate-50 text-slate-700 border-slate-200';
          },
          exportarCSV() {
            if (!this.registrosFiltrados.length) {
              this.setMensaje('error', 'No hay registros visibles para exportar.');
              return;
            }
            const encabezados = [
              'Coordinacion','Docente','Tipo de pago','Descripcion tipo pago','Horas base qna','Pago base bruto','Descuento faltas hrs','Descuento faltas monto','Retardos','Descuento retardos hrs','Descuento retardos monto','Pago base neto','Extras hrs','Extras monto','Total a pagar','Categoria','RFC','Banco','Correo','Alertas'
            ];
            const escapar = (v) => '"' + ((v ?? '').toString().replace(/"/g, '""')) + '"';
            const filas = this.registrosFiltrados.map(r => [
              r.coord || '',
              r.docente || '',
              r.tipoPago || '',
              r.tipoPagoDesc || this.descripcionTipoPago(r.tipoPago),
              (parseFloat(r.hBase) || 0).toFixed(1),
              (parseFloat(r.pagoBrutoBase) || 0).toFixed(2),
              (parseFloat(r.faltas) || 0).toFixed(1),
              (parseFloat(r.descFaltasMonto) || 0).toFixed(2),
              parseFloat(r.retardos) || 0,
              (parseFloat(r.descRet) || 0).toFixed(1),
              (parseFloat(r.descRetMonto) || 0).toFixed(2),
              (parseFloat(r.pagoBaseNeto) || 0).toFixed(2),
              (parseFloat(r.extras) || 0).toFixed(1),
              (parseFloat(r.extrasMonto) || 0).toFixed(2),
              (parseFloat(r.pago) || 0).toFixed(2),
              r.categoria || '',
              r.rfc || '',
              r.bancoDetalle || '',
              r.correo || '',
              (r.alertasExpediente || []).join(' | ')
            ].map(escapar).join(','));
            const csv = '\ufeff' + [encabezados.map(escapar).join(','), ...filas].join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });

            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            this.setMensaje('ok', 'CSV generado correctamente.');

      return {

    function cargarConfiguracionCalendario(contenedor) {
      montarVistaSync(contenedor, {
        shellAppKey: 'configuracionCalendarioShellVueApp',
        childAppKey: 'configuracionCalendarioVueApp',
        rootId: 'configuracion-calendario-shell-root',
        mounter: montarConfiguracionCalendarioVue
      });
    }

    function montarConfiguracionCalendarioVue(root) {
      const { createApp } = Vue;
      window.configuracionCalendarioVueApp = createApp({
        data() {
          return {
            cargando: true,
            error: '',
            guardando: false,
            rellenandoCiclo: false,
            mensaje: { tipo: '', texto: '' },
            rolSesion: (rolUsuarioActual || '').toLowerCase(),
            form: {
              quincenaInicio: '',
              quincenaFin: '',
              diasAccesoIncidencias: 5,
              diasAccesoExtras: 5,
              mod1Inicio: '',
              mod1Fin: '',
              mod2Inicio: '',
              mod2Fin: '',
              diasInhabilesTexto: '',
              horariosDestinoHabilitado: false,
              horariosDestinoPeriodo: '',
              horariosDestinoCuatrimestre: ''
            },
            configuracionActual: {}
          };
        },
        computed: {
          puedeEditar() { return this.rolSesion === 'admin'; },
          vistaVentanas() { return (this.configuracionActual && this.configuracionActual.ventanasCaptura) || {}; },
          periodoOperativo() { return (this.configuracionActual && this.configuracionActual.periodoOperativo) || ''; },
          cuatrimestreOperativo() { return (this.configuracionActual && this.configuracionActual.cuatrimestreOperativo) || ''; },
          cicloOperativoValido() { return !!(this.configuracionActual && this.configuracionActual.cicloOperativoValido); },
          horariosDestinoActivo() { return !!(this.configuracionActual && this.configuracionActual.horariosDestinoHabilitado && this.configuracionActual.horariosDestinoPeriodo && this.configuracionActual.horariosDestinoCuatrimestre); },
          periodoDestinoHorarios() { return (this.configuracionActual && this.configuracionActual.horariosDestinoPeriodo) || ''; },
          cuatrimestreDestinoHorarios() { return (this.configuracionActual && this.configuracionActual.horariosDestinoCuatrimestre) || ''; }
        },
        mounted() {
          this.cargar();
        },
        methods: {
          abrirMenu: abrirMenuLateral,
          setMensaje(tipo, texto) {
            asignarMensajeTemporal(this, tipo, texto, 3500);
          },
          aplicarDesdeConfiguracion(cfg) {
            cfg = cfg || {};
            this.configuracionActual = cfg;
            this.form = {
              quincenaInicio: cfg.quincenaInicio || '',
              quincenaFin: cfg.quincenaFin || '',
              diasAccesoIncidencias: cfg.diasAccesoIncidencias ?? 5,
              diasAccesoExtras: cfg.diasAccesoExtras ?? 5,
              mod1Inicio: cfg.mod1Inicio || '',
              mod1Fin: cfg.mod1Fin || '',
              mod2Inicio: cfg.mod2Inicio || '',
              mod2Fin: cfg.mod2Fin || '',
              diasInhabilesTexto: (cfg.diasInhabiles || []).join('\n'),
              horariosDestinoHabilitado: !!cfg.horariosDestinoHabilitado,
              horariosDestinoPeriodo: cfg.horariosDestinoPeriodo || '',
              horariosDestinoCuatrimestre: cfg.horariosDestinoCuatrimestre || ''
            };
          },
          obtenerDiasInhabilesFormulario() {
            return (this.form.diasInhabilesTexto || '')
              .split(/\r?\n|,|;/)
              .map(v => (v || '').trim())
              .filter(Boolean);
          },
          formatearFechaIsoSegura(iso) {
            const valor = (iso || '').toString().trim();
            if (!/^\d{4}-\d{2}-\d{2}$/.test(valor)) return '—';
            const partes = valor.split('-');
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
          },
          textoVentana(etiqueta, ventana) {
            if (!ventana) return 'Sin configuración.';
            const inicio = this.formatearFechaIsoSegura(ventana.inicio || this.configuracionActual.quincenaInicio || '');
            const fin = this.formatearFechaIsoSegura(ventana.fin || this.configuracionActual.quincenaFin || '');
            const dias = parseInt(ventana.diasConfigurados, 10) || 0;
            if (dias <= 0) {
              return `El acceso a ${etiqueta.toLowerCase()} está cerrado porque se configuraron 0 días de captura.`;
            }
            if (inicio === '—' || fin === '—') {
              return ventana.mensaje || 'Sin configuración.';
            }
            return `${etiqueta} ${ventana.abierta ? 'abierto' : 'programado'} del ${inicio} al ${fin}.`;
          },
          async cargar() {
            this.cargando = true;
            this.error = '';
            try {
              const res = await services.calendario.obtenerPanel(tokenSesionActual);
              this.cargando = false;
              if (!res.success) {
                this.error = res.error || 'No fue posible cargar la configuración de calendario.';
                return;
              }
              this.rolSesion = (res.rol || rolUsuarioActual || '').toLowerCase();
              this.aplicarDesdeConfiguracion(res.configuracion || {});
            } catch (err) {
              if (esErrorSesionExpirada(err)) return;
              this.cargando = false;
              this.error = obtenerMensajeError(err, 'Error de conexión al cargar la configuración de calendario.');
            }
          },
          guardar() {
            if (!this.puedeEditar) {
              this.setMensaje('error', 'Solo el administrador puede modificar esta configuración.');
              return;
            }
            this.guardando = true;
            services.calendario.guardar(tokenSesionActual, {
                quincenaInicio: this.form.quincenaInicio,
                quincenaFin: this.form.quincenaFin,
                diasAccesoIncidencias: parseInt(this.form.diasAccesoIncidencias, 10),
                diasAccesoExtras: parseInt(this.form.diasAccesoExtras, 10),
                mod1Inicio: this.form.mod1Inicio,
                mod1Fin: this.form.mod1Fin,
                mod2Inicio: this.form.mod2Inicio,
                mod2Fin: this.form.mod2Fin,
                diasInhabiles: this.obtenerDiasInhabilesFormulario(),
                horariosDestinoHabilitado: !!this.form.horariosDestinoHabilitado,
                horariosDestinoPeriodo: (this.form.horariosDestinoPeriodo || '').trim(),
                horariosDestinoCuatrimestre: (this.form.horariosDestinoCuatrimestre || '').trim()
              })
              .then((res) => {
                this.guardando = false;
                if (!res.success) {
                  this.setMensaje('error', res.error || 'No fue posible guardar la configuración.');
                  return;
                }
                this.rolSesion = (res.rol || this.rolSesion || rolUsuarioActual || '').toLowerCase();
                this.aplicarDesdeConfiguracion(res.configuracion || {});
                this.setMensaje('ok', res.message || 'Configuración guardada correctamente.');
              })
              .catch((err) => {
                if (esErrorSesionExpirada(err)) return;
                this.guardando = false;
                this.setMensaje('error', 'Error de conexión al guardar: ' + obtenerMensajeError(err));
              });
          },
          rellenarCicloRegistrosActuales() {
            if (!this.puedeEditar) {
              this.setMensaje('error', 'Solo el administrador puede ejecutar esta acción.');
              return;
            }
            if (!this.cicloOperativoValido) {
              this.setMensaje('error', 'Configura primero Inicio Mod 1 y Fin Mod 2 para calcular Periodo y Cuatrimestre.');
              return;
            }
            const confirmado = window.confirm(`Se completarán los campos PERIODO y CUATRIMESTRE vacíos en Horarios Doc y Extras usando el ciclo ${this.cuatrimestreOperativo} (${this.periodoOperativo}). ¿Deseas continuar?`);
            if (!confirmado) return;

            this.rellenandoCiclo = true;
            services.calendario.rellenarCicloActivo(tokenSesionActual)
              .then((res) => {
                this.rellenandoCiclo = false;
                if (!res.success) {
                  this.setMensaje('error', res.error || 'No fue posible actualizar los registros activos.');
                  return;
                }
                this.aplicarDesdeConfiguracion(res.configuracion || this.configuracionActual || {});
                const resumen = res.resumen || {};
                this.setMensaje('ok', `Registros actualizados. Horarios: ${resumen.horariosActualizados || 0} · Extras: ${resumen.extrasActualizados || 0}.`);
              })
              .catch((err) => {
                if (esErrorSesionExpirada(err)) return;
                this.rellenandoCiclo = false;
                this.setMensaje('error', 'Error de conexión al actualizar registros: ' + obtenerMensajeError(err));
              });
          }
        },

        shellAppKey: 'bitacoraEliminadosHorariosShellVueApp',
        childAppKey: 'bitacoraEliminadosHorariosVueApp',

      });
    }

    function montarBitacoraEliminadosHorariosVue(root) {
      const { createApp } = Vue;
      window.bitacoraEliminadosHorariosVueApp = createApp({
        data() {
          return {
            cargando: true,
            error: '',
            mensaje: { tipo: '', texto: '' },
            registros: [],
            resumen: {
              totalRegistros: 0,
              totalDocentes: 0,
              totalCoordinaciones: 0,
              totalHorasBase: 0,
              totalHorasIncidencias: 0
            },
            filtroTexto: '',
            filtroCoordinador: 'TODOS',
            filtroUsuario: 'TODOS'
          };
        },
        computed: {
          coordinadoresDisponibles() {
            return Array.from(new Set((this.registros || []).map(r => (r.coordinadorRegistro || '').trim()).filter(Boolean)))
              .sort((a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' }));
          },
          usuariosDisponibles() {
            return Array.from(new Set((this.registros || []).map(r => (r.usuarioEliminacion || '').trim()).filter(Boolean)))
              .sort((a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' }));
          },
          registrosFiltrados() {
            const texto = (this.filtroTexto || '').toLowerCase().trim();
            return (this.registros || []).filter(r => {
              const coincideTexto = !texto || [
                r.docente, r.asignatura, r.grupo, r.coordinadorRegistro, r.coordinadorSesion, r.usuarioEliminacion, r.tabulador
              ].join(' ').toLowerCase().includes(texto);

              const coincideCoordinador = this.filtroCoordinador === 'TODOS' || (r.coordinadorRegistro || '') === this.filtroCoordinador;
              const coincideUsuario = this.filtroUsuario === 'TODOS' || (r.usuarioEliminacion || '') === this.filtroUsuario;

              return coincideTexto && coincideCoordinador && coincideUsuario;
            });
          },
          resumenFiltrado() {
            const docentes = {};
            const coordinaciones = {};
            const base = this.registrosFiltrados.reduce((acc, r) => {
              acc.total += 1;
              acc.horasBase += parseFloat(r.horasBase) || 0;
              acc.faltas += parseFloat(r.faltas) || 0;
              acc.extras += parseFloat(r.extras) || 0;
              if (r.docente) docentes[r.docente] = true;
              if (r.coordinadorRegistro) coordinaciones[r.coordinadorRegistro] = true;
              return acc;
            }, { total: 0, horasBase: 0, faltas: 0, extras: 0 });

            base.docentes = Object.keys(docentes).length;
            base.coordinaciones = Object.keys(coordinaciones).length;
            return base;
          }
        },
        mounted() {
          this.cargar();
        },
        methods: {
          abrirMenu: abrirMenuLateral,
          setMensaje(tipo, texto) {
            asignarMensajeTemporal(this, tipo, texto, 3200);

          formatearMoneda: formatearMonedaMX,
          formatearHoras(valor) {
            return formatearHorasNumero(valor, 1);
          },
          limpiarFiltros() {
            this.filtroTexto = '';
            this.filtroCoordinador = 'TODOS';
            this.filtroUsuario = 'TODOS';
          },
          async cargar() {
            this.cargando = true;
            this.error = '';
            try {
              const res = await services.horarios.obtenerBitacora(tokenSesionActual);
              this.cargando = false;
              if (!res.success) {
                this.error = res.error || 'No fue posible cargar la bitácora de eliminados.';
                return;
              }
              this.registros = res.registros || [];
              this.resumen = res.resumen || this.resumen;
            } catch (err) {
              if (esErrorSesionExpirada(err)) return;
              this.cargando = false;
              this.error = obtenerMensajeError(err, 'Error de conexión al cargar la bitácora.');
            }
          },
          exportarCSV() {
            if (!this.registrosFiltrados.length) {
              this.setMensaje('error', 'No hay registros visibles para exportar.');
              return;
            }

            const headers = [
              'Fecha eliminación','Usuario eliminación','Rol eliminación','Coordinador sesión','Fila origen',
              'Coordinador registro','Asignatura','Docente','Grupo','Tabulador','Monto tabulador',
              'L','M','X','J','V','S1','S2','Horas base','Faltas','Retardos','Extras','Total semana','Total Mod 1','Total Mod 2'
            ];
            const escape = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
            const rows = this.registrosFiltrados.map(r => [
              r.fechaEliminacion, r.usuarioEliminacion, r.rolEliminacion, r.coordinadorSesion, r.filaOrigen,
              r.coordinadorRegistro, r.asignatura, r.docente, r.grupo, r.tabulador, (parseFloat(r.montoTabulador) || 0).toFixed(2),
              this.formatearHoras(r.l), this.formatearHoras(r.m), this.formatearHoras(r.x), this.formatearHoras(r.j), this.formatearHoras(r.v),
              this.formatearHoras(r.s1), this.formatearHoras(r.s2), this.formatearHoras(r.horasBase), this.formatearHoras(r.faltas),
              this.formatearHoras(r.retardos), this.formatearHoras(r.extras), this.formatearHoras(r.totalSemana), this.formatearHoras(r.totalMod1),
              this.formatearHoras(r.totalMod2)
            ]);
            const csv = '\ufeff' + [headers.map(escape).join(','), ...rows.map(row => row.map(escape).join(','))].join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const fecha = new Date().toISOString().slice(0, 10);
            a.href = url;
            a.download = `bitacora_eliminados_horarios_${fecha}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            this.setMensaje('ok', `Se exportaron ${this.registrosFiltrados.length} registro${this.registrosFiltrados.length === 1 ? '' : 's'}.`);
          }
        },

    function cargarCierreCuatrimestre(contenedor) {
      montarVistaSync(contenedor, {
        shellAppKey: 'cierreCuatrimestreShellVueApp',
        childAppKey: 'cierreCuatrimestreVueApp',
        rootId: 'cierre-cuatrimestre-shell-root',
        mounter: montarCierreCuatrimestreVue
      });
    }

    function montarCierreCuatrimestreVue(root) {
      const { createApp } = Vue;
      window.cierreCuatrimestreVueApp = createApp({
        data() {
          return {
            cargando: true,
            error: '',
            cargandoPreview: false,
            ejecutando: false,
            mensaje: { tipo: '', texto: '' },
            rolSesion: (rolUsuarioActual || '').toLowerCase(),
            form: {
              periodo: '',
              cuatrimestre: '',
              observacion: '',
              confirmacion: ''
            },
            cicloActual: {
              periodo: '',
              cuatrimestre: '',
              valido: false
            },
            preview: {
              periodo: '',
              cuatrimestre: '',
              horarios: { total: 0, docentes: 0, coordinaciones: 0, horasBase: 0 },
              extras: { total: 0, docentes: 0, coordinaciones: 0, horas: 0, monto: 0 },
              consolidado: { docentes: 0, coordinaciones: 0, registros: 0 },
              hayCoincidencias: false
            },
            diagnostico: null,
            cargandoDiagnostico: false,
            bitacora: [],
            ultimoResultado: null
          };
        },
        computed: {
          puedeEditar() { return this.rolSesion === 'admin'; },
          confirmacionValida() { return (this.form.confirmacion || '').trim().toUpperCase() === 'CONFIRMAR REINICIO'; },
          totalRegistrosPreview() {
            return (this.preview && this.preview.consolidado && this.preview.consolidado.registros) || 0;
          }
        },
        mounted() {
          this.cargar();
        },
        methods: {
          abrirMenu: abrirMenuLateral,
          formatearMoneda: formatearMonedaMX,
          formatearHoras: formatearHorasNumero,
          setMensaje(tipo, texto) {
            asignarMensajeTemporal(this, tipo, texto, 3800);
          },
          aplicarPanel(panel) {
            panel = panel || {};
            this.rolSesion = (panel.rol || this.rolSesion || rolUsuarioActual || '').toLowerCase();
            this.cicloActual = panel.cicloActual || { periodo: '', cuatrimestre: '', valido: false };
            this.form.periodo = this.cicloActual.periodo || this.form.periodo || '';
            this.form.cuatrimestre = this.cicloActual.cuatrimestre || this.form.cuatrimestre || '';
            this.preview = panel.preview || this.preview;
            this.bitacora = panel.bitacora || [];
          },
          async cargar() {
            this.cargando = true;
            this.error = '';
            try {
              const res = await services.cierre.obtenerPanel(tokenSesionActual);
              this.cargando = false;
              if (!res.success) {
                this.error = res.error || 'No fue posible cargar el módulo de cierre de cuatrimestre.';
                return;
              }
              this.aplicarPanel(res);
            } catch (err) {
              if (esErrorSesionExpirada(err)) return;
              this.cargando = false;
              this.error = obtenerMensajeError(err, 'Error de conexión al cargar el módulo.');
            }
          },
          async refrescarPreview() {
            this.form.periodo = normalizarPeriodoCierreCliente(this.form.periodo);
            this.form.cuatrimestre = normalizarCuatrimestreCierreCliente(this.form.cuatrimestre);
            this.cargandoPreview = true;
            try {
              const res = await services.cierre.obtenerPreview(tokenSesionActual, {
                periodo: this.form.periodo,
                cuatrimestre: this.form.cuatrimestre
              });
              this.cargandoPreview = false;
              if (!res.success) {
                this.setMensaje('error', res.error || 'No fue posible obtener la vista previa.');
                return;
              }
              this.preview = res.preview || this.preview;
              this.setMensaje('ok', 'Vista previa actualizada.');
            } catch (err) {
              if (esErrorSesionExpirada(err)) return;
              this.cargandoPreview = false;
              this.setMensaje('error', 'Error de conexión al obtener la vista previa: ' + obtenerMensajeError(err));
            }
          },
          async ejecutarDiagnostico() {
            this.form.periodo = normalizarPeriodoCierreCliente(this.form.periodo);
            this.form.cuatrimestre = normalizarCuatrimestreCierreCliente(this.form.cuatrimestre);
            this.cargandoDiagnostico = true;
            try {
              const res = await services.cierre.diagnostico(tokenSesionActual, {
                periodo: this.form.periodo,
                cuatrimestre: this.form.cuatrimestre
              });
              this.cargandoDiagnostico = false;
              if (!res.success) {
                this.setMensaje('error', res.error || 'No fue posible generar el diagnóstico.');
                return;
              }
              this.diagnostico = res.diagnostico || null;
              this.setMensaje('ok', 'Diagnóstico temporal generado.');
            } catch (err) {
              if (esErrorSesionExpirada(err)) return;
              this.cargandoDiagnostico = false;
              this.setMensaje('error', 'Error de conexión al generar el diagnóstico: ' + obtenerMensajeError(err));
            }
          },
          usarCicloActual() {
            this.form.periodo = normalizarPeriodoCierreCliente(this.cicloActual.periodo || '');
            this.form.cuatrimestre = normalizarCuatrimestreCierreCliente(this.cicloActual.cuatrimestre || '');
            this.refrescarPreview();
          },
          descripcionAccion(accion) {
            if (accion === 'HORARIOS') return 'archivar y limpiar Horarios';
            if (accion === 'EXTRAS') return 'archivar y limpiar Extras';
            return 'ejecutar el reinicio completo';
          },
          async ejecutar(accion) {
            if (!this.puedeEditar) {
              this.setMensaje('error', 'Solo el administrador puede ejecutar esta acción.');
              return;
            }
            this.form.periodo = normalizarPeriodoCierreCliente(this.form.periodo);
            this.form.cuatrimestre = normalizarCuatrimestreCierreCliente(this.form.cuatrimestre);
            if (!this.confirmacionValida) {
              this.setMensaje('error', 'Escribe CONFIRMAR REINICIO para habilitar la ejecución.');
              return;
            }
            if (!this.totalRegistrosPreview) {
              this.setMensaje('error', 'No hay registros del ciclo seleccionado para procesar.');
              return;
            }
            const confirmado = window.confirm(`Se procederá a ${this.descripcionAccion(accion)} para ${this.form.cuatrimestre} (${this.form.periodo}). Esta acción archivará y limpiará la base activa. ¿Deseas continuar?`);
            if (!confirmado) return;

            this.ejecutando = true;
            try {
              const res = await services.cierre.ejecutar(tokenSesionActual, {
                accion,
                periodo: (this.form.periodo || '').trim(),
                cuatrimestre: (this.form.cuatrimestre || '').trim(),
                observacion: (this.form.observacion || '').trim()
              });
              this.ejecutando = false;
              if (!res.success) {
                this.setMensaje('error', res.error || 'No fue posible ejecutar el cierre del cuatrimestre.');
                return;
              }
              this.preview = res.preview || this.preview;
              this.bitacora = res.bitacora || this.bitacora;
              this.form.confirmacion = '';
              const resumen = res.resultado || {};
              this.ultimoResultado = resumen;
              this.setMensaje('ok', `Cierre ejecutado. Horarios: ${resumen.horariosArchivados || 0} · Extras: ${resumen.extrasArchivados || 0} · Migrados desde Ciclo Destino: ${resumen.registrosMigradosDesdeDestino || 0}.`);
            } catch (err) {
              if (esErrorSesionExpirada(err)) return;
              this.ejecutando = false;
              this.setMensaje('error', 'Error de conexión al ejecutar el cierre: ' + obtenerMensajeError(err));
            }
          }
        },

    function cargarCapturarExtras(contenedor) {
      montarVistaAsync(contenedor, {
        shellAppKey: 'capturarExtrasShellVueApp',
        childAppKey: 'capturarExtrasVueApp',
        rootId: 'capturar-extras-shell-root',
        title: 'Capturar Horas Extras',
        loaderText: 'Cargando docentes y bitácora de extras...',
        loaderIconClass: 'fa-sync text-emerald-500',
        fetcher: () => services.extras.obtenerDatos(obtenerTokenSesionActual()),
        mounter: montarCapturarExtrasVue
      });
    }

    function montarCapturarExtrasVue(root, payload) {
      const { createApp } = Vue;

      window.capturarExtrasVueApp = createApp({
        data() {
          return {
            cargando: false,
            guardando: false,
            modo: 'crear',
            mensaje: { tipo: '', texto: '' },
            docentes: payload.docentes || [],
            registros: payload.registros || [],
            filtrosCargaDisponibles: payload.filtrosCargaDisponibles || [
              { valor: 'TODOS', etiqueta: 'Todos los docentes' },
              { valor: 'SOBRECARGA', etiqueta: 'Rebasan máximo global' },
              { valor: 'AL_LIMITE', etiqueta: 'Al límite global' },
              { valor: 'CERCA', etiqueta: 'Cerca del límite global' },
              { valor: 'DISPONIBLE', etiqueta: 'Disponibles' }
            ],
            resumen: payload.resumen || {
              totalRegistros: 0,
              totalHoras: 0,
              totalMonto: 0,
              docentesImpactados: 0,
              docentesSobrecarga: 0
            },
            filtroTexto: '',
            filtroEditable: 'TODOS',
            filtroCargaSelector: 'TODOS',
            filtroCargaBitacora: 'TODOS',
            filtroCoordinadorBitacora: 'TODOS',
            filtroQuincena: 'TODAS',
            filtroFechaDesde: '',
            filtroFechaHasta: '',
            accesoCaptura: payload.accesoCaptura || { permitido: true, mensaje: '', etiquetaVentana: '' },
            configuracionCalendario: payload.configuracionCalendario || {},
            form: obtenerFormularioExtraVacio()
          };
        },
        computed: {
          capturaHabilitada() {
            return !!(this.accesoCaptura && this.accesoCaptura.permitido);
          },
          docenteActual() {
            const clave = normalizarNombreComparableCliente(this.form.docente);
            if (!clave) return null;
            return this.docentes.find(doc => normalizarNombreComparableCliente(doc.docente) === clave) || null;
          },
          docentesSelector() {
            return (this.docentes || []).filter(doc => {
              if (this.filtroCargaSelector === 'TODOS') return true;
              return (doc.estadoCargaClave || 'DISPONIBLE') === this.filtroCargaSelector;
            });
          },
          coordinadoresBitacora() {
            const mapa = new Map();
            (this.registros || []).forEach(reg => {
              const coord = (reg.coordinador || '').toString().trim();
              if (!coord) return;
              if (!mapa.has(coord)) mapa.set(coord, coord);
            });
            return Array.from(mapa.values()).sort((a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' }));
          },
          totalCalculado() {
            const horas = parseFloat(this.form.horas) || 0;
            const tabulador = parseFloat(this.form.tabulador) || 0;
            return horas * tabulador;
          },
          registroEditando() {
            if (!(this.form.filaHoja > 1)) return null;
            return (this.registros || []).find(reg => reg.filaHoja === this.form.filaHoja) || null;
          },
          ajusteHorasEdicionDocenteActual() {
            if (!this.docenteActual || !this.registroEditando) return 0;
            const mismoDocente = normalizarNombreComparableCliente(this.registroEditando.docente) === normalizarNombreComparableCliente(this.docenteActual.docente);
            return mismoDocente ? (parseFloat(this.registroEditando.horas) || 0) : 0;
          },
          cargaDocenteProyectada() {
            if (!this.docenteActual) return null;
            const doc = this.docenteActual;
            const horasForm = parseFloat(this.form.horas) || 0;
            const horasOriginales = this.ajusteHorasEdicionDocenteActual;
            const extrasActuales = parseFloat(doc.horasExtrasAcumuladas) || 0;
            const extrasProyectadas = Math.max(0, extrasActuales - horasOriginales + horasForm);
            const semanaBase = parseFloat(doc.horasSemanaBase) || 0;
            const mod1Base = parseFloat(doc.horasMod1Base) || 0;
            const mod2Base = parseFloat(doc.horasMod2Base) || 0;
            const maxHoras = parseFloat(doc.maxHoras) || 0;
            const semana = semanaBase + extrasProyectadas;
            const mod1 = mod1Base + extrasProyectadas;
            const mod2 = mod2Base + extrasProyectadas;
            const estado = this.evaluarEstadoCargaGlobal(semana, mod1, mod2, maxHoras);
            return {
              horasExtrasActuales: extrasActuales,
              horasExtrasProyectadas: extrasProyectadas,
              horasSemana: semana,
              horasMod1: mod1,
              horasMod2: mod2,
              maxHoras,
              estadoClave: estado.clave,
              estadoEtiqueta: estado.etiqueta,
              estadoDimension: estado.dimensionEtiqueta,
              estadoValor: estado.valorDimension,
              detalle: `Base Horarios Doc · Semana ${this.formatearHoras(semanaBase)}/${this.formatearHoras(maxHoras)}h · Mod 1 ${this.formatearHoras(mod1Base)}/${this.formatearHoras(maxHoras)}h · Mod 2 ${this.formatearHoras(mod2Base)}/${this.formatearHoras(maxHoras)}h · Extras acumuladas ${this.formatearHoras(extrasProyectadas)}h · Total global proyectado · Semana ${this.formatearHoras(semana)}/${this.formatearHoras(maxHoras)}h · Mod 1 ${this.formatearHoras(mod1)}/${this.formatearHoras(maxHoras)}h · Mod 2 ${this.formatearHoras(mod2)}/${this.formatearHoras(maxHoras)}h`
            };
          },
          alertaCargaDocente() {
            if (!this.docenteActual || !this.cargaDocenteProyectada) return null;
            const doc = this.docenteActual;
            const carga = this.cargaDocenteProyectada;
            if (carga.estadoClave === 'SOBRECARGA') {
              return {
                tipo: 'error',
                titulo: 'Alerta de sobrecarga global',
                texto: `${doc.docente} rebasa su máximo permitido en ${carga.estadoDimension || 'una dimensión de carga'} con ${this.formatearHoras(carga.estadoValor)}/${this.formatearHoras(carga.maxHoras)}h considerando Horarios Doc + horas extra acumuladas${(parseFloat(this.form.horas) || 0) > 0 ? ' + la captura actual' : ''}. Puedes guardar el extra, pero la captura mostrará esta alerta.`
              };
            }
            if (carga.estadoClave === 'AL_LIMITE' || carga.estadoClave === 'CERCA') {
              return {
                tipo: 'warning',
                titulo: 'Docente cerca del límite',
                texto: `${doc.docente} queda ${carga.estadoEtiqueta.toLowerCase()} en ${carga.estadoDimension || 'su carga global'} con ${this.formatearHoras(carga.estadoValor)}/${this.formatearHoras(carga.maxHoras)}h considerando Horarios Doc + horas extra acumuladas${(parseFloat(this.form.horas) || 0) > 0 ? ' + la captura actual' : ''}.`
              };
            }
            return {
              tipo: 'ok',
              titulo: 'Carga global disponible',
              texto: `${doc.docente} aún tiene margen dentro de su carga global autorizada considerando Horarios Doc + horas extra acumuladas${(parseFloat(this.form.horas) || 0) > 0 ? ' + la captura actual' : ''}.`
            };
          },
          registrosVisibles() {
            const texto = (this.filtroTexto || '').toLowerCase().trim();
            return (this.registros || []).filter(reg => {
              const coincideTexto = !texto || [
                reg.docente,
                reg.coordinador,
                reg.motivo,
                reg.referencia,
                reg.observaciones,
                reg.capturadoPor
              ].some(v => (v || '').toString().toLowerCase().includes(texto));
              if (!coincideTexto) return false;

              if (this.filtroEditable === 'EDITABLES' && !reg.puedeEditar) return false;
              if (this.filtroEditable === 'NO_EDITABLES' && reg.puedeEditar) return false;

              const docenteReg = this.obtenerDocentePorNombre(reg.docente);
              const estadoCarga = docenteReg ? (docenteReg.estadoCargaClave || 'DISPONIBLE') : 'DISPONIBLE';
              if (this.filtroCargaBitacora !== 'TODOS' && estadoCarga !== this.filtroCargaBitacora) return false;

              if (this.filtroCoordinadorBitacora !== 'TODOS') {
                const coordReg = (reg.coordinador || '').toString().trim();
                if (coordReg !== this.filtroCoordinadorBitacora) return false;
              }

              const fechaIso = this.obtenerFechaIsoRegistro(reg);
              if (this.filtroQuincena !== 'TODAS') {
                const claveReg = this.obtenerClaveQuincenaDesdeIso(fechaIso);
                if (claveReg !== this.filtroQuincena) return false;
              }

              if (this.filtroFechaDesde && (!fechaIso || fechaIso < this.filtroFechaDesde)) return false;
              if (this.filtroFechaHasta && (!fechaIso || fechaIso > this.filtroFechaHasta)) return false;

              return true;
            });
          },
          resumenVisible() {
            const docentes = new Set();
            const docentesSobrecarga = new Set();
            let horas = 0;
            let monto = 0;
            this.registrosVisibles.forEach(reg => {
              if (reg.docente) docentes.add(reg.docente);
              const docenteReg = this.obtenerDocentePorNombre(reg.docente);
              if (docenteReg && (docenteReg.sobrecargaGlobal || docenteReg.sobrecargaSemanal)) docentesSobrecarga.add(reg.docente);
              horas += parseFloat(reg.horas) || 0;
              monto += parseFloat(reg.total) || 0;
            });
            return {
              totalRegistros: this.registrosVisibles.length,
              totalHoras: horas,
              totalMonto: monto,
              docentesImpactados: Array.from(docentes).filter(Boolean).length,
              docentesSobrecarga: Array.from(docentesSobrecarga).filter(Boolean).length
            };
          },
          registrosRecientesDocente() {
            if (!this.docenteActual) return [];
            const clave = normalizarNombreComparableCliente(this.docenteActual.docente);
            return this.registros
              .filter(reg => normalizarNombreComparableCliente(reg.docente) === clave)
              .slice(0, 5);
          },
          quincenasDisponibles() {
            const mapa = new Map();
            (this.registros || []).forEach(reg => {
              const iso = this.obtenerFechaIsoRegistro(reg);
              const clave = this.obtenerClaveQuincenaDesdeIso(iso);
              if (!clave) return;
              if (!mapa.has(clave)) {
                mapa.set(clave, this.etiquetaQuincenaPorClave(clave));
              }
            });
            return Array.from(mapa.entries())
              .sort((a, b) => a[0] < b[0] ? 1 : -1)
              .map(([valor, etiqueta]) => ({ valor, etiqueta }));
          },
          chipsBitacoraActivos() {
            const chips = [];
            if ((this.filtroTexto || '').trim()) {
              chips.push({ clave: 'filtroTexto', etiqueta: 'Texto', valor: this.filtroTexto.trim(), clases: 'bg-slate-100 text-slate-700 border-slate-200' });
            }
            if (this.filtroEditable !== 'TODOS') {
              chips.push({
                clave: 'filtroEditable',
                etiqueta: 'Mostrar',
                valor: this.filtroEditable === 'EDITABLES' ? 'Solo editables' : 'Solo no editables',
                clases: 'bg-blue-50 text-blue-700 border-blue-200'
              });
            }
            if (this.filtroCargaBitacora !== 'TODOS') {
              chips.push({
                clave: 'filtroCargaBitacora',
                etiqueta: 'Carga',
                valor: this.obtenerEtiquetaFiltroCarga(this.filtroCargaBitacora),
                clases: 'bg-amber-50 text-amber-800 border-amber-200'
              });
            }
            if (this.filtroCoordinadorBitacora !== 'TODOS') {
              chips.push({
                clave: 'filtroCoordinadorBitacora',
                etiqueta: 'Coordinador',
                valor: this.filtroCoordinadorBitacora,
                clases: 'bg-violet-50 text-violet-700 border-violet-200'
              });
            }
            if (this.filtroQuincena !== 'TODAS') {
              chips.push({
                clave: 'filtroQuincena',
                etiqueta: 'Quincena',
                valor: this.etiquetaQuincenaPorClave(this.filtroQuincena),
                clases: 'bg-emerald-50 text-emerald-700 border-emerald-200'
              });
            }
            if (this.filtroFechaDesde) {
              chips.push({
                clave: 'filtroFechaDesde',
                etiqueta: 'Desde',
                valor: this.filtroFechaDesde,
                clases: 'bg-cyan-50 text-cyan-700 border-cyan-200'
              });
            }
            if (this.filtroFechaHasta) {
              chips.push({
                clave: 'filtroFechaHasta',
                etiqueta: 'Hasta',
                valor: this.filtroFechaHasta,
                clases: 'bg-cyan-50 text-cyan-700 border-cyan-200'
              });
            }
            return chips;
          },
          chipSelectorCargaActivo() {
            if (this.filtroCargaSelector === 'TODOS') return null;
            return {
              clave: 'filtroCargaSelector',
              etiqueta: 'Selector',
              valor: this.obtenerEtiquetaFiltroCarga(this.filtroCargaSelector),
              clases: 'bg-indigo-50 text-indigo-700 border-indigo-200'
            };
          }
        },
        methods: {
          limpiarMensaje() {
            this.mensaje = { tipo: '', texto: '' };
          },
          mostrarMensaje(tipo, texto) {
            this.mensaje = { tipo, texto };
          },
          clasesMensaje() {
            if (this.mensaje.tipo === 'ok') return 'bg-green-50 text-green-700 border border-green-200';
            if (this.mensaje.tipo === 'error') return 'bg-red-50 text-red-700 border border-red-200';
            if (this.mensaje.tipo === 'aviso') return 'bg-amber-50 text-amber-800 border border-amber-200';
            return 'bg-blue-50 text-blue-700 border border-blue-200';
          },
          formatearMoneda: formatearMonedaMX,
          formatearHoras(valor) {
            const n = parseFloat(valor) || 0;
            return Number.isInteger(n) ? n.toString() : n.toFixed(1);
          },
          obtenerDocentePorNombre(nombre) {
            const clave = normalizarNombreComparableCliente(nombre);
            return (this.docentes || []).find(doc => normalizarNombreComparableCliente(doc.docente) === clave) || null;
          },
          evaluarEstadoCargaGlobal(semana, mod1, mod2, maxHoras) {
            const evaluarValor = (valor) => {
              if (valor > maxHoras) return { clave: 'SOBRECARGA', etiqueta: 'Rebasa máximo', dimensionEtiqueta: '', valorDimension: valor };
              if (valor >= maxHoras) return { clave: 'AL_LIMITE', etiqueta: 'Al límite', dimensionEtiqueta: '', valorDimension: valor };
              if (valor >= (maxHoras * 0.8)) return { clave: 'CERCA', etiqueta: 'Cerca del límite', dimensionEtiqueta: '', valorDimension: valor };
              return { clave: 'DISPONIBLE', etiqueta: 'Disponible', dimensionEtiqueta: '', valorDimension: valor };
            };

            const dimensiones = [
              { dimensionEtiqueta: 'Semana', valor: parseFloat(semana) || 0 },
              { dimensionEtiqueta: 'Mod 1', valor: parseFloat(mod1) || 0 },
              { dimensionEtiqueta: 'Mod 2', valor: parseFloat(mod2) || 0 }
            ];

            const prioridad = { DISPONIBLE: 1, CERCA: 2, AL_LIMITE: 3, SOBRECARGA: 4 };
            let peor = null;

            dimensiones.forEach(item => {
              const estadoBase = evaluarValor(item.valor);
              const actual = {
                clave: estadoBase.clave,
                etiqueta: estadoBase.etiqueta,
                dimensionEtiqueta: item.dimensionEtiqueta,
                valorDimension: item.valor
              };
              if (!peor) {
                peor = actual;
                return;
              }
              const prActual = prioridad[actual.clave] || 0;
              const prPeor = prioridad[peor.clave] || 0;
              if (prActual > prPeor || (prActual === prPeor && actual.valorDimension > peor.valorDimension)) {
                peor = actual;
              }
            });

            return peor || { clave: 'DISPONIBLE', etiqueta: 'Disponible', dimensionEtiqueta: 'Semana', valorDimension: 0 };
          },
          clasesCarga(doc) {
            const estado = (doc && (doc.estadoClave || doc.estadoCargaClave)) || 'DISPONIBLE';
            if (estado === 'SOBRECARGA') return 'border-red-200 bg-red-50 text-red-800';
            if (estado === 'AL_LIMITE') return 'border-orange-200 bg-orange-50 text-orange-800';
            if (estado === 'CERCA') return 'border-yellow-200 bg-yellow-50 text-yellow-800';
            return 'border-green-200 bg-green-50 text-green-800';
          },
          parseFechaFlexible(valor) {
            if (!valor) return null;
            if (typeof valor === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(valor)) {
              return valor;
            }
            const texto = (valor || '').toString().trim();
            if (!texto) return null;
            const soloFecha = texto.split(' ')[0];
            if (/^\d{4}-\d{2}-\d{2}$/.test(soloFecha)) return soloFecha;
            const partes = soloFecha.split('/');
            if (partes.length === 3) {
              const [dd, mm, yyyy] = partes;
              return `${yyyy}-${String(mm).padStart(2, '0')}-${String(dd).padStart(2, '0')}`;
            }
            return null;
          },
          obtenerFechaIsoRegistro(reg) {
            return this.parseFechaFlexible(reg.fechaActividadIso || reg.fechaActividad || reg.fechaRegistro || '');
          },
          obtenerClaveQuincenaDesdeIso(iso) {
            if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return '';
            const dia = parseInt(iso.slice(8, 10), 10);
            return `${iso.slice(0, 7)}-Q${dia <= 15 ? '1' : '2'}`;
          },
          etiquetaQuincenaPorClave(clave) {
            if (!clave) return 'Sin quincena';
            const base = clave.replace(/-Q[12]$/, '');

            return `${base} · ${etiqueta}`;
